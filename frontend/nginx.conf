server {
    # nginx-unprivileged runs as non-root and cannot bind port 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Backend API proxied from the same origin: the browser only ever talks
    # to this server, which avoids CORS and lets the backend trust same-origin
    # cookies for the upcoming session handling.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let the router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
