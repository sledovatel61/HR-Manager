# Конфигурация nginx для production-сборки frontend в Docker.
# Отдаёт статику Vite и проксирует API-запросы на backend, чтобы браузер
# работал с одним origin (CORS не нужен, cookie/сессии будут same-site).

upstream hr_manager_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Базовые заголовки безопасности для статического фронта.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # SPA-роутинг: неизвестные пути отдаём в index.html.
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        proxy_pass http://hr_manager_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass http://hr_manager_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
