[alembic]
# Расположение скриптов миграций.
script_location = alembic

# Каталог, добавляемый в sys.path (пакет приложения лежит в backend/src).
prepend_sys_path = src

# Шаблон имени новых ревизий: <rev>_<slug>
file_template = %%(rev)s_%%(slug)s

timezone = UTC

# Резервный URL БД — используется ТОЛЬКО если не задан DATABASE_URL.
# Приложение и миграции должны получать URL из окружения (см. env.py).
sqlalchemy.url = postgresql+psycopg://hr_manager:change-me-local-only@localhost:5432/hr_manager

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
