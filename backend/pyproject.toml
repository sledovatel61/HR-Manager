[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-manager-backend"
version = "0.1.0"
description = "HR Manager backend: FastAPI + SQLAlchemy 2 + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.3,<3",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: requires a real PostgreSQL instance (set TEST_DATABASE_URL)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008 (function call in argument defaults) is the standard, framework-level
# idiom for FastAPI's Depends()/Query()/Path() and is not a defect here.
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# User-facing messages and some comments are in Russian; RUF001/RUF002/RUF003
# flag intentionally mixed-script Cyrillic text.
"app/**" = ["RUF001", "RUF002", "RUF003"]
"tests/**" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Tests and alembic migrations are not importable as a top-level package;
# resolve them against the backend root instead of erroring on duplicate names.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# pytest fixtures do not need complete signature annotations.
module = ["tests.conftest"]
disallow_untyped_defs = false
