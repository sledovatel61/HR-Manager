name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Keep in sync with frontend/Dockerfile and frontend/package.json engines.
  NODE_VERSION: "22.22.3"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install PostgreSQL client tools (backup integration tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl               postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy typecheck
        run: mypy app tests
      - name: Unit tests
        run: pytest -m "not integration" -v
      - name: PowerShell structural lint (engine + installer scripts)
        working-directory: .
        run: |
          # Авторитетная проверка PowerShell — run-tests.ps1 на windows-latest.
          # Здесь — кросс-платформенная структурная проверка (баланс скобок,
          # кодировка, секреты-литералы, запрещённые вызовы), чтобы сломанный
          # скрипт не доезжал до Windows-джобы.
          python infra/windows/tests/lint-engine.py
      - name: Phase 14 pilot drill (release policy + channel refusals + readiness)
        working-directory: .
        run: |
          python infra/scripts/pilot_drill.py --out-dir drill \
            --steps signature-policy,channel-tamper-refusal,readiness-api

      - name: Upload pilot drill report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-drill-backend
          path: |
            drill/pilot-drill.json
            drill/pilot-drill.md
          if-no-files-found: warn

      - name: Production preflight script checks
        working-directory: .
        run: |
          # The preflight must REJECT missing/insecure configuration...
          if bash infra/scripts/check_env.sh; then
            echo "expected failure without configuration" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production bash infra/scripts/check_env.sh; then
            echo "expected failure without secrets" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY=dev-only-secret-key-not-for-production \
              POSTGRES_PASSWORD=strong-ci-pass-123 \
              bash infra/scripts/check_env.sh; then
            echo "expected failure for dev SECRET_KEY" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD=hr_manager_dev_password \
              bash infra/scripts/check_env.sh; then
            echo "expected failure for dev DB password" >&2; exit 1
          fi
          # A strong SECRET_KEY/POSTGRES_PASSWORD but missing bootstrap admin
          # password must also be rejected...
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              bash infra/scripts/check_env.sh; then
            echo "expected failure without BOOTSTRAP_ADMIN_PASSWORD" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BOOTSTRAP_ADMIN_PASSWORD=AdminAdmin123 \
              bash infra/scripts/check_env.sh; then
            echo "expected failure for dev BOOTSTRAP_ADMIN_PASSWORD" >&2; exit 1
          fi
          # ...the backup contour must be rejected when BACKUP_ENABLED=true
          # and the encryption key is missing, weak or still the dev value...
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BACKUP_ENABLED=true \
              bash infra/scripts/check_env.sh; then
            echo "expected failure without backup encryption keys" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BACKUP_ENABLED=true BACKUP_KEY_ID=k1 \
              BACKUP_ENC_KEY=ZGV2LW9ubHktYmFja3VwLWtleS0wMDAwMDAwMDAwMDA= \
              bash infra/scripts/check_env.sh; then
            echo "expected failure for the development-only backup key" >&2; exit 1
          fi
          # Phase 15: the license PUBLIC key is mandatory in production —
          # missing or malformed values must be rejected (ephemeral CI value,
          # 32 random bytes; never a real key).
          LICENSE_PUBLIC_KEY_CI="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BACKUP_ENABLED=true BACKUP_KEY_ID=prod-1 \
              BACKUP_ENC_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')" \
              bash infra/scripts/check_env.sh; then
            echo "expected failure without LICENSE_PUBLIC_KEY" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              LICENSE_PUBLIC_KEY=not-a-key \
              bash infra/scripts/check_env.sh; then
            echo "expected failure for a malformed LICENSE_PUBLIC_KEY" >&2; exit 1
          fi
          # ...and ACCEPTED with a real 32-byte key.
          env -i PATH=/usr/bin:/bin APP_ENV=production \
            SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
            BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
            LICENSE_PUBLIC_KEY="$LICENSE_PUBLIC_KEY_CI" \
            BACKUP_ENABLED=true BACKUP_KEY_ID=prod-1 \
            BACKUP_ENC_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')" \
            bash infra/scripts/check_env.sh

          # ...and ACCEPT a fully configured production environment.
          env -i PATH=/usr/bin:/bin APP_ENV=production \
            SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
            BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
            LICENSE_PUBLIC_KEY="$LICENSE_PUBLIC_KEY_CI" \
            bash infra/scripts/check_env.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Dependency audit (high and above)
        run: |
          # The npm registry retired the legacy quick-audit endpoint; npm < 11
          # posts there and fails/hangs. npm 11 uses the bulk-advisory
          # endpoint, so pin it for the audit.
          npm install -g npm@11
          npm audit --audit-level=high

  integration:
    name: Backend integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hr_manager_test
          POSTGRES_USER: hr_manager
          POSTGRES_PASSWORD: hr_manager_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr_manager -d hr_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply Alembic migrations
        env:
          # alembic/env.py builds the URL from the app settings (DATABASE_URL);
          # point it at the same PostgreSQL service database the tests use so
          # the schema exists before the integration tests run.
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/hr_manager_test
        run: alembic upgrade head
      - name: Integration tests (real PostgreSQL + migration pipeline)
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/hr_manager_test
          # Backup/restore-drill integration tests: the CI PostgreSQL user is
          # superuser, so the same credentials can create/drop the drill
          # databases; pg_dump/pg_restore come from the client tools above.
          BACKUP_DRILL_ADMIN_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/postgres
          BACKUP_PGDUMP_BIN: pg_dump
          BACKUP_RESTORE_BIN: pg_restore
        run: pytest -m integration -v
      - name: Phase 14 pilot drill (encrypted backup + restore into isolated DB)
        working-directory: .
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/hr_manager_test
          BACKUP_DRILL_ADMIN_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/postgres
          BACKUP_PGDUMP_BIN: pg_dump
          BACKUP_RESTORE_BIN: pg_restore
        run: |
          python infra/scripts/pilot_drill.py --out-dir drill \
            --database-url "$TEST_DATABASE_URL" --steps backup-restore-isolated-db
      - name: Upload pilot drill report (backup/restore)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-drill-integration
          path: |
            drill/pilot-drill.json
            drill/pilot-drill.md
          if-no-files-found: warn

  stack:
    name: Compose stack smoke test (dev + prod overlay)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate dev Compose configuration
        run: docker compose -f infra/docker-compose.yml config

      - name: Validate production overlay configuration
        run: |
          export APP_ENV=production
          export SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          export BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          # Phase 15: without the license PUBLIC key the overlay must refuse
          # to render (fail-closed), with it the configuration is valid.
          if docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml config -q 2>/tmp/prod-nokey.err; then
            echo "production overlay rendered WITHOUT LICENSE_PUBLIC_KEY" >&2; exit 1
          fi
          grep -q 'LICENSE_PUBLIC_KEY' /tmp/prod-nokey.err || { echo "missing-key error does not name LICENSE_PUBLIC_KEY" >&2; cat /tmp/prod-nokey.err >&2; exit 1; }
          export LICENSE_PUBLIC_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml config -q
          rendered="$(docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml config)"
          if echo "$rendered" | grep -q 'hr_manager_dev_password'; then
            echo "production configuration leaks development credentials" >&2
            exit 1
          fi
          if echo "$rendered" | grep -qE 'published:\s*"'; then
            echo "production configuration publishes external ports" >&2
            exit 1
          fi
          echo "production overlay is clean (no dev credentials, no published ports)"

      - name: Build and start the full stack (wait for healthy)
        run: docker compose -f infra/docker-compose.yml up --build --wait --wait-timeout 300

      - name: Verify backend /health returns HTTP 200
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)"
          [ "$code" = "200" ] || { echo "expected 200, got $code" >&2; exit 1; }
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Pilot overlay — license public-key chain (real docker compose)
        run: |
          # Phase 15. public_key.b64 -> pilot.env (engine format, UTF-8 and
          # UTF-8-BOM/CRLF) -> `docker compose --env-file ... config` ->
          # resolved environment of backend/worker/backup -> app.config.Settings
          # inside the built pilot images; SHA-256 fingerprint equality at every
          # hop. Negative: env file without / with an empty HRM_LICENSE_PUBLIC_KEY
          # must make `config` refuse. Ephemeral key, redacted report only.
          python3 infra/scripts/compose_pilot_license_chain.py \
            --out-dir compose-license-chain --require-runtime

      - name: Print pilot license-chain report (verbatim, redacted by construction)
        # The report holds only SHA-256 fingerprints (the script's leak guard
        # turns the verdict into FAIL if key-like material ever appears), so
        # it is safe in the job log and in the step summary. Printing it makes
        # the evidence readable without downloading the artifact and lets the
        # review pack import it verbatim between the markers below.
        if: always()
        run: |
          if [ -f compose-license-chain/compose-license-chain.json ]; then
            echo "-----BEGIN COMPOSE-LICENSE-CHAIN JSON-----"
            cat compose-license-chain/compose-license-chain.json
            echo
            echo "-----END COMPOSE-LICENSE-CHAIN JSON-----"
            {
              echo "## Pilot overlay — license public-key chain"
              echo
              cat compose-license-chain/compose-license-chain.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no compose-license-chain.json produced" >&2
          fi

      - name: Upload pilot license-chain evidence (redacted fingerprints only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-pilot-license-chain
          path: |
            compose-license-chain/compose-license-chain.json
            compose-license-chain/compose-license-chain.md
          if-no-files-found: warn

      - name: Validate HTTPS proxy overlay configuration
        run: |
          # Each Actions step starts a fresh shell, so the production values
          # exported by the earlier overlay check must be recreated here.
          export APP_ENV=production
          export SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          export BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          export SERVER_NAME=hr-manager.example.com
          export TLS_CERT_DIR=/tmp/hr-manager-tls
          export LICENSE_PUBLIC_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml \
              -f infra/docker-compose.proxy.yml config -q
          rendered="$(docker compose -f infra/docker-compose.yml \
              -f infra/compose.prod.yml -f infra/docker-compose.proxy.yml config)"
          if ! echo "$rendered" | grep -q 'target: 443'; then
            echo "proxy overlay must publish HTTPS" >&2; exit 1
          fi
          if echo "$rendered" | grep -q 'hr_manager_dev_password'; then
            echo "proxy overlay leaks development credentials" >&2; exit 1
          fi
          echo "proxy overlay is clean (HTTPS published, no dev credentials)"

      - name: Verify the backup service produced an encrypted backup
        run: |
          # BACKUP_ON_START=1 in the dev stack: the scheduler encrypts a dump
          # into the dedicated backups volume soon after the db is healthy.
          for attempt in $(seq 1 24); do
            if docker compose -f infra/docker-compose.yml exec -T backup \
                sh -lc 'ls /var/backups/hr-manager/*.pgdump.enc >/dev/null 2>&1'; then
              echo "encrypted backup found"; exit 0
            fi
            sleep 5
          done
          echo "no encrypted backup appeared in the backups volume" >&2
          docker compose -f infra/docker-compose.yml logs backup
          exit 1

      - name: Verify frontend serves the app and proxies the API
        run: |
          curl -fsS http://localhost:8080/ | grep -q 'HR Manager'
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'

      - name: Stop PostgreSQL and verify degraded health (HTTP 503)
        run: |
          docker compose -f infra/docker-compose.yml stop db
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)"
          [ "$code" = "503" ] || { echo "expected 503, got $code" >&2; exit 1; }

      - name: Clean up the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans

  windows-installer:
    name: Windows engine tests + installer smoke
    runs-on: windows-latest
    env:
      # Python на Windows кодирует перенаправленный stdout в кодовой странице
      # консоли (cp1252/cp437); русские сообщения release-CLI тогда падают с
      # UnicodeEncodeError и кодом 1, хотя сама проверка прошла.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install cryptography for trust-store tooling (pinned)
        shell: powershell
        run: |
          Write-Host "Installing cryptography via python -m pip..."
          python -m pip install cryptography==50.0.1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "python -m pip failed, trying python3..."
            python3 -m pip install cryptography==50.0.1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "python3 failed, trying py -3..."
            py -3 -m pip install cryptography==50.0.1
          }
          Write-Host "Check cryptography import:"
          python -c "import cryptography; print(cryptography.__version__)" 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            python3 -c "import cryptography; print(cryptography.__version__)" 2>&1 | Write-Host
          }
          if ($LASTEXITCODE -ne 0) {
            py -3 -c "import cryptography; print(cryptography.__version__)" 2>&1 | Write-Host
          }
          Write-Host "pip list:"
          pip list 2>&1 | Select-String "cryptography" | Write-Host

      - name: PowerShell engine tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File infra/windows/tests/run-tests.ps1

      - name: Validate ephemeral CI trust store (Phase 14 contract)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Python пишет UTF-8 (PYTHONUTF8=1); научим PowerShell 5.1 так же его
          # декодировать, иначе в логе будет кракозябра вместо русского текста.
          # Косметика, поэтому под try/catch: на раннере без консольного хендла
          # сеттер бросает IOException, а падать из-за этого шаг не должен.
          # Ключевая строка TRUST_STORE_SHA256= — чистый ASCII, она парсится
          # одинаково в любой кодовой странице.
          try {
            [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding $false
          }
          catch {
            Write-Host "Console.OutputEncoding не переключён: $($_.Exception.Message)"
          }
          Write-Host "=== Trust store: CI fixture contract (Phase 14) ==="
          $trustStorePath = "infra/release/testdata/trusted_keys.json"
          if (-not (Test-Path $trustStorePath)) { throw "trust store not found: $trustStorePath" }
          # ci-contract проверяет строгую схему, наличие активного и ОТОЗВАННОГО
          # ключей и то, что production-политика по-прежнему отклоняет этот
          # набор (--require-unrevoked и assert_no_fixture_keys). Ошибка -> код 1.
          # В Windows PowerShell 5.1 связка ErrorActionPreference=Stop и 2>&1
          # превращает stderr внешней программы в terminating error, поэтому на
          # время вызова предпочтение снижается, а вердикт читается из кода.
          $previousEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
            $output = & python infra/release/trust_store.py ci-contract --file $trustStorePath 2>&1 | Out-String
            $code = $LASTEXITCODE
          }
          finally { $ErrorActionPreference = $previousEap }
          Write-Host $output
          if ($code -ne 0) { throw "trust store ci-contract failed with code $code" }
          $line = ($output -split "`r?`n") | Where-Object { $_ -match "^TRUST_STORE_SHA256=" } | Select-Object -First 1
          if (-not $line) { throw "ci-contract did not report TRUST_STORE_SHA256" }
          $sha = ($line -split "=", 2)[1].Trim()
          $fileSha = (Get-FileHash -Path $trustStorePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $fileSha) { throw "trust store sha256 mismatch: tool=$sha file=$fileSha" }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV, "TRUST_STORE_SHA256=$sha`n", (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Written TRUST_STORE_SHA256=$sha to GITHUB_ENV"

      - name: Build HR Manager Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=== Build HR Manager Setup.exe ==="
          $trustStorePath = "infra/release/testdata/trusted_keys.json"
          Write-Host "TRUST_STORE_SHA256 env: '$env:TRUST_STORE_SHA256'"
          if (-not $env:TRUST_STORE_SHA256) {
            throw "TRUST_STORE_SHA256 пуст: шаг валидации trust store не записал GITHUB_ENV"
          }
          $logFile = Join-Path $env:RUNNER_TEMP "build.log"
          Write-Host "Logging to $logFile"
          # build.ps1 сверяет переданный SHA256 с фактическим хешем файла и
          # отказывает при расхождении. Пересчитывать хеш «на месте» нельзя:
          # это превратило бы проверку встроенного trust store в формальность.
          # *>&1 превращает ошибки build.ps1 в записи потока, поэтому вердикт
          # читается и по коду, и по $?, и по фактическому наличию артефактов:
          # отказ до запуска ISCC оставил бы $LASTEXITCODE от предыдущей внешней
          # команды (git rev-parse = 0) и молча «позеленел» бы шаг.
          $previousEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
            & ./installer/build.ps1 -Version 0.13.0 -TrustStoreFile $trustStorePath `
              -TrustStoreSha256 $env:TRUST_STORE_SHA256 *>&1 |
              Tee-Object -FilePath $logFile -Encoding utf8
            $code = $LASTEXITCODE
            $ok = $?
          }
          finally { $ErrorActionPreference = $previousEap }
          Write-Host "build.ps1 exit code: $code, success flag: $ok"
          $setup = @(Get-ChildItem installer/output/HR-Manager-Setup-*.exe -ErrorAction SilentlyContinue)
          $manifest = Test-Path installer/release-manifest.json
          Write-Host "setup artifacts: $($setup.Count), release-manifest.json: $manifest"
          if (-not $ok -or $code -ne 0 -or $setup.Count -eq 0 -or -not $manifest) {
            throw ("build.ps1 не собрал установщик (exit={0}, ok={1}, setup={2}, manifest={3}); лог выше" -f `
              $code, $ok, $setup.Count, $manifest)
          }
          Write-Host "Build succeeded"
          Get-ChildItem installer/output -Recurse | ForEach-Object { Write-Host $_.FullName }
          Get-Content installer/release-manifest.json -Raw | Write-Host

      - name: Post Build log to the job summary on failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $logFile = Join-Path $env:RUNNER_TEMP "build.log"
          if (Test-Path $logFile) {
            $content = Get-Content $logFile -Raw
            if ($content.Length -gt 60000) { $content = $content.Substring(0, 60000) + "`n...truncated" }
            # Ограждение кода собираем из одинарных кавычек: в двойной строке
            # PowerShell последовательность ```" разбирается как экранированная
            # кавычка, и строка остаётся незакрытой (parse error на весь шаг).
            $fence = '```'
            $body = "### Build log" + "`n" + $fence + "text" + "`n" + $content + "`n" + $fence
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $body
            Write-Host "Build log posted to the job summary"
          }
          else {
            Write-Host "No build log at $logFile (сборка не запускалась)"
          }

      - name: Authenticode-sign with ephemeral test certificate (never production)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $logFile = Join-Path $env:RUNNER_TEMP "authenticode.log"
          Write-Host "Logging Authenticode to $logFile"
          # sign.ps1 завершается явным exit: 0 — подпись выполнена и проверена
          # (включая независимый верификатор), 1 — отказ. Test-режим не трогает
          # Root/TrustedPublisher, поэтому диалога подтверждения и зависания нет.
          $previousEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
            & ./installer/sign.ps1 -Mode test -Version 0.13.0 `
              -TrustStoreFile infra/release/testdata/trusted_keys.json *>&1 |
              Tee-Object -FilePath $logFile -Encoding utf8
            $code = $LASTEXITCODE
            $ok = $?
          }
          finally { $ErrorActionPreference = $previousEap }
          Write-Host "sign.ps1 exit code: $code, success flag: $ok"
          foreach ($artifact in @("installer/authenticode-attestation.json",
              "installer/authenticode-roots.pem", "installer/authenticode-verification.json")) {
            Write-Host "${artifact}: $(Test-Path $artifact)"
          }
          if (-not $ok -or $code -ne 0) { throw "sign.ps1 failed with code $code (см. лог выше)" }
          foreach ($artifact in @("installer/authenticode-attestation.json",
              "installer/authenticode-roots.pem", "installer/authenticode-verification.json")) {
            if (-not (Test-Path $artifact)) { throw "sign.ps1 не создал обязательный артефакт: $artifact" }
          }
          $attestation = Get-Content installer/authenticode-attestation.json -Raw | ConvertFrom-Json
          Write-Host ("attestation: mode={0} signtool_verify_ok={1} windows_chain_trusted={2} publisher={3}" -f `
            $attestation.mode, $attestation.signtool_verify_ok, $attestation.windows_chain_trusted, `
            $attestation.publisher)
          if ($attestation.mode -ne "test") { throw "CI обязан подписывать в test-режиме" }
          # Test-подпись НЕ обязана быть доверена Windows, но attestation не
          # имеет права выдавать её за production-valid.
          if ($attestation.signtool_verify_ok -and $attestation.windows_chain_trusted) {
            Write-Host "Windows доверяет ephemeral-корню — тоже допустимо (attestation честна)"
          }
          if ($attestation.independent_verification.passed -ne $true) {
            throw "независимая проверка Authenticode не подтверждена в attestation"
          }

      - name: Post Authenticode log to the job summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $logFile = Join-Path $env:RUNNER_TEMP "authenticode.log"
          if (Test-Path $logFile) {
            $content = Get-Content $logFile -Raw
            if ($content.Length -gt 60000) { $content = $content.Substring(0, 60000) + "`n...truncated" }
            # Ограждение кода собираем из одинарных кавычек: в двойной строке
            # PowerShell последовательность ```" разбирается как экранированная
            # кавычка, и строка остаётся незакрытой (parse error на весь шаг).
            $fence = '```'
            $body = "### Authenticode log" + "`n" + $fence + "text" + "`n" + $content + "`n" + $fence
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $body
            Write-Host "Authenticode log posted to the job summary"
          }
          else {
            Write-Host "No authenticode log at $logFile (подпись не запускалась)"
          }

      - name: Upload Authenticode logs and attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authenticode-logs
          path: |
            installer/authenticode-attestation.json
            installer/authenticode-verification.json
            installer/authenticode-roots.pem
          if-no-files-found: warn

      - name: Upload signed installer for Authenticode diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-installer-diagnostic
          path: |
            installer/output/HR-Manager-Setup-*.exe
          if-no-files-found: warn

      - name: Silent install and uninstall smoke
        shell: powershell
        run: |
          $setup = Get-ChildItem installer/output/HR-Manager-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe was not produced" }
          $process = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent install failed: $($process.ExitCode)" }
          $appDir = Join-Path $env:LOCALAPPDATA "Programs\HRManager"
          if (-not (Test-Path (Join-Path $appDir "infra\windows\hr-manager.ps1"))) {
            throw "Installed Windows engine is missing"
          }
          $uninstaller = Join-Path $appDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing" }
          $process = Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent uninstall failed: $($process.ExitCode)" }
          if (Test-Path (Join-Path $appDir "infra\windows\hr-manager.ps1")) {
            throw "Installed application files survived uninstall"
          }

      - name: Phase 14 pilot drill (Windows engine update/rollback/resume/uninstall)
        shell: powershell
        run: |
          python infra/scripts/pilot_drill.py --out-dir drill --steps windows-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload pilot drill report (Windows engine)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-drill-windows
          path: |
            drill/pilot-drill.json
            drill/pilot-drill.md
          if-no-files-found: warn

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hr-manager-windows-setup
          path: |
            installer/output/*.exe
            installer/release-manifest.json
            installer/authenticode-attestation.json
            installer/authenticode-roots.pem
            installer/authenticode-verification.json
          if-no-files-found: error

  license-issuer-windows:
    name: License issuer bundle - Windows PowerShell 5.1 checks
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Python (bundled embeddable) пишет UTF-8; PowerShell 5.1 учим декодировать
      # так же, как и в остальных шагах этого workflow.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: build.ps1 encoding + Windows PowerShell 5.1 parser check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $path = "tools/license-issuer/build.ps1"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          # 1) UTF-8 BOM: без него Windows PowerShell 5.1 читает .ps1 как ANSI
          #    и UTF-8-пунктуация ломает токенизатор.
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "build.ps1 must start with a UTF-8 BOM (EF BB BF): Windows PowerShell 5.1 reads BOM-less .ps1 as ANSI"
          }
          # 2) ASCII-only: даже если BOM когда-нибудь сбросят, файл обязан
          #    парситься в любой кодовой странице.
          $nonAscii = @($bytes | Where-Object { $_ -ge 0x80 })
          if ($nonAscii.Count -ne 0) {
            throw "build.ps1 contains $($nonAscii.Count) non-ASCII byte(s); keep the script ASCII-only so it parses under any code page"
          }
          # 3) Настоящий парсер Windows PowerShell 5.1 (этот шаг выполняется
          #    shell: powershell, т.е. именно 5.1 на windows-latest).
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($null -ne $errors -and $errors.Count -ne 0) {
            foreach ($e in $errors) {
              Write-Host ("PARSE ERROR line {0}:{1} {2}" -f $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)
            }
            throw "Windows PowerShell 5.1 parser found $($errors.Count) error(s) in build.ps1"
          }
          Write-Host ("build.ps1 OK: UTF-8 BOM present, ASCII-only, 0 parser errors (Windows PowerShell {0})" -f (Get-Host).Version.ToString())

      - name: Build autonomous bundle with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          # Явный запуск 5.1: скрипт обязан работать именно под Windows PowerShell
          # 5.1, а не только под pwsh 7.
          $logFile = Join-Path $env:RUNNER_TEMP "license-issuer-build.log"
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools\license-issuer\build.ps1 *>&1 | Tee-Object -FilePath $logFile -Encoding utf8
          $code = $LASTEXITCODE
          Write-Host "build.ps1 exit code: $code"
          if ($code -ne 0) { throw "license issuer build failed with code $code (log above)" }
          $zip = "tools\license-issuer\dist\license-issuer-dist.zip"
          if (-not (Test-Path $zip)) { throw "license-issuer-dist.zip was not created" }
          # Вывод сборки никогда не должен содержать ключевой материал:
          # любой непрерывный hex-обрезок 64+ символов в логе = утечка.
          $logText = Get-Content $logFile -Raw
          $hexRuns = [regex]::Matches($logText, "(?i)\b[0-9a-f]{64,}\b")
          if ($hexRuns.Count -ne 0) {
            throw "build log contains $($hexRuns.Count) run(s) of 64+ hex characters - possible key material leak"
          }
          Write-Host "Build OK: license-issuer-dist.zip present, no 64+ hex material in the build log"

      - name: Runtime checks from a fresh unzip (spaces in path, no system Python, loopback, fail-closed)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding $false } catch { }
          # Каталог теста с пробелами в имени: launchers обязаны работать с
          # путями, содержащими пробелы.
          $root = Join-Path $env:TEMP "HRM Issuer PR36 Test"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $zip = "tools\license-issuer\dist\license-issuer-dist.zip"
          function Run-AndCapture([string]$FilePath, [string[]]$CliArgs) {
            # В 5.1 при EAP=Stop сливание stderr (2>&1) в terminating error,
            # поэтому на время вызова предпочтение снижается (конвенция workflow).
            $previousEap = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              $out = & $FilePath @CliArgs 2>&1 | ForEach-Object { $_.ToString() } | Out-String
              $exit = $LASTEXITCODE
            } finally { $ErrorActionPreference = $previousEap }
            return [pscustomobject]@{ Output = $out; ExitCode = $exit }
          }
          function Start-BatCaptured([string]$BatPath, [string]$OutFile) {
            # .NET ProcessStartInfo: строка аргументов передаётся cmd.exe без
            # переквычивания PowerShell, кавычки вокруг путей контролируем сами.
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = "cmd.exe"
            $psi.Arguments = '/c "' + $BatPath + '" > "' + $OutFile + '" 2>&1'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            return [System.Diagnostics.Process]::Start($psi)
          }
          try {
            # --- распаковка ЗИП в отдельную директорию (не из dist/) ---
            $unzip = Join-Path $root "unzipped bundle"
            Expand-Archive -Path $zip -DestinationPath $unzip -Force
            $app = Join-Path $unzip "license-issuer"
            $cli = Join-Path $app "run-cli.bat"
            $gui = Join-Path $app "run-gui.bat"
            $html = Join-Path $app "run-html.bat"
            $pyExe = Join-Path $unzip "python\python.exe"
            foreach ($f in @($cli, $gui, $html, $pyExe)) {
              if (-not (Test-Path $f)) { throw "bundle is missing: $f" }
            }
            Write-Host "Bundle unzipped to: $unzip"

            # --- изоляция runtime: PATH без какого-либо системного Python ---
            $originalPath = $env:PATH
            $env:PATH = "C:\Windows\System32;C:\Windows"
            $sysPy = Get-Command python -ErrorAction SilentlyContinue
            if ($sysPy) { throw "test setup failed: system python still reachable on PATH: $($sysPy.Source)" }
            $env:HRM_NO_PAUSE = "1"

            # --- CLI цепочка: gen-keypair -> issue -> verify ---
            $keysDir = Join-Path $app "ci-keys"
            $gen = Run-AndCapture $cli @("gen-keypair", "--out-dir", $keysDir)
            Write-Host $gen.Output
            if ($gen.ExitCode -ne 0) { throw "run-cli.bat gen-keypair failed (exit=$($gen.ExitCode))" }
            $privFile = Join-Path $keysDir "private_key.hex"
            $pubFile = Join-Path $keysDir "public_key.b64"
            if (-not (Test-Path $privFile) -or -not (Test-Path $pubFile)) { throw "gen-keypair did not create key files" }
            $privHex = (Get-Content $privFile -Raw).Trim()
            if ($privHex -notmatch "^[0-9a-f]{64}$") { throw "private key file does not look like 64 hex chars" }
            $licDir = Join-Path $app "ci-licenses"
            $licFile = Join-Path $licDir "pilot.hrmlicense"
            $issue = Run-AndCapture $cli @("issue", "--private-key-file", $privFile, "--client", "Pilot Maria", "--expires", "2026-12-31", "--max-users", "5", "--out", $licFile)
            Write-Host $issue.Output
            if ($issue.ExitCode -ne 0) { throw "run-cli.bat issue failed (exit=$($issue.ExitCode))" }
            if (-not (Test-Path $licFile)) { throw "issue did not create the license file" }
            $lic = Get-Content $licFile -Raw | ConvertFrom-Json
            if ($lic.client_name -ne "Pilot Maria" -or $lic.expires_at -ne "2026-12-31" -or [int]$lic.max_active_users -ne 5) {
              throw "license fields do not match the request"
            }
            if ([string]$lic.signature -notmatch "^[0-9a-f]{128}$") { throw "license signature is not 128 hex chars" }
            $verify = Run-AndCapture $cli @("verify", "--public-key-file", $pubFile, "--license-file", $licFile)
            Write-Host $verify.Output
            if ($verify.ExitCode -ne 0) { throw "run-cli.bat verify failed (exit=$($verify.ExitCode))" }
            Write-Host "CLI chain PASS: gen-keypair -> issue -> verify (all via bundled python, no system python on PATH)"

            # --- verify обязан ОТКЛАДЫВАТЬ подделанную лицензию (не вакуум) ---
            $badFile = Join-Path $app "tampered.hrmlicense"
            $licBad = $lic
            $licBad.max_active_users = 6
            ($licBad | ConvertTo-Json -Compress) | Set-Content -Path $badFile -Encoding utf8
            $bad = Run-AndCapture $cli @("verify", "--public-key-file", $pubFile, "--license-file", $badFile)
            if ($bad.ExitCode -eq 0) { throw "verify ACCEPTED a tampered license - verify is not fail-closed" }
            Write-Host "Tampered license correctly rejected (exit=$($bad.ExitCode))"

            # --- приватный ключ не должен попасть ни в один вывод ---
            $allCliOut = $gen.Output + $issue.Output + $verify.Output + $bad.Output
            if ($allCliOut -match [regex]::Escape($privHex)) {
              throw "private key material was printed into CLI output"
            }
            Write-Host "No private key material in CLI stdout/stderr"

            # --- fail-closed: bundled python удалён -> exit 1, без fallback ---
            $noPy = Join-Path $root "no python"
            Copy-Item $unzip $noPy -Recurse
            Remove-Item (Join-Path $noPy "python") -Recurse -Force
            $noCli = Join-Path $noPy "license-issuer\run-cli.bat"
            # (a) PATH без системного Python
            $fc1 = Run-AndCapture $noCli @("gen-keypair", "--out-dir", (Join-Path $noPy "keys"))
            if ($fc1.ExitCode -eq 0) { throw "launcher succeeded without bundled python (isolated PATH) - not fail-closed" }
            if ($fc1.Output -notmatch "Bundled Python not found") { throw "fail-closed error message missing: $($fc1.Output)" }
            Write-Host "fail-closed (isolated PATH) PASS: exit=$($fc1.ExitCode)"
            # (b) системный Python ДОСТУПЕН на PATH - launcher всё равно обязан
            #     отказать: тихий fallback на системный интерпретатор запрещён.
            $env:PATH = $originalPath
            if (Get-Command python -ErrorAction SilentlyContinue) {
              $fc2 = Run-AndCapture $noCli @("gen-keypair", "--out-dir", (Join-Path $noPy "keys"))
              if ($fc2.ExitCode -eq 0) { throw "launcher fell back to system python - private key would leave the bundle" }
              Write-Host "fail-closed (system python present) PASS: exit=$($fc2.ExitCode), no fallback"
            } else {
              Write-Host "WARN: no system python on the runner PATH; fallback-proof skipped (isolated-PATH check above still holds)"
            }

            # --- run-html.bat: только loopback, страница отдаётся, слушатель = bundled python ---
            $htmlLog = Join-Path $root "html.log"
            $htmlProc = Start-BatCaptured $html $htmlLog
            Start-Sleep -Seconds 6
            $listen = @(netstat -ano | ForEach-Object { if ($_ -match ":8765" -and $_ -match "LISTENING") { $_ } })
            if ($listen.Count -eq 0) {
              throw "no LISTENING socket on 8765 - HTML server did not start; log: $((Get-Content $htmlLog -Raw -ErrorAction SilentlyContinue))"
            }
            $badBind = @($listen | Where-Object { $_ -match "0\.0\.0\.0:8765" })
            if ($badBind.Count -ne 0) { throw "HTML server bound to 0.0.0.0: $badBind" }
            $loopBind = @($listen | Where-Object { $_ -match "127\.0\.0\.1:8765" })
            if ($loopBind.Count -eq 0) { throw "HTML server is not bound to 127.0.0.1" }
            Write-Host "Loopback check PASS: LISTENING only on 127.0.0.1:8765"
            $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8765/license-issuer.html" -UseBasicParsing
            if ([int]$resp.StatusCode -ne 200) { throw "HTML page returned HTTP $($resp.StatusCode)" }
            if ([string]$resp.Content -notmatch "License") { throw "served page does not look like the issuer page" }
            Write-Host ("HTML page served: HTTP 200, {0} bytes" -f ([string]$resp.Content).Length)
            $listenerPid = [int](($listen | Select-Object -First 1) -split "\s+" | Select-Object -Last 1)
            $proc = Get-CimInstance Win32_Process -Filter "ProcessId=$listenerPid"
            if ($proc.ExecutablePath -notmatch [regex]::Escape($unzip)) {
              throw "HTML listener is not the bundled python: $($proc.ExecutablePath)"
            }
            Write-Host "HTML listener PID $listenerPid runs the bundled python.exe (WMI verified)"
            $previousEap = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try { & taskkill /F /PID $listenerPid /T | Out-Null } finally { $ErrorActionPreference = $previousEap }
            if (-not $htmlProc.WaitForExit(5000)) {
              try { $htmlProc.Kill($true) } catch { }
            }

            # --- run-gui.bat: best effort в headless CI; краш при импорте = FAIL ---
            $guiLog = Join-Path $root "gui.log"
            $guiProc = Start-BatCaptured $gui $guiLog
            Start-Sleep -Seconds 10
            $guiText = ""
            if (Test-Path $guiLog) { $guiText = Get-Content $guiLog -Raw -ErrorAction SilentlyContinue }
            if ($guiText -match "ModuleNotFoundError|Traceback") {
              throw "GUI crashed at startup (import/runtime error): $guiText"
            }
            if (-not $guiProc.HasExited) {
              try { $guiProc.Kill($true) } catch { }
              Write-Host "GUI check PASS: process stayed alive without import errors (killed after check)"
            } else {
              Write-Host ("GUI check WARN: process exited early (code={0}) without traceback - headless CI cannot confirm UI" -f $guiProc.ExitCode)
            }

            # --- приватный ключ ни в temp-артефактах, ни в логах тестов ---
            $swept = 0
            foreach ($f in (Get-ChildItem $root -Recurse -File | Where-Object { $_.FullName -ne $privFile -and $_.Length -lt 10MB })) {
              try {
                if ((Get-Content $f.FullName -Raw -Encoding utf8 -ErrorAction Stop) -match [regex]::Escape($privHex)) {
                  throw "private key material found in: $($f.FullName)"
                }
                $swept++
              } catch [System.IO.IOException] { }
            }
            Write-Host ("Key-material sweep done: {0} files scanned, private key not found" -f $swept)

            # --- дерево git чистое: dist/ и ключи в .gitignore, утечек нет ---
            $gitOut = & git status --porcelain 2>&1 | Out-String
            if ($gitOut.Trim().Length -ne 0) { throw "git tree is not clean after the checks: $gitOut" }
            $lsfiles = & git ls-files -ci --exclude-standard 2>&1 | Out-String
            if ($lsfiles.Trim().Length -ne 0) { throw "a tracked file matches key-material ignore patterns: $lsfiles" }
            Write-Host "git tree clean; no tracked file hidden by key-material ignore patterns"
            Write-Host "ALL RUNTIME CHECKS PASS"
          }
          finally {
            if (Test-Path $root) {
              Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
              if (Test-Path $root) { Write-Host "WARN: could not remove $root - remove it manually" }
              else { Write-Host "Temporary test directory removed: $root" }
            }
          }

  channel-release-policy:
    name: Release pipeline fail-closed policy (ephemeral test signature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling (pinned, same as release job)
        run: pip install cryptography==50.0.1 pytest pyyaml

      - name: Release tooling unit tests (contract, trust store, Authenticode)
        run: |
          pytest -q infra/release/test_channel_contract.py
          pytest -q backend/tests/test_trust_store.py backend/tests/test_release_authenticode.py backend/tests/test_release_policy.py backend/tests/test_release_pipeline.py backend/tests/test_authenticode_pem_preflight.py

      - name: Ephemeral Authenticode fixture — valid must verify, tampered/wrong/missing must fail
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "infra/release")
          from sign_authenticode import create_test_authority, make_test_pe, sign_test_pe
          work = Path("policy/ephemeral")
          work.mkdir(parents=True, exist_ok=True)
          publisher = "HR Manager CI Test Publisher"
          authority = create_test_authority(publisher)
          pe = make_test_pe(b"HRM-TEST-PE-BODY-FOR-CI")
          signed = sign_test_pe(pe, authority)
          installer = work / "HR-Manager-Setup-0.14.0.exe"
          installer.write_bytes(signed)
          roots = work / "authenticode-roots.pem"
          roots.write_bytes(authority.ca_pem())
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(installer), "--trust-roots", str(roots), "--json-out", str(work / "verified.json")], capture_output=True, text=True)
          if result.returncode != 0:
              print(result.stdout); print(result.stderr, file=sys.stderr); sys.exit(1)
          report = json.loads((work / "verified.json").read_text(encoding="utf-8"))
          assert report["signed"] is True and report["chain_verified"] is True
          tampered = work / "tampered.exe"
          _data = bytearray(signed); _data[0x250] ^= 0xFF; tampered.write_bytes(_data)
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(tampered), "--trust-roots", str(roots)], capture_output=True, text=True)
          assert result.returncode != 0 and "digest_mismatch" in result.stderr
          other = create_test_authority("Other Publisher")
          other_roots = work / "other-roots.pem"
          other_roots.write_bytes(other.ca_pem())
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(installer), "--trust-roots", str(other_roots)], capture_output=True, text=True)
          assert result.returncode != 0
          unsigned = work / "unsigned.exe"
          unsigned.write_bytes(make_test_pe(b"UNSIGNED"))
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(unsigned), "--trust-roots", str(roots)], capture_output=True, text=True)
          assert result.returncode != 0
          Path("policy/installer.exe").write_bytes(signed)
          Path("policy/roots.pem").write_bytes(authority.ca_pem())
          (work / "publisher.txt").write_text(publisher, encoding="utf-8")
          PY

      - name: Channel policy — valid / tampered / wrong signer / missing must be fail-closed
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib, shutil, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "infra/release")
          from sign_authenticode import EphemeralAuthority, create_test_authority, make_test_pe, sign_test_pe
          from trust_store import describe_trust_store, trust_store_sha256
          work = Path("policy/ephemeral")
          publisher = (work / "publisher.txt").read_text(encoding="utf-8").strip() if (work / "publisher.txt").exists() else "HR Manager CI Test Publisher"
          installer = Path("policy/installer.exe")
          roots = Path("policy/roots.pem")
          tmp = Path(tempfile.mkdtemp())
          snapshot = tmp / "app"
          shutil.copytree("infra/release/testdata/snapshot", snapshot)
          (snapshot / "release.json").write_text(json.dumps({"version": "0.14.0", "release_sha": "3"*40}), encoding="utf-8")
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          import base64
          key = Ed25519PrivateKey.generate()
          private_path = tmp / "channel-priv.hex"
          private_path.write_text(key.private_bytes_raw().hex() + "\n", encoding="utf-8")
          public_b64 = base64.b64encode(key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)).decode()
          trust_store = tmp / "trust-store.json"
          trust_store.write_text(json.dumps({"pilot-test-key": {"key": public_b64, "revoked": False}}), encoding="utf-8")
          signer_auth = create_test_authority(publisher)
          tsa_auth = create_test_authority("Independent CI TSA")
          fresh_auth = EphemeralAuthority(
              ca_certificate=signer_auth.ca_certificate, ca_key=signer_auth.ca_key,
              leaf_certificate=signer_auth.leaf_certificate, leaf_key=signer_auth.leaf_key,
              tsa_certificate=tsa_auth.tsa_certificate, tsa_key=tsa_auth.tsa_key,
              publisher=publisher,
          )
          tsa_roots = Path("policy/timestamp-roots.pem")
          tsa_roots.write_bytes(tsa_auth.ca_pem())
          fresh_signed = sign_test_pe(make_test_pe(b"HRM-TEST-PE-BODY-FOR-CI"), fresh_auth)
          installer.write_bytes(fresh_signed)
          roots.write_bytes(fresh_auth.ca_pem())
          trust_data = json.loads(trust_store.read_text(encoding="utf-8"))
          valid_attestation = {"mode": "test", "authenticode_present": True, "signtool_verify_ok": True, "timestamp_present": True, "publisher": publisher, "installer_sha256": hashlib.sha256(fresh_signed).hexdigest(), "signer_thumbprint_sha256": fresh_auth.leaf_certificate.fingerprint(__import__("cryptography").hazmat.primitives.hashes.SHA256()).hex(), "tool": "infra/release/sign_authenticode.py (ephemeral)", "trust_store": {"sha256": trust_store_sha256(trust_data), "keys": describe_trust_store(trust_data)}}
          attestation_path = tmp / "attestation.json"
          attestation_path.write_text(json.dumps(valid_attestation), encoding="utf-8")
          out_dir = tmp / "out"
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(out_dir), "--release-mode", "test", "--installer", str(installer), "--authenticode-roots", str(roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(attestation_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode == 0 and (out_dir / "update-channel.json").exists()
          tampered = tmp / "tampered.exe"
          _t = bytearray(fresh_signed); _t[0x250] ^= 0xFF; tampered.write_bytes(_t)
          tampered_att = dict(valid_attestation); tampered_att["mode"]="production"
          tampered_att_path = tmp / "tampered_att.json"
          tampered_att_path.write_text(json.dumps(tampered_att), encoding="utf-8")
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-tampered"), "--release-mode", "production", "--installer", str(tampered), "--authenticode-roots", str(roots), "--authenticode-timestamp-roots", str(tsa_roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(tampered_att_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          # Отказ обязан быть по своей причине, а не из-за отсутствующего параметра.
          assert result.returncode != 0 and "installer_changed_after_signing" in (result.stdout + result.stderr), result.stderr[-400:]
          wrong_roots = tmp / "wrong.pem"
          wrong_auth = create_test_authority("Other Publisher")
          wrong_roots.write_bytes(wrong_auth.ca_pem())
          wrong_att = dict(valid_attestation); wrong_att["mode"]="production"
          wrong_att_path = tmp / "wrong_att.json"
          wrong_att_path.write_text(json.dumps(wrong_att), encoding="utf-8")
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-wrong"), "--release-mode", "production", "--installer", str(installer), "--authenticode-roots", str(wrong_roots), "--authenticode-timestamp-roots", str(tsa_roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(wrong_att_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode != 0 and "untrusted_root" in (result.stdout + result.stderr), result.stderr[-400:]
          unsigned = tmp / "unsigned.exe"
          unsigned.write_bytes(make_test_pe(b"UNSIGNED-PE"))
          unsigned_att = dict(valid_attestation); unsigned_att["mode"]="production"; unsigned_att["installer_sha256"]=hashlib.sha256(unsigned.read_bytes()).hexdigest()
          unsigned_att_path = tmp / "unsigned_att.json"
          unsigned_att_path.write_text(json.dumps(unsigned_att), encoding="utf-8")
          # Production без отдельного корня TSA обязан отказать fail-closed:
          # signer CA и TSA CA независимы, повторять их друг в друге нельзя.
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-no-tsa-roots"), "--release-mode", "production", "--installer", str(installer), "--authenticode-roots", str(roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(attestation_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode != 0 and "missing_authenticode_timestamp_roots" in (result.stdout + result.stderr), result.stderr[-400:]
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-missing"), "--release-mode", "production", "--installer", str(unsigned), "--authenticode-roots", str(roots), "--authenticode-timestamp-roots", str(tsa_roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(unsigned_att_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode != 0 and "unsigned" in (result.stdout + result.stderr), result.stderr[-400:]
          PY

      - name: No secrets in produced reports
        run: |
          set -euo pipefail
          for pattern in "PRIVATE KEY" "BEGIN RSA" "test_key.priv"; do
            if grep -rIl -- "$pattern" policy/ 2>/dev/null; then
              echo "secret-like material found in policy artifacts: $pattern" >&2; exit 1
            fi
          done
          echo "reports carry no private material"
