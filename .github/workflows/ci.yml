name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PYTHON_VERSION: "3.12"
  # Keep in sync with frontend/Dockerfile and frontend/package.json engines.
  NODE_VERSION: "22.22.3"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install PostgreSQL client tools (backup integration tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl               postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy typecheck
        run: mypy app tests
      - name: Unit tests
        run: pytest -m "not integration" -v
      - name: PowerShell structural lint (engine + installer scripts)
        working-directory: .
        run: |
          # Авторитетная проверка PowerShell — run-tests.ps1 на windows-latest.
          # Здесь — кросс-платформенная структурная проверка (баланс скобок,
          # кодировка, секреты-литералы, запрещённые вызовы, контракты
          # installer/build.ps1 и installer/sign.ps1), чтобы сломанный скрипт
          # не доезжал до Windows-джобы.
          python infra/windows/tests/lint-engine.py
      - name: Phase 14 pilot drill (release policy + channel refusals + readiness)
        working-directory: .
        run: |
          python infra/scripts/pilot_drill.py --out-dir drill \
            --steps signature-policy,channel-tamper-refusal,readiness-api

      - name: Upload pilot drill report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-drill-backend
          path: |
            drill/pilot-drill.json
            drill/pilot-drill.md
          if-no-files-found: error

      - name: Production preflight script checks
        working-directory: .
        run: |
          # The preflight must REJECT missing/insecure configuration...
          if bash infra/scripts/check_env.sh; then
            echo "expected failure without configuration" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production bash infra/scripts/check_env.sh; then
            echo "expected failure without secrets" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY=dev-only-secret-key-not-for-production \
              POSTGRES_PASSWORD=strong-ci-pass-123 \
              bash infra/scripts/check_env.sh; then
            echo "expected failure for dev SECRET_KEY" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD=hr_manager_dev_password \
              bash infra/scripts/check_env.sh; then
            echo "expected failure for dev DB password" >&2; exit 1
          fi
          # A strong SECRET_KEY/POSTGRES_PASSWORD but missing bootstrap admin
          # password must also be rejected...
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              bash infra/scripts/check_env.sh; then
            echo "expected failure without BOOTSTRAP_ADMIN_PASSWORD" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BOOTSTRAP_ADMIN_PASSWORD=AdminAdmin123 \
              bash infra/scripts/check_env.sh; then
            echo "expected failure for dev BOOTSTRAP_ADMIN_PASSWORD" >&2; exit 1
          fi
          # ...the backup contour must be rejected when BACKUP_ENABLED=true
          # and the encryption key is missing, weak or still the dev value...
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BACKUP_ENABLED=true \
              bash infra/scripts/check_env.sh; then
            echo "expected failure without backup encryption keys" >&2; exit 1
          fi
          if env -i PATH=/usr/bin:/bin APP_ENV=production \
              SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              BACKUP_ENABLED=true BACKUP_KEY_ID=k1 \
              BACKUP_ENC_KEY=ZGV2LW9ubHktYmFja3VwLWtleS0wMDAwMDAwMDAwMDA= \
              bash infra/scripts/check_env.sh; then
            echo "expected failure for the development-only backup key" >&2; exit 1
          fi
          # ...and ACCEPTED with a real 32-byte key.
          env -i PATH=/usr/bin:/bin APP_ENV=production \
            SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
            BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
            BACKUP_ENABLED=true BACKUP_KEY_ID=prod-1 \
            BACKUP_ENC_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')" \
            bash infra/scripts/check_env.sh

          # ...and ACCEPT a fully configured production environment.
          env -i PATH=/usr/bin:/bin APP_ENV=production \
            SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
            BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
            bash infra/scripts/check_env.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Dependency audit (high and above)
        run: |
          # The npm registry retired the legacy quick-audit endpoint; npm < 11
          # posts there and fails/hangs. npm 11 uses the bulk-advisory
          # endpoint, so pin it for the audit.
          npm install -g npm@11
          npm audit --audit-level=high

  integration:
    name: Backend integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hr_manager_test
          POSTGRES_USER: hr_manager
          POSTGRES_PASSWORD: hr_manager_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr_manager -d hr_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply Alembic migrations
        env:
          # alembic/env.py builds the URL from the app settings (DATABASE_URL);
          # point it at the same PostgreSQL service database the tests use so
          # the schema exists before the integration tests run.
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/hr_manager_test
        run: alembic upgrade head
      - name: Integration tests (real PostgreSQL + migration pipeline)
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/hr_manager_test
          # Backup/restore-drill integration tests: the CI PostgreSQL user is
          # superuser, so the same credentials can create/drop the drill
          # databases; pg_dump/pg_restore come from the client tools above.
          BACKUP_DRILL_ADMIN_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/postgres
          BACKUP_PGDUMP_BIN: pg_dump
          BACKUP_RESTORE_BIN: pg_restore
        run: pytest -m integration -v
      - name: Phase 14 pilot drill (encrypted backup + restore into isolated DB)
        working-directory: .
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/hr_manager_test
          BACKUP_DRILL_ADMIN_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/postgres
          BACKUP_PGDUMP_BIN: pg_dump
          BACKUP_RESTORE_BIN: pg_restore
        run: |
          python infra/scripts/pilot_drill.py --out-dir drill \
            --database-url "$TEST_DATABASE_URL" --steps backup-restore-isolated-db
      - name: Upload pilot drill report (backup/restore)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-drill-integration
          path: |
            drill/pilot-drill.json
            drill/pilot-drill.md
          if-no-files-found: error

  stack:
    name: Compose stack smoke test (dev + prod overlay)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate dev Compose configuration
        run: docker compose -f infra/docker-compose.yml config

      - name: Validate production overlay configuration
        run: |
          export APP_ENV=production
          export SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          export BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml config -q
          rendered="$(docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml config)"
          if echo "$rendered" | grep -q 'hr_manager_dev_password'; then
            echo "production configuration leaks development credentials" >&2
            exit 1
          fi
          if echo "$rendered" | grep -qE 'published:\s*"'; then
            echo "production configuration publishes external ports" >&2
            exit 1
          fi
          echo "production overlay is clean (no dev credentials, no published ports)"

      - name: Build and start the full stack (wait for healthy)
        run: docker compose -f infra/docker-compose.yml up --build --wait --wait-timeout 300

      - name: Verify backend /health returns HTTP 200
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)"
          [ "$code" = "200" ] || { echo "expected 200, got $code" >&2; exit 1; }
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Validate HTTPS proxy overlay configuration
        run: |
          # Each Actions step starts a fresh shell, so the production values
          # exported by the earlier overlay check must be recreated here.
          export APP_ENV=production
          export SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          export BOOTSTRAP_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          export SERVER_NAME=hr-manager.example.com
          export TLS_CERT_DIR=/tmp/hr-manager-tls
          docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml \
              -f infra/docker-compose.proxy.yml config -q
          rendered="$(docker compose -f infra/docker-compose.yml \
              -f infra/compose.prod.yml -f infra/docker-compose.proxy.yml config)"
          if ! echo "$rendered" | grep -q 'target: 443'; then
            echo "proxy overlay must publish HTTPS" >&2; exit 1
          fi
          if echo "$rendered" | grep -q 'hr_manager_dev_password'; then
            echo "proxy overlay leaks development credentials" >&2; exit 1
          fi
          echo "proxy overlay is clean (HTTPS published, no dev credentials)"

      - name: Verify the backup service produced an encrypted backup
        run: |
          # BACKUP_ON_START=1 in the dev stack: the scheduler encrypts a dump
          # into the dedicated backups volume soon after the db is healthy.
          for attempt in $(seq 1 24); do
            if docker compose -f infra/docker-compose.yml exec -T backup \
                sh -lc 'ls /var/backups/hr-manager/*.pgdump.enc >/dev/null 2>&1'; then
              echo "encrypted backup found"; exit 0
            fi
            sleep 5
          done
          echo "no encrypted backup appeared in the backups volume" >&2
          docker compose -f infra/docker-compose.yml logs backup
          exit 1

      - name: Verify frontend serves the app and proxies the API
        run: |
          curl -fsS http://localhost:8080/ | grep -q 'HR Manager'
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'

      - name: Stop PostgreSQL and verify degraded health (HTTP 503)
        run: |
          docker compose -f infra/docker-compose.yml stop db
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)"
          [ "$code" = "503" ] || { echo "expected 503, got $code" >&2; exit 1; }

      - name: Clean up the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans

  windows-installer:
    name: Windows engine tests + installer smoke
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install cryptography for trust-store tooling (pinned)
        shell: powershell
        run: |
          Write-Host "Installing cryptography via python -m pip..."
          python -m pip install cryptography==50.0.1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "python -m pip failed, trying python3..."
            python3 -m pip install cryptography==50.0.1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "python3 failed, trying py -3..."
            py -3 -m pip install cryptography==50.0.1
          }
          Write-Host "Check cryptography import:"
          python -c "import cryptography; print(cryptography.__version__)" 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            python3 -c "import cryptography; print(cryptography.__version__)" 2>&1 | Write-Host
          }
          if ($LASTEXITCODE -ne 0) {
            py -3 -c "import cryptography; print(cryptography.__version__)" 2>&1 | Write-Host
          }
          Write-Host "pip list:"
          pip list 2>&1 | Select-String "cryptography" | Write-Host

      - name: PowerShell engine tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File infra/windows/tests/run-tests.ps1

      - name: Validate ephemeral CI trust store (Phase 14 contract)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Python пишет stdout в pipe: без UTF-8 под cp1252-локалью
          # windows-latest любая кириллица в выводе = UnicodeEncodeError.
          $env:PYTHONIOENCODING = "utf-8"
          Write-Host "=== Trust store: CI fixture contract (Phase 14) ==="
          $trustStorePath = "infra/release/testdata/trusted_keys.json"
          if (-not (Test-Path $trustStorePath)) { throw "trust store not found: $trustStorePath" }
          # SHA считаем в PowerShell ДО вызова инструмента и передаём в
          # --expected-sha256: ci-contract обязан прочитать тот же файл
          # (расхождение -> отказ). Не парсим stdout python'а: в Windows
          # PowerShell 5.1 связка ErrorActionPreference=Stop и 2>&1 превращает
          # stderr внешней программы в terminating error, а кириллица в выводе
          # зависит от кодовой страницы консоли.
          $sha = (Get-FileHash -Path $trustStorePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "fixture file SHA256 (Get-FileHash): $sha"
          # ci-contract проверяет строгую схему, наличие активного и ОТОЗВАННОГО
          # ключей (pilot-test-key / pilot-revoked-key) и то, что
          # production-политика по-прежнему отклоняет этот набор
          # (--require-unrevoked и assert_no_fixture_keys). Ошибка -> код 1.
          # Контракт закреплён в Python (unit-тесты) и не живёт в YAML-строке.
          python infra/release/trust_store.py ci-contract --file $trustStorePath --expected-sha256 $sha
          if ($LASTEXITCODE -ne 0) { throw "trust store ci-contract failed with code $LASTEXITCODE" }
          # SHA файла фиксируется для build-шага: build.ps1 обязан увидеть
          # байт-идентичный файл, иначе сборка останавливается.
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV, "TRUST_STORE_SHA256=$sha`n", (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Written TRUST_STORE_SHA256=$sha to GITHUB_ENV"

      - name: Build HR Manager Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=== Build diagnostics ==="
          $trustStorePath = "infra/release/testdata/trusted_keys.json"
          if (-not (Test-Path $trustStorePath)) { throw "trust store fixture not found: $trustStorePath" }
          Write-Host "TRUST_STORE_SHA256 env: '$env:TRUST_STORE_SHA256'"
          $actualSha = (Get-FileHash -Path $trustStorePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "trust store actual SHA256: $actualSha"
          if (-not $env:TRUST_STORE_SHA256) {
            throw "TRUST_STORE_SHA256 is empty: the Validate step did not export it (GITHUB_ENV propagation is broken) — refusing to build with an unverified trust store"
          }
          Write-Host "=== Running installer/build.ps1 (child Windows PowerShell 5.1 process) ==="
          $logFile = Join-Path $env:RUNNER_TEMP "build.log"
          if (-not $logFile -or -not $env:RUNNER_TEMP) { $logFile = Join-Path $env:TEMP "build.log" }
          Write-Host "Logging to $logFile"
          # Скрипт запускается как ДОЧЕРНИЙ процесс powershell (Windows
          # PowerShell 5.1), а не через `& ./script.ps1`: в последнем случае
          # $LASTEXITCODE в этом шаге оставал бы устаревшим кодом последней
          # нативной команды ВНУТРИ скрипта и не отражал бы его результат.
          # build.ps1 завершается явным `exit 0` только при полном успехе.
          $scriptPath = (Resolve-Path (Join-Path (Get-Location) "installer/build.ps1")).Path
          & powershell -NoProfile -ExecutionPolicy Bypass -File $scriptPath -Version 0.13.0 -TrustStoreFile $trustStorePath -TrustStoreSha256 $env:TRUST_STORE_SHA256 *>&1 | Tee-Object -FilePath $logFile -Encoding utf8
          $code = $LASTEXITCODE
          Write-Host "build.ps1 exit code: $code"
          if ($code -ne 0) {
            Write-Host "=== build log (last 200 lines) ==="
            if (Test-Path $logFile) { Get-Content $logFile -Tail 200 | Write-Host }
            if ($env:GITHUB_STEP_SUMMARY -and (Test-Path $env:GITHUB_STEP_SUMMARY)) {
              $content = ""
              if (Test-Path $logFile) { $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue }
              if ($content.Length -gt 50000) { $content = $content.Substring(0, 50000) + "`n...truncated" }
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Build failed (exit $code)`n````````n$content`n``````"
            }
            throw "build.ps1 failed with exit code $code"
          }
          Write-Host "Build succeeded"
          Get-ChildItem installer/output -Recurse | ForEach-Object { Write-Host $_.FullName }
          if (Test-Path installer/release-manifest.json) { Get-Content installer/release-manifest.json | Write-Host }

      - name: Comment Build log on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const logPath = path.join(process.env.RUNNER_TEMP || process.env.TEMP || '/tmp', 'build.log');
            let content = '';
            try {
              if (fs.existsSync(logPath)) {
                content = fs.readFileSync(logPath, 'utf8');
                if (content.length > 50000) content = content.slice(0, 50000) + '\n...truncated';
              } else {
                content = 'No build.log found at ' + logPath;
              }
            } catch (e) { content = 'Error reading log: ' + e.message; }
            const body = `Build log for ${process.env.GITHUB_SHA} (run ${process.env.GITHUB_RUN_ID}):\n\`\`\`\n${content}\n\`\`\``;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('Posted PR comment');
            } catch (e) { console.log('Failed to post comment: ' + e.message); }

      - name: Authenticode-sign with ephemeral test certificate (never production)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $logFile = Join-Path $env:RUNNER_TEMP "authenticode.log"
          if (-not $logFile -or -not $env:RUNNER_TEMP) { $logFile = Join-Path $env:TEMP "authenticode.log" }
          Write-Host "Logging Authenticode to $logFile"
          # Скрипт запускается как ДОЧЕРНИЙ процесс powershell (Windows
          # PowerShell 5.1): $LASTEXITCODE отражает именно его код выхода
          # (sign.ps1 завершается явным `exit 0` только при полном успехе).
          # Ранее шаг запускал скрипт через `& ./sign.ps1 | Tee-Object` и
          # читал устаревший $LASTEXITCODE от `signtool verify /pa` внутри
          # скрипта (в test mode он обязан возвращать 1 — ephemeral test root
          # вне Root-доверия), из-за чего шаг падал даже при успешной подписи.
          $scriptPath = (Resolve-Path (Join-Path (Get-Location) "installer/sign.ps1")).Path
          & powershell -NoProfile -ExecutionPolicy Bypass -File $scriptPath -Mode test -Version 0.13.0 -TrustStoreFile infra/release/testdata/trusted_keys.json *>&1 | Tee-Object -FilePath $logFile -Encoding utf8
          $code = $LASTEXITCODE
          Write-Host "sign.ps1 exit code: $code"
          if ($code -ne 0) {
            Write-Host "=== authenticode log (last 200 lines) ==="
            if (Test-Path $logFile) { Get-Content $logFile -Tail 200 | Write-Host }
            if ($env:GITHUB_STEP_SUMMARY -and (Test-Path $env:GITHUB_STEP_SUMMARY)) {
              $content = ""
              if (Test-Path $logFile) { $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue }
              if ($content.Length -gt 50000) { $content = $content.Substring(0, 50000) + "`n...truncated" }
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Authenticode signing failed (exit $code)`n````````n$content`n``````"
            }
            throw "sign.ps1 failed with code $code"
          }
          # Обязательные артефакты: честная attestation, тестовый корень и
          # отчёт независимого верификатора (authenticode.py).
          foreach ($artifact in @("installer/authenticode-attestation.json",
              "installer/authenticode-roots.pem", "installer/authenticode-verification.json")) {
            if (-not (Test-Path $artifact)) { throw "sign.ps1 не создал обязательный артефакт: $artifact" }
          }
          # Attestation обязана честно отражать режим: в test mode
          # signtool_verify_ok может быть false (ephemeral-корень вне
          # Root-доверия) — это ожидаемо и НЕ production-valid подпись.
          $attestation = Get-Content installer/authenticode-attestation.json -Raw | ConvertFrom-Json
          Write-Host ("attestation: mode={0} signtool_verify_ok={1} windows_chain_trusted={2} publisher={3}" -f `
            $attestation.mode, $attestation.signtool_verify_ok, $attestation.windows_chain_trusted, `
            $attestation.publisher)
          if ($attestation.mode -ne "test") { throw "CI обязан подписывать в test-режиме, attestation: $($attestation.mode)" }
          if ($attestation.independent_verification.passed -ne $true) {
            throw "независимая проверка Authenticode (authenticode.py) не подтверждена в attestation"
          }
          if ($attestation.signtool_verify_ok -and $attestation.windows_chain_trusted) {
            Write-Host "Windows доверяет ephemeral-корню — тоже допустимо (attestation честна)"
          }
          Write-Host "attestation честна: mode=test, независимая проверка пройдена"

      - name: Comment Authenticode log on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const logPath = path.join(process.env.RUNNER_TEMP || process.env.TEMP || '/tmp', 'authenticode.log');
            let content = '';
            try {
              if (fs.existsSync(logPath)) {
                content = fs.readFileSync(logPath, 'utf8');
                if (content.length > 50000) content = content.slice(0,50000) + '\n...truncated';
              } else {
                content = 'No authenticode.log found at ' + logPath;
              }
            } catch (e) { content = 'Error reading log: ' + e.message; }
            const body = `Authenticode log for ${process.env.GITHUB_SHA} (run ${process.env.GITHUB_RUN_ID}):\n\`\`\`\n${content}\n\`\`\``;
            try {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: body});
              console.log('Posted Authenticode PR comment');
            } catch (e) { console.log('Failed: ' + e.message); }

      - name: Upload Authenticode attestation and verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authenticode-logs
          path: |
            installer/authenticode-attestation.json
            installer/authenticode-verification.json
          if-no-files-found: warn

      - name: Silent install and uninstall smoke
        shell: powershell
        run: |
          $setup = Get-ChildItem installer/output/HR-Manager-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe was not produced" }
          $process = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent install failed: $($process.ExitCode)" }
          $appDir = Join-Path $env:LOCALAPPDATA "Programs\HRManager"
          if (-not (Test-Path (Join-Path $appDir "infra\windows\hr-manager.ps1"))) {
            throw "Installed Windows engine is missing"
          }
          $uninstaller = Join-Path $appDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing" }
          $process = Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent uninstall failed: $($process.ExitCode)" }
          if (Test-Path (Join-Path $appDir "infra\windows\hr-manager.ps1")) {
            throw "Installed application files survived uninstall"
          }

      - name: Phase 14 pilot drill (Windows engine update/rollback/resume/uninstall)
        shell: powershell
        run: |
          # Python пишет stdout в pipe: без UTF-8 под cp1252-локалью
          # windows-latest не-ASCII символы в выводе = UnicodeEncodeError.
          $env:PYTHONIOENCODING = "utf-8"
          python infra/scripts/pilot_drill.py --out-dir drill --steps windows-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload pilot drill report (Windows engine)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-drill-windows
          path: |
            drill/pilot-drill.json
            drill/pilot-drill.md
          if-no-files-found: error

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hr-manager-windows-setup
          path: |
            installer/output/*.exe
            installer/release-manifest.json
            installer/authenticode-attestation.json
            installer/authenticode-roots.pem
            installer/authenticode-verification.json
          if-no-files-found: error

  channel-release-policy:
    name: Release pipeline fail-closed policy (ephemeral test signature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling (pinned, same as release job)
        run: pip install cryptography==50.0.1 pytest pyyaml

      - name: Release tooling unit tests (contract, trust store, Authenticode)
        run: |
          pytest -q infra/release/test_channel_contract.py
          pytest -q backend/tests/test_trust_store.py backend/tests/test_release_authenticode.py backend/tests/test_release_policy.py backend/tests/test_release_pipeline.py

      - name: Ephemeral Authenticode fixture — valid must verify, tampered/wrong/missing must fail
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "infra/release")
          from sign_authenticode import create_test_authority, make_test_pe, sign_test_pe
          work = Path("policy/ephemeral")
          work.mkdir(parents=True, exist_ok=True)
          publisher = "HR Manager CI Test Publisher"
          authority = create_test_authority(publisher)
          pe = make_test_pe(b"HRM-TEST-PE-BODY-FOR-CI")
          signed = sign_test_pe(pe, authority)
          installer = work / "HR-Manager-Setup-0.14.0.exe"
          installer.write_bytes(signed)
          roots = work / "authenticode-roots.pem"
          roots.write_bytes(authority.ca_pem())
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(installer), "--trust-roots", str(roots), "--json-out", str(work / "verified.json")], capture_output=True, text=True)
          if result.returncode != 0:
              print(result.stdout); print(result.stderr, file=sys.stderr); sys.exit(1)
          report = json.loads((work / "verified.json").read_text(encoding="utf-8"))
          assert report["signed"] is True and report["chain_verified"] is True
          tampered = work / "tampered.exe"
          _data = bytearray(signed); _data[0x250] ^= 0xFF; tampered.write_bytes(_data)
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(tampered), "--trust-roots", str(roots)], capture_output=True, text=True)
          assert result.returncode != 0 and "digest_mismatch" in result.stderr
          other = create_test_authority("Other Publisher")
          other_roots = work / "other-roots.pem"
          other_roots.write_bytes(other.ca_pem())
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(installer), "--trust-roots", str(other_roots)], capture_output=True, text=True)
          assert result.returncode != 0
          unsigned = work / "unsigned.exe"
          unsigned.write_bytes(make_test_pe(b"UNSIGNED"))
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(unsigned), "--trust-roots", str(roots)], capture_output=True, text=True)
          assert result.returncode != 0
          Path("policy/installer.exe").write_bytes(signed)
          Path("policy/roots.pem").write_bytes(authority.ca_pem())
          (work / "publisher.txt").write_text(publisher, encoding="utf-8")
          PY

      - name: Channel policy — valid / tampered / wrong signer / missing must be fail-closed
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib, shutil, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "infra/release")
          from sign_authenticode import create_test_authority, make_test_pe, sign_test_pe
          from trust_store import describe_trust_store, trust_store_sha256
          work = Path("policy/ephemeral")
          publisher = (work / "publisher.txt").read_text(encoding="utf-8").strip() if (work / "publisher.txt").exists() else "HR Manager CI Test Publisher"
          installer = Path("policy/installer.exe")
          roots = Path("policy/roots.pem")
          tmp = Path(tempfile.mkdtemp())
          snapshot = tmp / "app"
          shutil.copytree("infra/release/testdata/snapshot", snapshot)
          (snapshot / "release.json").write_text(json.dumps({"version": "0.14.0", "release_sha": "3"*40}), encoding="utf-8")
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          import base64
          key = Ed25519PrivateKey.generate()
          private_path = tmp / "channel-priv.hex"
          private_path.write_text(key.private_bytes_raw().hex() + "\n", encoding="utf-8")
          public_b64 = base64.b64encode(key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)).decode()
          trust_store = tmp / "trust-store.json"
          trust_store.write_text(json.dumps({"pilot-test-key": {"key": public_b64, "revoked": False}}), encoding="utf-8")
          fresh_auth = create_test_authority(publisher)
          fresh_signed = sign_test_pe(make_test_pe(b"HRM-TEST-PE-BODY-FOR-CI"), fresh_auth)
          installer.write_bytes(fresh_signed)
          roots.write_bytes(fresh_auth.ca_pem())
          trust_data = json.loads(trust_store.read_text(encoding="utf-8"))
          valid_attestation = {"mode": "test", "authenticode_present": True, "signtool_verify_ok": True, "timestamp_present": True, "publisher": publisher, "installer_sha256": hashlib.sha256(fresh_signed).hexdigest(), "signer_thumbprint_sha256": fresh_auth.leaf_certificate.fingerprint(__import__("cryptography").hazmat.primitives.hashes.SHA256()).hex(), "tool": "infra/release/sign_authenticode.py (ephemeral)", "trust_store": {"sha256": trust_store_sha256(trust_data), "keys": describe_trust_store(trust_data)}}
          attestation_path = tmp / "attestation.json"
          attestation_path.write_text(json.dumps(valid_attestation), encoding="utf-8")
          out_dir = tmp / "out"
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(out_dir), "--release-mode", "test", "--installer", str(installer), "--authenticode-roots", str(roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(attestation_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode == 0 and (out_dir / "update-channel.json").exists()
          tampered = tmp / "tampered.exe"
          _t = bytearray(fresh_signed); _t[0x250] ^= 0xFF; tampered.write_bytes(_t)
          tampered_att = dict(valid_attestation); tampered_att["mode"]="production"
          tampered_att_path = tmp / "tampered_att.json"
          tampered_att_path.write_text(json.dumps(tampered_att), encoding="utf-8")
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-tampered"), "--release-mode", "production", "--installer", str(tampered), "--authenticode-roots", str(roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(tampered_att_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode != 0
          wrong_roots = tmp / "wrong.pem"
          wrong_auth = create_test_authority("Other Publisher")
          wrong_roots.write_bytes(wrong_auth.ca_pem())
          wrong_att = dict(valid_attestation); wrong_att["mode"]="production"
          wrong_att_path = tmp / "wrong_att.json"
          wrong_att_path.write_text(json.dumps(wrong_att), encoding="utf-8")
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-wrong"), "--release-mode", "production", "--installer", str(installer), "--authenticode-roots", str(wrong_roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(wrong_att_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode != 0
          unsigned = tmp / "unsigned.exe"
          unsigned.write_bytes(make_test_pe(b"UNSIGNED-PE"))
          unsigned_att = dict(valid_attestation); unsigned_att["mode"]="production"; unsigned_att["installer_sha256"]=hashlib.sha256(unsigned.read_bytes()).hexdigest()
          unsigned_att_path = tmp / "unsigned_att.json"
          unsigned_att_path.write_text(json.dumps(unsigned_att), encoding="utf-8")
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-missing"), "--release-mode", "production", "--installer", str(unsigned), "--authenticode-roots", str(roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(unsigned_att_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode != 0
          PY

      - name: No secrets in produced reports
        run: |
          set -euo pipefail
          for pattern in "PRIVATE KEY" "BEGIN RSA" "test_key.priv"; do
            if grep -rIl -- "$pattern" policy/ 2>/dev/null; then
              echo "secret-like material found in policy artifacts: $pattern" >&2; exit 1
            fi
          done
          echo "reports carry no private material"
