          }
          & $emit "notice" "license-issuer-windows evidence" @($lines | Where-Object { $_ -match "^\[(parser|build|runtime|accept|backend)\] " })
          if ($code -ne 0) { & $emit "error" "license-issuer-windows failure tail" (@($lines | Select-Object -Last 30) + ("exit code: " + $code)) }
          exit $code

      - name: Remove the license/public-key handoff directory
        if: always()
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP "hrm-accept-handoff"
          if (Test-Path $h) { Remove-Item $h -Recurse -Force }
          if (Test-Path $h) { Write-Host "::warning::could not remove $h"; exit 1 }
          Write-Host "handoff directory removed"

  channel-release-policy:
    name: Release pipeline fail-closed policy (ephemeral test signature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling (pinned, same as release job)
        run: pip install cryptography==50.0.1 pytest pyyaml

      - name: Release tooling unit tests (contract, trust store, Authenticode)
        run: |
          pytest -q infra/release/test_channel_contract.py
          pytest -q backend/tests/test_trust_store.py backend/tests/test_release_authenticode.py backend/tests/test_release_policy.py backend/tests/test_release_pipeline.py backend/tests/test_authenticode_pem_preflight.py

      - name: Ephemeral Authenticode fixture — valid must verify, tampered/wrong/missing must fail
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "infra/release")
          from sign_authenticode import create_test_authority, make_test_pe, sign_test_pe
          work = Path("policy/ephemeral")
          work.mkdir(parents=True, exist_ok=True)
          publisher = "HR Manager CI Test Publisher"
          authority = create_test_authority(publisher)
          pe = make_test_pe(b"HRM-TEST-PE-BODY-FOR-CI")
          signed = sign_test_pe(pe, authority)
          installer = work / "HR-Manager-Setup-0.14.0.exe"
          installer.write_bytes(signed)
          roots = work / "authenticode-roots.pem"
          roots.write_bytes(authority.ca_pem())
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(installer), "--trust-roots", str(roots), "--json-out", str(work / "verified.json")], capture_output=True, text=True)
          if result.returncode != 0:
              print(result.stdout); print(result.stderr, file=sys.stderr); sys.exit(1)
          report = json.loads((work / "verified.json").read_text(encoding="utf-8"))
          assert report["signed"] is True and report["chain_verified"] is True
          tampered = work / "tampered.exe"
          _data = bytearray(signed); _data[0x250] ^= 0xFF; tampered.write_bytes(_data)
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(tampered), "--trust-roots", str(roots)], capture_output=True, text=True)
          assert result.returncode != 0 and "digest_mismatch" in result.stderr
          other = create_test_authority("Other Publisher")
          other_roots = work / "other-roots.pem"
          other_roots.write_bytes(other.ca_pem())
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(installer), "--trust-roots", str(other_roots)], capture_output=True, text=True)
          assert result.returncode != 0
          unsigned = work / "unsigned.exe"
          unsigned.write_bytes(make_test_pe(b"UNSIGNED"))
          result = subprocess.run([sys.executable, "infra/release/authenticode.py", "verify", "--file", str(unsigned), "--trust-roots", str(roots)], capture_output=True, text=True)
          assert result.returncode != 0
          Path("policy/installer.exe").write_bytes(signed)
          Path("policy/roots.pem").write_bytes(authority.ca_pem())
          (work / "publisher.txt").write_text(publisher, encoding="utf-8")
          PY

      - name: Channel policy — valid / tampered / wrong signer / missing must be fail-closed
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib, shutil, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "infra/release")
          from sign_authenticode import EphemeralAuthority, create_test_authority, make_test_pe, sign_test_pe
          from trust_store import describe_trust_store, trust_store_sha256
          work = Path("policy/ephemeral")
          publisher = (work / "publisher.txt").read_text(encoding="utf-8").strip() if (work / "publisher.txt").exists() else "HR Manager CI Test Publisher"
          installer = Path("policy/installer.exe")
          roots = Path("policy/roots.pem")
          tmp = Path(tempfile.mkdtemp())
          snapshot = tmp / "app"
          shutil.copytree("infra/release/testdata/snapshot", snapshot)
          (snapshot / "release.json").write_text(json.dumps({"version": "0.14.0", "release_sha": "3"*40}), encoding="utf-8")
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          import base64
          key = Ed25519PrivateKey.generate()
          private_path = tmp / "channel-priv.hex"
          private_path.write_text(key.private_bytes_raw().hex() + "\n", encoding="utf-8")
          public_b64 = base64.b64encode(key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)).decode()
          trust_store = tmp / "trust-store.json"
          trust_store.write_text(json.dumps({"pilot-test-key": {"key": public_b64, "revoked": False}}), encoding="utf-8")
          signer_auth = create_test_authority(publisher)
          tsa_auth = create_test_authority("Independent CI TSA")
          fresh_auth = EphemeralAuthority(
              ca_certificate=signer_auth.ca_certificate, ca_key=signer_auth.ca_key,
              leaf_certificate=signer_auth.leaf_certificate, leaf_key=signer_auth.leaf_key,
              tsa_certificate=tsa_auth.tsa_certificate, tsa_key=tsa_auth.tsa_key,
              publisher=publisher,
          )
          tsa_roots = Path("policy/timestamp-roots.pem")
          tsa_roots.write_bytes(tsa_auth.ca_pem())
          fresh_signed = sign_test_pe(make_test_pe(b"HRM-TEST-PE-BODY-FOR-CI"), fresh_auth)
          installer.write_bytes(fresh_signed)
          roots.write_bytes(fresh_auth.ca_pem())
          trust_data = json.loads(trust_store.read_text(encoding="utf-8"))
          valid_attestation = {"mode": "test", "authenticode_present": True, "signtool_verify_ok": True, "timestamp_present": True, "publisher": publisher, "installer_sha256": hashlib.sha256(fresh_signed).hexdigest(), "signer_thumbprint_sha256": fresh_auth.leaf_certificate.fingerprint(__import__("cryptography").hazmat.primitives.hashes.SHA256()).hex(), "tool": "infra/release/sign_authenticode.py (ephemeral)", "trust_store": {"sha256": trust_store_sha256(trust_data), "keys": describe_trust_store(trust_data)}}
          attestation_path = tmp / "attestation.json"
          attestation_path.write_text(json.dumps(valid_attestation), encoding="utf-8")
          out_dir = tmp / "out"
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(out_dir), "--release-mode", "test", "--installer", str(installer), "--authenticode-roots", str(roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(attestation_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode == 0 and (out_dir / "update-channel.json").exists()
          tampered = tmp / "tampered.exe"
          _t = bytearray(fresh_signed); _t[0x250] ^= 0xFF; tampered.write_bytes(_t)
          tampered_att = dict(valid_attestation); tampered_att["mode"]="production"
          tampered_att_path = tmp / "tampered_att.json"
          tampered_att_path.write_text(json.dumps(tampered_att), encoding="utf-8")
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-tampered"), "--release-mode", "production", "--installer", str(tampered), "--authenticode-roots", str(roots), "--authenticode-timestamp-roots", str(tsa_roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(tampered_att_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          # Отказ обязан быть по своей причине, а не из-за отсутствующего параметра.
          assert result.returncode != 0 and "installer_changed_after_signing" in (result.stdout + result.stderr), result.stderr[-400:]
          wrong_roots = tmp / "wrong.pem"
          wrong_auth = create_test_authority("Other Publisher")
          wrong_roots.write_bytes(wrong_auth.ca_pem())
          wrong_att = dict(valid_attestation); wrong_att["mode"]="production"
          wrong_att_path = tmp / "wrong_att.json"
          wrong_att_path.write_text(json.dumps(wrong_att), encoding="utf-8")
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-wrong"), "--release-mode", "production", "--installer", str(installer), "--authenticode-roots", str(wrong_roots), "--authenticode-timestamp-roots", str(tsa_roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(wrong_att_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode != 0 and "untrusted_root" in (result.stdout + result.stderr), result.stderr[-400:]
          unsigned = tmp / "unsigned.exe"
          unsigned.write_bytes(make_test_pe(b"UNSIGNED-PE"))
          unsigned_att = dict(valid_attestation); unsigned_att["mode"]="production"; unsigned_att["installer_sha256"]=hashlib.sha256(unsigned.read_bytes()).hexdigest()
          unsigned_att_path = tmp / "unsigned_att.json"
          unsigned_att_path.write_text(json.dumps(unsigned_att), encoding="utf-8")
          # Production без отдельного корня TSA обязан отказать fail-closed:
          # signer CA и TSA CA независимы, повторять их друг в друге нельзя.
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-no-tsa-roots"), "--release-mode", "production", "--installer", str(installer), "--authenticode-roots", str(roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(attestation_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode != 0 and "missing_authenticode_timestamp_roots" in (result.stdout + result.stderr), result.stderr[-400:]
          cmd = [sys.executable, "infra/release/publish_channel.py", "--snapshot", str(snapshot), "--version", "0.14.0", "--release-sha", "3"*40, "--package-url", "https://github.com/example/example/releases/download/v0.14.0/hr-manager-windows-0.14.0.zip", "--minimum-supported-version", "0.13.0", "--private-key", str(private_path), "--key-id", "pilot-test-key", "--out-dir", str(tmp/"out-missing"), "--release-mode", "production", "--installer", str(unsigned), "--authenticode-roots", str(roots), "--authenticode-timestamp-roots", str(tsa_roots), "--expected-publisher", publisher, "--trust-store", str(trust_store), "--authenticode-attestation", str(unsigned_att_path)]
          result = subprocess.run(cmd, capture_output=True, text=True)
          assert result.returncode != 0 and "unsigned" in (result.stdout + result.stderr), result.stderr[-400:]
          PY

      - name: No secrets in produced reports
        run: |
          set -euo pipefail
          for pattern in "PRIVATE KEY" "BEGIN RSA" "test_key.priv"; do
            if grep -rIl -- "$pattern" policy/ 2>/dev/null; then
              echo "secret-like material found in policy artifacts: $pattern" >&2; exit 1
            fi
          done
          echo "reports carry no private material"
