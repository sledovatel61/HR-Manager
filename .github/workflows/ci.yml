    name: License issuer bundle - Windows PowerShell 5.1 checks
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Encoding + Windows PowerShell 5.1 parser check (all repository PowerShell files)
        shell: powershell
        run: |
          # Windows PowerShell 5.1 logic lives in checked-in helpers (ASCII + UTF-8 BOM).
          # Output goes to the log and to RUNNER_TEMP; the helper's own "[phase] ..."
          # result lines become a notice annotation (readable via the check-run API),
          # a failure tail becomes an error annotation. Key-like runs are redacted.
          $ErrorActionPreference = "Continue"
          $diag = Join-Path $env:RUNNER_TEMP "diag-parser.txt"
          $lines = @(& powershell -NoProfile -ExecutionPolicy Bypass -File tools/license-issuer/ci-windows-checks.ps1 -Phase parser *>&1 | ForEach-Object { $l = $_.ToString(); Write-Host $l; $l })
          $code = $LASTEXITCODE
          Set-Content -Path $diag -Value ($lines + ("exit code: " + $code)) -Encoding UTF8
          # Annotations are capped at 4096 chars each and 10 per level per step:
          # evidence is emitted in chunks. Key-like tokens are redacted (64+ hex,
          # 40+ base64/base64url chars containing digits and letters).
          $emit = {
            param([string]$kind, [string]$title, [string[]]$src)
            $rx = "(?<![A-Za-z0-9+/_-])(?:[0-9a-fA-F]{64,}|(?=[A-Za-z0-9+/_-]*[0-9])(?=[A-Za-z0-9+/_-]*[A-Za-z])[A-Za-z0-9+/_-]{40,}={0,2})(?![A-Za-z0-9+/_=-])"
            $chunks = New-Object System.Collections.ArrayList
            $cur = ""
            foreach ($l in $src) {
              $l = [regex]::Replace([string]$l, $rx, "<redacted>")
              if ($l.Length -gt 3500) { $l = $l.Substring(0, 3500) + " ..." }
              if ($cur.Length -gt 0 -and ($cur.Length + $l.Length + 1) -gt 3800) { [void]$chunks.Add($cur); $cur = "" }
              if ($cur.Length -gt 0) { $cur += "`n" }
              $cur += $l
            }
            if ($cur.Length -gt 0) { [void]$chunks.Add($cur) }
            $n = [Math]::Min($chunks.Count, 9)
            for ($i = 0; $i -lt $n; $i++) {
              $m = ([string]$chunks[$i]).Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Host ("::" + $kind + " title=" + $title + " " + ($i + 1) + "/" + $chunks.Count + "::" + $m)
            }
          }
          & $emit "notice" "license-issuer-windows evidence" @($lines | Where-Object { $_ -match "^\[(parser|build|runtime|accept|backend)\] " })
          if ($code -ne 0) { & $emit "error" "license-issuer-windows failure tail" (@($lines | Select-Object -Last 30) + ("exit code: " + $code)) }
          exit $code

