name: Pilot release (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for Setup.exe (например 0.15.0)"
        required: true
        default: "0.15.0"
      release_sha:
        description: "Full git SHA to build (по умолчанию HEAD)"
        required: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  pilot-release:
    name: Build pilot Setup.exe + SHA256SUMS + license-issuer
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve version and SHA
        id: resolve
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "0.15.0" }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "version must be SemVer x.y.z, got $version" }
          $shaInput = "${{ inputs.release_sha }}"
          $sha = ""
          if ($shaInput) {
            if ($shaInput -notmatch '^[0-9a-fA-F]{40}$') { throw "release_sha must be 40 hex" }
            git fetch origin $shaInput --depth=1
            git checkout -q $shaInput
            $sha = (git rev-parse HEAD).Trim()
            if ($sha -ne $shaInput.ToLowerInvariant()) { throw "checkout HEAD != release_sha" }
          } else {
            $sha = (git rev-parse HEAD).Trim()
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version=$version sha=$sha"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cryptography for build (pinned)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet cryptography==50.0.1
          python -c "import cryptography; print(cryptography.__version__)"

      - name: Resolve license public key (file or GH variable/secret)
        id: license
        shell: pwsh
        env:
          HRM_LICENSE_PUBLIC_KEY_VARS: ${{ vars.HRM_LICENSE_PUBLIC_KEY }}
          HRM_LICENSE_PUBLIC_KEY_SECRET: ${{ secrets.HRM_LICENSE_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $repoFile = "infra/license/public_key.b64"
          $key = ""
          if (Test-Path $repoFile) {
            $key = (Get-Content $repoFile -Raw -Encoding UTF8).Trim()
            Write-Host "Found public key in $repoFile : $($key.Substring(0,8))... (redacted)"
          }
          if (-not $key -and $env:HRM_LICENSE_PUBLIC_KEY) {
            $key = $env:HRM_LICENSE_PUBLIC_KEY.Trim()
            Write-Host "Using HRM_LICENSE_PUBLIC_KEY from env (direct)"
          }
          if (-not $key -and $env:HRM_LICENSE_PUBLIC_KEY_SECRET) {
            $key = $env:HRM_LICENSE_PUBLIC_KEY_SECRET.Trim()
            Write-Host "Using HRM_LICENSE_PUBLIC_KEY_SECRET from GitHub secret"
          }
          if (-not $key -and $env:HRM_LICENSE_PUBLIC_KEY_VARS) {
            $key = $env:HRM_LICENSE_PUBLIC_KEY_VARS.Trim()
            Write-Host "Using HRM_LICENSE_PUBLIC_KEY_VARS from GitHub variable"
          }
          # GitHub variable without prefix?
          if (-not $key -and $env:LICENSE_PUBLIC_KEY) { $key = $env:LICENSE_PUBLIC_KEY.Trim() }
          if (-not $key) {
            Write-Host "::error::HRM_LICENSE_PUBLIC_KEY missing: place public_key.b64 in infra/license/ or set GH variable/secret HRM_LICENSE_PUBLIC_KEY"
            throw "HRM_LICENSE_PUBLIC_KEY is required for pilot build (fail-closed)"
          }
          # Validate base64 32 bytes
          try {
            $decoded = [Convert]::FromBase64String($key)
            if ($decoded.Length -ne 32) { throw "not 32 bytes" }
          } catch {
            throw "LICENSE_PUBLIC_KEY invalid (must be base64 32 bytes): $_"
          }
          # Save to env for build.ps1 to pick up (if file not committed)
          if (-not (Test-Path $repoFile)) {
            # Write temporary file for build step to find? build.ps1 checks env fallback, so just set env
            Write-Host "No repo file, will use env fallback"
          }
          # Also set for later steps (redacted in log)
          Add-Content -Path $env:GITHUB_ENV -Value "HRM_LICENSE_PUBLIC_KEY=$key"
          Write-Host "License public key validated (32 bytes)"

      - name: Build autonomous license-issuer bundle (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/license-issuer/build.ps1
          if ($LASTEXITCODE -ne 0) { throw "license-issuer build failed" }
          if (-not (Test-Path "tools/license-issuer/dist/license-issuer-dist.zip")) { throw "license-issuer-dist.zip not created" }
          Get-ChildItem tools/license-issuer/dist -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Build HR Manager Setup.exe (pilot, unsigned)
        shell: pwsh
        env:
          HRM_LICENSE_PUBLIC_KEY: ${{ env.HRM_LICENSE_PUBLIC_KEY }}
          HRM_RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.resolve.outputs.version }}"
          Write-Host "Building Setup.exe version $version with HRM_RELEASE_SHA=$env:HRM_RELEASE_SHA"
          # Pilot uses public key from file or env; no trust store (channel trust store not needed for pilot)
          # But if trust store file exists for pilot (test), we can skip. Build will fail if license missing (desired).
          & ./installer/build.ps1 -Version $version
          # Also support explicit TrustStore if present? Not needed for pilot.
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed" }
          Get-ChildItem installer/output -Recurse | ForEach-Object { Write-Host $_.FullName }
          Get-Content installer/release-manifest.json -Raw | Write-Host

      - name: Generate SHA256SUMS.txt for pilot artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.resolve.outputs.version }}"
          $setup = Get-ChildItem installer/output/HR-Manager-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe missing" }
          $hash = (Get-FileHash -Path $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $issuerZip = Get-ChildItem tools/license-issuer/dist/license-issuer-dist.zip | Select-Object -First 1
          $issuerHash = (Get-FileHash -Path $issuerZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestHash = (Get-FileHash -Path installer/release-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines = @(
            "$hash  $($setup.Name)"
            "$issuerHash  license-issuer-dist.zip"
            "$manifestHash  release-manifest.json"
          )
          $outPath = "installer/output/SHA256SUMS.txt"
          Set-Content -Path $outPath -Value $lines -Encoding ASCII
          Write-Host "SHA256SUMS.txt:"
          Get-Content $outPath | Write-Host
          # Also create SHA256SUMS at repo root for artifact upload convenience
          Copy-Item $outPath "./SHA256SUMS.txt" -Force

      - name: Verify no private keys in artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patterns = @("PRIVATE KEY", "BEGIN RSA", "private_key.hex", ".hrmlicense")
          foreach ($pat in $patterns) {
            $found = Select-String -Path "installer/output/*", "installer/release-manifest.json" -Pattern $pat -ErrorAction SilentlyContinue
            if ($found) { throw "private-like material found in pilot artifacts: $pat" }
          }
          # Check license zip does not contain private key files
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("tools/license-issuer/dist/license-issuer-dist.zip")
          try {
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -match "private_key|\\.hrmlicense") { throw "license zip contains private material: $($entry.FullName)" }
            }
          } finally { $zip.Dispose() }
          Write-Host "No private keys in artifacts"

      - name: Upload pilot artifacts (no tag, no Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-release-${{ steps.resolve.outputs.version }}
          path: |
            installer/output/HR-Manager-Setup-*.exe
            installer/output/SHA256SUMS.txt
            SHA256SUMS.txt
            tools/license-issuer/dist/license-issuer-dist.zip
            installer/release-manifest.json
          if-no-files-found: error
