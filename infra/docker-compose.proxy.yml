# Optional HTTPS reverse-proxy overlay for production (roadmap phase 7).
#
# The production overlay (compose.prod.yml) publishes NO ports; all traffic
# enters through this nginx proxy, which terminates TLS and forwards to the
# internal backend/frontend services. The TLS private key never leaves the
# proxy container mount and is not readable by the application.
#
# POLICY (documented in infra/nginx/README.md):
#   * plaintext HTTP is REDIRECTED to HTTPS (change the template to reject
#     if a redirect is not acceptable in your network);
#   * TLS certificates/DNS are NOT shipped with the repository — the
#     operator provides server.crt/server.key in TLS_CERT_DIR (see the
#     README for generation/validation steps and expiry checks).
#
# Usage:
#   export SERVER_NAME=hr-manager.example.com
#   export TLS_CERT_DIR=/etc/hr-manager/tls   # host dir with the key pair
#   docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml \
#       -f infra/docker-compose.proxy.yml up -d
#
# The image is pinned to the same nginx line the frontend container uses
# (nginx 1.27-alpine; nginx-unprivileged variant there, privileged here
# because it binds 80/443).
name: hr-manager

services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      SERVER_NAME: ${SERVER_NAME:-hr-manager.example.com}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Operator-managed key pair; mounted read-only, never built into images.
      - ${TLS_CERT_DIR:-/etc/hr-manager/tls}:/etc/nginx/tls:ro
      # envsubst template (no secrets inside); the nginx entrypoint renders
      # it to /etc/nginx/conf.d/default.conf at container start.
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
