# Local development environment: PostgreSQL + backend + frontend.
# Production overlay: compose.prod.yml (enforces secret configuration).
name: hr-manager

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_manager
      POSTGRES_USER: hr_manager
      POSTGRES_PASSWORD: hr_manager_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_manager -d hr_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      SECRET_KEY: dev-only-secret-key-not-for-production
      DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_dev_password@db:5432/hr_manager
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
