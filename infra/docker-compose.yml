# Local development environment: PostgreSQL + backend + frontend.
#
# PATH CONVENTION: `build.context` is resolved relative to THIS FILE
# (infra/docker-compose.yml), hence `../backend` and `../frontend`.
# The file is always invoked as:
#     docker compose -f infra/docker-compose.yml ...
#
# SECURITY: all dev ports are bound to 127.0.0.1, so the stack is reachable
# only from the local machine. The credentials below are DEVELOPMENT ONLY —
# the backend refuses to start in production with them, and the production
# overlay (infra/compose.prod.yml) requires real secrets from the environment
# and publishes no ports at all.
name: hr-manager

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_manager
      POSTGRES_USER: hr_manager
      # DEVELOPMENT ONLY — never reuse in production.
      POSTGRES_PASSWORD: hr_manager_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_manager -d hr_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      # Relative to this compose file: repo-root/backend
      context: ../backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      # DEVELOPMENT ONLY — the production guard in app/config.py rejects it.
      SECRET_KEY: dev-only-secret-key-not-for-production
      DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_dev_password@db:5432/hr_manager
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      # Relative to this compose file: repo-root/frontend
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # nginx-unprivileged listens on 8080 inside the container.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Encrypted backups (roadmap phase 7). Development only credentials and
  # key: the production overlay replaces them from the environment, and the
  # backend production guard refuses to run with this exact key value.
  backup:
    build:
      # Repo-root context so backend/ and infra/scripts/ are both available.
      context: ..
      dockerfile: backend/Dockerfile.backup
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_dev_password@db:5432/hr_manager
      BACKUP_DRILL_ADMIN_URL: postgresql+psycopg://hr_manager:hr_manager_dev_password@db:5432/postgres
      BACKUP_DIR: /var/backups/hr-manager
      BACKUP_STATE_FILE: /var/backups/hr-manager/state.json
      # DEVELOPMENT ONLY — never reuse in production.
      BACKUP_KEY_ID: dev-backup-key
      BACKUP_ENC_KEY: "ZGV2LW9ubHktYmFja3VwLWtleS0wMDAwMDAwMDAwMDA="
      BACKUP_SCHEDULE_UTC: "02:00"
      BACKUP_DRILL_INTERVAL_HOURS: "168"
      BACKUP_ON_START: "1"
      BACKUP_MIN_FREE_MB: "512"
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/var/backups/hr-manager
    healthcheck:
      # The scheduler touches the marker when its loop starts; the backup
      # itself is monitored through /ops/backup-health, not this check.
      test: ["CMD-SHELL", "test -f /tmp/backup-scheduler-ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  # Dedicated storage for encrypted backups — separate from the application
  # volume so backups never share a lifecycle with app data.
  backups:
