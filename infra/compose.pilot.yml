# Local Windows pilot overlay (phase 12) for infra/docker-compose.yml.
#
# ONE stable Compose project — `hr-manager-pilot` — runs PostgreSQL, backend,
# frontend, worker and backup in Linux containers on Docker Desktop/WSL2.
# ONLY the frontend is published, bound to 127.0.0.1; the database, backend
# and worker are unreachable from the local network.
#
# The pilot serves plain http on loopback, so the session/CSRF cookies are
# explicitly non-Secure (SESSION_COOKIE_SECURE=false) and the backend runs
# with APP_ENV=pilot: a production-grade guard (strong generated secrets,
# APP_DEBUG=false, no development credentials, no bootstrap admin) that
# documents the loopback trust model instead of silently weakening
# production. Production (compose.prod.yml) still requires Secure cookies
# unconditionally.
#
# External SMTP/Telegram integrations are OFF by default and never block the
# start; the local Mailpit service is excluded via a profile.
#
# PostgreSQL data and encrypted backups live in dedicated named volumes
# (`pilot_pgdata`, `pilot_backups`) and survive ordinary stop/restart/update.
#
# All secrets arrive from the engine-generated protected env file; never
# from the repository or the host environment:
#
#   docker compose --env-file "<state>\pilot.env" \
#       -f infra/docker-compose.yml -f infra/compose.pilot.yml up -d
#
# REQUIRES Docker Compose v2.24+ (the !reset YAML tag), like compose.prod.yml.

name: hr-manager-pilot

services:
  db:
    environment:
      POSTGRES_DB: hr_manager
      POSTGRES_USER: hr_manager
      # Generated by the Windows engine on first install; the development
      # password from the base file must never reach a pilot.
      POSTGRES_PASSWORD: ${HRM_POSTGRES_PASSWORD:?HRM_POSTGRES_PASSWORD is required for the pilot}
    ports: !reset []
    volumes:
      - pilot_pgdata:/var/lib/postgresql/data

  backend:
    # Explicit stable tag: updates build the new images under this tag and
    # re-tag the previous ones as `:previous` for the documented rollback
    # (see infra/windows/hr-manager.ps1, action `update`).
    image: hr-manager-pilot-backend:pilot
    environment:
      APP_ENV: pilot
      APP_DEBUG: "false"
      SECRET_KEY: ${HRM_SIGNING_KEY:?HRM_SIGNING_KEY is required for the pilot}
      # Generated by the engine: after the exchange token is retired
      # (owner created) the pilot guard requires a strong bootstrap
      # password; users already exist, so bootstrap never uses it.
      BOOTSTRAP_ADMIN_PASSWORD: ${HRM_BOOTSTRAP_ADMIN_PASSWORD:?HRM_BOOTSTRAP_ADMIN_PASSWORD is required for the pilot}
      # Explicit loopback trust model (see the file header). Production
      # never allows this value; the pilot never serves beyond 127.0.0.1.
      SESSION_COOKIE_SECURE: "false"
      DATABASE_URL: postgresql+psycopg://hr_manager:${HRM_POSTGRES_PASSWORD:?HRM_POSTGRES_PASSWORD is required}@db:5432/hr_manager
      RELEASE_SHA: ${HRM_RELEASE_SHA:-}
      # The API reports backup freshness from the scheduler state. Mount the
      # shared volume read-only: the backend must observe, but never modify,
      # encrypted backup artifacts.
      BACKUP_DIR: /var/backups/hr-manager
      BACKUP_STATE_FILE: /var/backups/hr-manager/state.json
      # One-time local first-run exchange (phase 12). Only the SHA-256 hash
      # is stored by the backend; the raw token exists only in the
      # ACL-protected local env file of the engine.
      PILOT_BOOTSTRAP_EXCHANGE_TOKEN: ${HRM_EXCHANGE_TOKEN:?HRM_EXCHANGE_TOKEN is required for the pilot}
      # External channels: OFF by default, nothing to configure.
      TELEGRAM_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      SMTP_ENABLED: "false"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_ENCRYPTION: "starttls"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
    ports: !reset []
    volumes:
      - pilot_backups:/var/backups/hr-manager:ro

  frontend:
    image: hr-manager-pilot-frontend:pilot
    # The ONLY published port of the pilot: the application on loopback.
    ports:
      - "127.0.0.1:${HRM_PILOT_PORT:-8080}:8080"

  # Local SMTP sink is development-only: excluded from the pilot by the
  # profile (a service with a profile is not started by a plain `up`).
  mailpit:
    profiles: ["pilot-disabled"]

  worker:
    image: hr-manager-pilot-backend:pilot
    environment:
      APP_ENV: pilot
      APP_DEBUG: "false"
      SECRET_KEY: ${HRM_SIGNING_KEY:?HRM_SIGNING_KEY is required for the pilot}
      BOOTSTRAP_ADMIN_PASSWORD: ${HRM_BOOTSTRAP_ADMIN_PASSWORD:?HRM_BOOTSTRAP_ADMIN_PASSWORD is required for the pilot}
      DATABASE_URL: postgresql+psycopg://hr_manager:${HRM_POSTGRES_PASSWORD:?HRM_POSTGRES_PASSWORD is required}@db:5432/hr_manager
      NOTIFICATION_DEFAULT_TIMEZONE: ${NOTIFICATION_DEFAULT_TIMEZONE:-Europe/Moscow}
      NOTIFICATION_QUIET_HOURS_START: ${NOTIFICATION_QUIET_HOURS_START:-21:00}
      NOTIFICATION_QUIET_HOURS_END: ${NOTIFICATION_QUIET_HOURS_END:-08:00}
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-2}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      TELEGRAM_ENABLED: "false"
      SMTP_ENABLED: "false"
      TZ: UTC
    ports: !reset []

  backup:
    image: hr-manager-pilot-backup:pilot
    environment:
      APP_ENV: pilot
      APP_DEBUG: "false"
      SECRET_KEY: ${HRM_SIGNING_KEY:?HRM_SIGNING_KEY is required for the pilot}
      BOOTSTRAP_ADMIN_PASSWORD: ${HRM_BOOTSTRAP_ADMIN_PASSWORD:?HRM_BOOTSTRAP_ADMIN_PASSWORD is required for the pilot}
      DATABASE_URL: postgresql+psycopg://hr_manager:${HRM_POSTGRES_PASSWORD:?HRM_POSTGRES_PASSWORD is required}@db:5432/hr_manager
      # The official postgres image creates the POSTGRES_USER as superuser,
      # so the same credentials can create/drop the restore-drill database.
      BACKUP_DRILL_ADMIN_URL: postgresql+psycopg://hr_manager:${HRM_POSTGRES_PASSWORD:?HRM_POSTGRES_PASSWORD is required}@db:5432/postgres
      BACKUP_DIR: /var/backups/hr-manager
      BACKUP_STATE_FILE: /var/backups/hr-manager/state.json
      # Encryption secrets: generated by the engine, required here so a
      # pilot can never produce an unencrypted backup.
      BACKUP_KEY_ID: ${HRM_BACKUP_KEY_ID:?HRM_BACKUP_KEY_ID is required for the pilot}
      BACKUP_ENC_KEY: ${HRM_BACKUP_KEY:?HRM_BACKUP_KEY is required for the pilot}
      BACKUP_SCHEDULE_UTC: ${HRM_BACKUP_SCHEDULE_UTC:-02:00}
      BACKUP_DRILL_INTERVAL_HOURS: ${HRM_BACKUP_DRILL_INTERVAL_HOURS:-168}
      BACKUP_ON_START: ${HRM_BACKUP_ON_START:-0}
      BACKUP_MIN_FREE_MB: ${HRM_BACKUP_MIN_FREE_MB:-1024}
      BACKUP_REASON: ${HRM_BACKUP_REASON:-scheduled backup}
      TZ: UTC
    volumes:
      - pilot_backups:/var/backups/hr-manager
    ports: !reset []

volumes:
  # Dedicated pilot storage: application data and encrypted backups never
  # share a lifecycle with development volumes or the installer files.
  pilot_pgdata:
  pilot_backups:
