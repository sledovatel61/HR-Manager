# Production overlay for infra/docker-compose.yml.
#
# REQUIRES Docker Compose v2.24+ (the !reset YAML tag).
#
# Secrets come ONLY from environment variables; the ${VAR:?} syntax makes
# `docker compose` fail fast when a required variable is missing. All
# externally published ports are REMOVED with `ports: !reset []` — in
# production the stack sits behind a reverse proxy with HTTPS (roadmap
# phase 7), nothing is exposed directly.
#
# Usage from the repository root:
#   export APP_ENV=production
#   export SECRET_KEY=$(openssl rand -hex 32)
#   export POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   export BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 16)
#   infra/scripts/check_env.sh
#   docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml config
#   docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml up -d
name: hr-manager

services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_manager}
      POSTGRES_USER: ${POSTGRES_USER:-hr_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD for production}
    ports: !reset []

  backend:
    # Release-tagged image: the deploy pipeline builds/tags every release and
    # switches traffic by changing RELEASE_TAG; the previous tag stays
    # available for rollback (see infra/scripts/deploy.sh).
    image: hr-manager-backend:${RELEASE_TAG:-local}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY (>=32 chars) for production}
      SESSION_COOKIE_SECURE: "true"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set a strong BOOTSTRAP_ADMIN_PASSWORD for production (>=12 chars)}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-Администратор системы}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hr_manager}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-hr_manager}
      # Reported by /ops/status; the deploy pipeline injects the full SHA of
      # the release commit so operators can map a running container to code.
      RELEASE_SHA: ${RELEASE_SHA:-}
      # External channels (phase 9): disabled unless explicitly enabled.
      # Secrets only from the environment; the backend validates enabled
      # channels at startup and refuses to start incomplete.
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_TIMEOUT_S: ${TELEGRAM_TIMEOUT_S:-10}
      TELEGRAM_LINK_TTL_MINUTES: ${TELEGRAM_LINK_TTL_MINUTES:-15}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HR Manager}
      SMTP_TIMEOUT_S: ${SMTP_TIMEOUT_S:-15}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      INTEGRATION_RATE_LIMIT: ${INTEGRATION_RATE_LIMIT:-10}
      INTEGRATION_RATE_WINDOW_S: ${INTEGRATION_RATE_WINDOW_S:-300}
    ports: !reset []
    # Production never auto-migrates at container start: migrations run as a
    # separate one-shot job (infra/scripts/migrate.sh) BEFORE the traffic is
    # switched, guarded by the advisory lock in alembic/env.py.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    image: hr-manager-frontend:${RELEASE_TAG:-local}
    ports: !reset []

  # Local SMTP sink: dev/test only. Unreachable in production (no published
  # ports); the backend dials SMTP_HOST from the environment instead.
  # Operators may additionally pass `--scale mailpit=0` to `up`.
  mailpit:
    ports: !reset []

  # Notification delivery worker: the same release-tagged backend image,
  # running `python -m app.cli worker`. Production tuning via environment;
  # no ports are published (the worker is internal).
  worker:
    image: hr-manager-backend:${RELEASE_TAG:-local}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY (>=32 chars) for production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hr_manager}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-hr_manager}
      NOTIFICATION_DEFAULT_TIMEZONE: ${NOTIFICATION_DEFAULT_TIMEZONE:-Europe/Moscow}
      NOTIFICATION_QUIET_HOURS_START: ${NOTIFICATION_QUIET_HOURS_START:-21:00}
      NOTIFICATION_QUIET_HOURS_END: ${NOTIFICATION_QUIET_HOURS_END:-08:00}
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-2}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      # Same external-channel vision as the backend (phase 9).
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_TIMEOUT_S: ${TELEGRAM_TIMEOUT_S:-10}
      TELEGRAM_LINK_TTL_MINUTES: ${TELEGRAM_LINK_TTL_MINUTES:-15}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HR Manager}
      SMTP_TIMEOUT_S: ${SMTP_TIMEOUT_S:-15}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      INTEGRATION_RATE_LIMIT: ${INTEGRATION_RATE_LIMIT:-10}
      INTEGRATION_RATE_WINDOW_S: ${INTEGRATION_RATE_WINDOW_S:-300}
      TZ: UTC
    ports: !reset []

  backup:
    image: hr-manager-backup:${RELEASE_TAG:-local}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hr_manager}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-hr_manager}
      BACKUP_DRILL_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER:-hr_manager}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/postgres
      BACKUP_DIR: /var/backups/hr-manager
      BACKUP_STATE_FILE: /var/backups/hr-manager/state.json
      # Encryption secrets come from the environment only. When unset the
      # container fails its runs loudly (no unencrypted backup is possible);
      # infra/scripts/check_env.sh warns and, with BACKUP_ENABLED=true,
      # rejects the configuration outright.
      BACKUP_KEY_ID: ${BACKUP_KEY_ID:-}
      BACKUP_ENC_KEY: ${BACKUP_ENC_KEY:-}
      BACKUP_LEGACY_KEYS: ${BACKUP_LEGACY_KEYS:-}
      BACKUP_SCHEDULE_UTC: ${BACKUP_SCHEDULE_UTC:-02:00}
      BACKUP_DRILL_INTERVAL_HOURS: ${BACKUP_DRILL_INTERVAL_HOURS:-168}
      BACKUP_ON_START: ${BACKUP_ON_START:-0}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-512}
      BACKUP_REASON: ${BACKUP_REASON:-scheduled backup}
      TZ: UTC
    ports: !reset []

volumes:
  pgdata:
  backups:
