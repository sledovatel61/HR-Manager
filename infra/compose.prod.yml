# Production overlay for infra/docker-compose.yml.
#
# REQUIRES Docker Compose v2.24+ (the !reset YAML tag).
#
# Secrets come ONLY from environment variables; the ${VAR:?} syntax makes
# `docker compose` fail fast when a required variable is missing. All
# externally published ports are REMOVED with `ports: !reset []` — in
# production the stack sits behind a reverse proxy with HTTPS (roadmap
# phase 7), nothing is exposed directly.
#
# Usage from the repository root:
#   export APP_ENV=production
#   export SECRET_KEY=$(openssl rand -hex 32)
#   export POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   infra/scripts/check_env.sh
#   docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml config
#   docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml up -d
name: hr-manager

services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_manager}
      POSTGRES_USER: ${POSTGRES_USER:-hr_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD for production}
    ports: !reset []

  backend:
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY (>=32 chars) for production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hr_manager}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-hr_manager}
    ports: !reset []

  frontend:
    ports: !reset []

volumes:
  pgdata:
