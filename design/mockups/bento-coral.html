/* =========================================================================
   ОБЩАЯ СТРУКТУРА (одинаковая для всех направлений): сетки, компоненты,
   состояния. Всё оформление — через semantic-токены, значения которым
   задаёт выбранное направление дизайна. Имена токенов зеркалят
   frontend/src/design-system/tokens.css.
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100%;
  font-family: var(--font-sans);
  font-size: var(--text-size-md);
  line-height: var(--line-height-normal);
  color: var(--text-primary);
  background: var(--surface-canvas);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4, p, dl, dd, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; }
table { border-collapse: collapse; width: 100%; }
kbd {
  font-family: var(--font-sans); font-size: var(--text-size-2xs);
  padding: 2px 5px; border-radius: var(--radius-xs);
  border: 1px solid var(--border-default); background: var(--surface-sunken);
  color: var(--text-tertiary); line-height: 1.4;
}
.ico { width: var(--icon-size-md); height: var(--icon-size-md); flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 14px; height: 14px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.muted { color: var(--text-tertiary); }
.grow { flex: 1 1 auto; min-width: 0; }
.two-line { display: flex; flex-direction: column; min-width: 0; }
.two-line > b { font-weight: var(--font-weight-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.two-line > i { font-style: normal; font-size: var(--text-size-xs); color: var(--text-tertiary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
body.lock { overflow: hidden; }
::selection { background: var(--accent-subtle); color: var(--text-primary); }

/* ---------------- Каркас ---------------- */
.app { display: flex; min-height: 100vh; position: relative; z-index: 1; }
.sidebar {
  width: var(--sidebar-width); flex: none; height: 100vh; position: sticky; top: 0;
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-4) var(--space-3) var(--space-3);
  background: var(--surface-sidebar); color: var(--text-sidebar);
  border-right: 1px solid var(--border-sidebar);
  transition: width var(--duration-base) var(--easing-standard);
  z-index: var(--z-dropdown);
}
.shell { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-height); position: sticky; top: 0; z-index: var(--z-sticky);
  display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-5); background: var(--topbar-bg);
  border-bottom: 1px solid var(--border-subtle);
}
.view { flex: 1 1 auto; width: 100%; max-width: var(--content-max-width);
  margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-10); }
.only-collapsed { display: none; }
.is-collapsed .sidebar { width: var(--sidebar-width-collapsed); padding-left: var(--space-2); padding-right: var(--space-2); }
.is-collapsed .nav-label, .is-collapsed .nav-title, .is-collapsed .nav-badge,
.is-collapsed .brand-text, .is-collapsed .brand-collapse, .is-collapsed .side-card,
.is-collapsed .user-text, .is-collapsed .user .icon-btn { display: none; }
.is-collapsed .only-collapsed { display: inline-flex; }
.is-collapsed .sidebar { align-items: center; }
.is-collapsed .user { justify-content: center; }
.is-collapsed .nav-item { justify-content: center; padding: 0; }

/* ---------------- Бренд и навигация ---------------- */
.brand { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-1) var(--space-2); min-height: 44px; }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; flex: none;
  border-radius: var(--radius-md); background: var(--brand-mark-bg); color: var(--brand-mark-fg);

.brand-text { display: flex; flex-direction: column; min-width: 0; }

.brand-collapse { margin-left: auto; }
.nav { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-2) 0; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-title { padding: 0 var(--space-3) var(--space-1); font-size: var(--text-size-2xs);

.nav-item {
  position: relative; display: flex; align-items: center; gap: var(--space-3);
  min-height: var(--control-height-md); padding: 0 var(--space-3); border-radius: var(--nav-radius);
  color: var(--text-sidebar); font-size: var(--text-size-sm); font-weight: var(--font-weight-medium);
  transition: background var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard), transform var(--duration-fast) var(--easing-standard);
}
.nav-item .ico { color: var(--nav-icon); transition: color var(--duration-fast) var(--easing-standard); }
.nav-item:hover { background: var(--surface-sidebar-hover); }
.nav-item:active { transform: scale(.985); }
.nav-item.is-active { background: var(--nav-active-bg); color: var(--nav-active-fg); box-shadow: var(--nav-active-shadow); }
.nav-item.is-active .ico { color: var(--nav-active-fg); }
.nav-item.is-active::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 0 var(--radius-xs) var(--radius-xs) 0; background: var(--nav-marker); }

.nav-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-badge { font-size: var(--text-size-2xs); font-weight: var(--font-weight-semibold);
  padding: 1px 6px; border-radius: var(--radius-full); background: var(--nav-badge-bg); color: var(--nav-badge-fg); }
.side-foot { display: flex; flex-direction: column; gap: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-sidebar); }
.side-card { padding: var(--space-3); border-radius: var(--radius-lg); background: var(--surface-sidebar-hover); border: 1px solid var(--border-sidebar); }
.side-card-title { font-size: var(--text-size-xs); font-weight: var(--font-weight-semibold); }
.side-card-text { font-size: var(--text-size-2xs); color: var(--text-sidebar-muted); margin-top: 2px; line-height: 1.4; }
.side-progress { height: 4px; border-radius: var(--radius-full); background: var(--surface-sidebar-active); margin-top: var(--space-2); overflow: hidden; }
.side-progress i { display: block; height: 100%; border-radius: var(--radius-full); background: var(--accent-default); }
.user { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2); border-radius: var(--radius-lg); }
.user:hover { background: var(--surface-sidebar-hover); }
.user-text { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.user-text b { font-size: var(--text-size-sm); font-weight: var(--font-weight-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-text i { font-style: normal; font-size: var(--text-size-2xs); color: var(--text-sidebar-muted); }
.avatar {
  display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: var(--avatar-radius);
  font-size: var(--text-size-xs); font-weight: var(--font-weight-semibold); letter-spacing: .01em;
  color: var(--avatar-fg); background: var(--avatar-1);
}
.avatar.sm { width: 24px; height: 24px; font-size: 10px; }
.avatar.lg { width: 52px; height: 52px; font-size: var(--text-size-lg); }
.av-2 { background: var(--avatar-2); } .av-3 { background: var(--avatar-3); }
.av-4 { background: var(--avatar-4); } .av-5 { background: var(--avatar-5); }
.av-6 { background: var(--avatar-6); }

/* ---------------- Верхняя панель ---------------- */
.crumbs { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-size-sm); min-width: 0; }
.crumb-sep { color: var(--text-disabled); }

.search-trigger {
  display: flex; align-items: center; gap: var(--space-2); height: var(--control-height-md);
  min-width: 260px; padding: 0 var(--space-3); border-radius: var(--search-radius);
  border: 1px solid var(--border-default); background: var(--surface-sunken);
  color: var(--text-tertiary); font-size: var(--text-size-sm);
  transition: border-color var(--duration-fast), box-shadow var(--duration-fast), background var(--duration-fast);
}
.search-trigger:hover { border-color: var(--border-strong); background: var(--surface-hover); }
.search-trigger span { flex: 1 1 auto; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.top-tools { display: flex; align-items: center; gap: var(--space-2); }
.icon-btn {
  display: inline-grid; place-items: center; width: var(--control-height-md); height: var(--control-height-md);
  flex: none; border-radius: var(--radius-md); color: var(--text-secondary);
  border: 1px solid transparent;
  transition: background var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard),
              border-color var(--duration-fast) var(--easing-standard), transform var(--duration-fast) var(--easing-standard);
}

.icon-btn:active { transform: scale(.94); }
#themeBtn .ico-moon { display: none; }
[data-theme="dark"] #themeBtn .ico-sun { display: none; }
[data-theme="dark"] #themeBtn .ico-moon { display: block; }

/* ---------------- Кнопки ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: var(--control-height-md); padding: 0 var(--space-4); border-radius: var(--btn-radius);
  font-size: var(--text-size-sm); font-weight: var(--font-weight-medium); white-space: nowrap;
  border: 1px solid var(--border-default); background: var(--surface-app); color: var(--text-primary);
  box-shadow: var(--btn-shadow);
  transition: background var(--duration-fast) var(--easing-standard), border-color var(--duration-fast),
              color var(--duration-fast), transform var(--duration-fast) var(--easing-standard), box-shadow var(--duration-fast);
}
.btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn-primary { background: var(--accent-default); border-color: var(--accent-default); color: var(--text-on-accent); box-shadow: var(--btn-primary-shadow); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-primary:active { background: var(--accent-pressed); border-color: var(--accent-pressed); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-secondary); box-shadow: none; }
.btn-ghost:hover { background: var(--surface-hover); color: var(--text-primary); border-color: transparent; }
.btn-subtle { background: var(--surface-sunken); border-color: var(--border-subtle); box-shadow: none; }
.btn-subtle:hover { background: var(--surface-hover); }
.btn.sm { height: var(--control-height-sm); padding: 0 var(--space-3); font-size: var(--text-size-xs); }
.btn.icon { width: var(--control-height-md); padding: 0; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-link); font-size: var(--text-size-sm); font-weight: var(--font-weight-medium); }
.link:hover { text-decoration: underline; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius-md);
  border: 1px solid var(--border-default); background: var(--surface-sunken); }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1 1 auto; }
.seg button { height: calc(var(--control-height-md) - 6px); padding: 0 var(--space-3); border-radius: var(--radius-sm);
  font-size: var(--text-size-sm); font-weight: var(--font-weight-medium); color: var(--text-secondary);
  transition: background var(--duration-fast) var(--easing-standard), color var(--duration-fast); }
.seg button:hover { color: var(--text-primary); }
.seg button.is-on { background: var(--seg-on-bg); color: var(--seg-on-fg); box-shadow: var(--seg-on-shadow); }

/* ---------------- Поля ---------------- */
.input, .select, textarea.input {
  width: 100%; height: var(--control-height-md); padding: 0 var(--space-3);
  border-radius: var(--radius-md); border: 1px solid var(--border-default);
  background: var(--surface-app); color: var(--text-primary); font-size: var(--text-size-sm);
  transition: border-color var(--duration-fast), box-shadow var(--duration-fast), background var(--duration-fast);
}
textarea.input { height: auto; padding: var(--space-2) var(--space-3); resize: vertical; line-height: 1.5; }
.input::placeholder { color: var(--text-disabled); }
.input:hover, .select:hover { border-color: var(--border-strong); }
.input:focus, .select:focus, textarea.input:focus { border-color: var(--border-focus); box-shadow: var(--focus-ring); outline: none; }
.select { appearance: none; padding-right: var(--space-7);
  background-image: var(--select-arrow); background-repeat: no-repeat; background-position: right 10px center; background-size: 14px; }
.toolbar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-4); }
.search-field { position: relative; display: flex; align-items: center; gap: var(--space-2);
  height: var(--control-height-md); padding: 0 var(--space-3); min-width: 280px; flex: 0 1 320px;
  border-radius: var(--radius-md); border: 1px solid var(--border-default); background: var(--surface-app); }
.search-field:focus-within { border-color: var(--border-focus); box-shadow: var(--focus-ring); }
.search-field .ico { color: var(--text-tertiary); }
.search-field input { flex: 1 1 auto; border: 0; background: none; outline: none; font-size: var(--text-size-sm); }
.toolbar .select { min-width: 150px; width: auto; }
.toolbar-note { font-size: var(--text-size-xs); color: var(--text-tertiary); }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .field legend { font-size: var(--text-size-xs); font-weight: var(--font-weight-medium); color: var(--text-secondary); }
.help { font-size: var(--text-size-2xs); color: var(--text-tertiary); }
.check { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-size-sm); color: var(--text-primary); padding: 3px 0; }
.check input { width: 16px; height: 16px; accent-color: var(--accent-default); }
.switch-row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle); }
.switch-row:last-child { border-bottom: 0; }
.switch-text { display: flex; flex-direction: column; flex: 1 1 auto; }
.switch-text b { font-size: var(--text-size-sm); font-weight: var(--font-weight-medium); }
.switch-text i { font-style: normal; font-size: var(--text-size-xs); color: var(--text-tertiary); }
.switch { position: relative; width: 40px; height: 22px; flex: none; border-radius: var(--radius-full);
  background: var(--surface-disabled); border: 1px solid var(--border-default); transition: background var(--duration-base) var(--easing-standard); }
.switch i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: var(--radius-full);
  background: var(--surface-app); box-shadow: var(--shadow-1); transition: transform var(--duration-base) var(--easing-standard); }
.switch-input:checked + .switch { background: var(--accent-default); border-color: var(--accent-default); }
.switch-input:checked + .switch i { transform: translateX(18px); }
.switch-input:focus-visible + .switch { box-shadow: var(--focus-ring); }

/* ---------------- Заголовок страницы ---------------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-5);
  flex-wrap: wrap; margin-bottom: var(--space-5); }
.eyebrow { font-size: var(--text-size-2xs); font-weight: var(--font-weight-semibold);
  text-transform: uppercase; letter-spacing: .08em; color: var(--text-tertiary); margin-bottom: var(--space-1); }
.page-title { font-size: var(--text-size-3xl); font-weight: var(--font-weight-bold); letter-spacing: var(--page-title-tracking); line-height: 1.1; }
.page-sub { font-size: var(--text-size-sm); color: var(--text-secondary); margin-top: var(--space-2); }
.page-actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.page-narrow .page-head { max-width: 100%; }
.hint { font-size: var(--text-size-xs); color: var(--text-tertiary); margin-top: var(--space-3); }


/* ---------------- Карточки ---------------- */
.card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius);
  padding: var(--card-padding); box-shadow: var(--card-shadow); position: relative; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
.card-title { font-size: var(--text-size-md); font-weight: var(--font-weight-semibold); letter-spacing: var(--card-title-tracking); }
.card-sub { font-size: var(--text-size-xs); color: var(--text-tertiary); margin-top: 2px; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); }
.counter { font-size: var(--text-size-xs); color: var(--text-tertiary); font-weight: var(--font-weight-semibold); }
.legend { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-size-2xs); color: var(--text-secondary); }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.lg::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--chart-1); }
.lg-2::before, .lg-indigo::before { background: var(--chart-2); }
.lg-info::before { background: var(--status-info-fg); }
.lg-warning::before { background: var(--status-warning-fg); }
.lg-success::before { background: var(--status-success-fg); }

/* ---------------- Дашборд-сетка ---------------- */
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--dash-gap); }
.dash-kpi { grid-column: 1 / -1; display: grid; grid-template-columns: var(--kpi-cols); gap: var(--dash-gap); }
.dash-main { grid-column: span 8; } .dash-side { grid-column: span 4; }
.dash-feed { grid-column: span 8; } .dash-rail { grid-column: span 4; }
.dash-wide { grid-column: 1 / -1; }

/* ---------------- KPI ---------------- */
.kpi { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.kpi-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.kpi-label { font-size: var(--text-size-2xs); font-weight: var(--font-weight-semibold); color: var(--text-tertiary);
  text-transform: var(--kpi-label-transform); letter-spacing: var(--kpi-label-tracking); line-height: 1.3; }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: var(--text-size-2xs); font-weight: var(--font-weight-semibold);
  padding: 2px 6px; border-radius: var(--radius-full); font-variant-numeric: tabular-nums; }
.delta .ico { width: 12px; height: 12px; stroke-width: 2.2; }
.delta.up { color: var(--status-success-fg); background: var(--status-success-bg); }
.delta.down { color: var(--status-danger-fg); background: var(--status-danger-bg); }
.kpi-value { font-size: var(--kpi-value-size); font-weight: var(--font-weight-semibold);
  letter-spacing: -0.02em; line-height: 1.1; color: var(--text-primary); }
.kpi-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: auto; }
.kpi-hint { font-size: var(--text-size-2xs); color: var(--text-tertiary); text-align: right; }
.spark { color: var(--spark-color); flex: 0 1 132px; min-width: 56px; max-width: 100%; height: 34px; overflow: visible; }

/* ---------------- Графики ---------------- */
.chart-wrap { position: relative; width: 100%; }
.chart { width: 100%; height: var(--chart-height); overflow: visible; }
.grid-line { stroke: var(--chart-grid); stroke-width: 1; }
.axis-x, .axis-y { fill: var(--text-tertiary); font-size: 10px; font-variant-numeric: tabular-nums; }
.line { stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.line-1 { stroke: var(--chart-1); } .line-2 { stroke: var(--chart-2); stroke-dasharray: 4 4; stroke-width: 1.8; opacity: .9; }
.dot-1 { fill: var(--chart-1); stroke: var(--surface-app); stroke-width: 2.5; }
.bars { display: flex; align-items: flex-end; gap: var(--space-2); height: 170px; }
.bar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; min-width: 0; }
.bar-track { flex: 1 1 auto; width: 100%; display: flex; align-items: flex-end; border-radius: var(--radius-sm); background: var(--surface-sunken); overflow: hidden; }
.bar-fill { display: block; width: 100%; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  background: var(--chart-1); transform-origin: bottom; animation: barGrow var(--duration-slow) var(--easing-decelerate) both; animation-delay: var(--d, 0ms); }
.bar-val { font-size: var(--text-size-2xs); font-weight: var(--font-weight-semibold); color: var(--text-secondary); }
.bar-name { font-size: 10px; color: var(--text-tertiary); text-align: center; line-height: 1.2; }
.funnel { display: flex; flex-direction: column; gap: var(--space-4); }
.fn-row { animation: rise var(--duration-slow) var(--easing-decelerate) both; animation-delay: var(--d, 0ms); }
.fn-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin-bottom: 6px; }
.fn-name { font-size: var(--text-size-sm); font-weight: var(--font-weight-medium); }
.fn-nums { font-size: var(--text-size-xs); color: var(--text-tertiary); }
.fn-nums b { font-size: var(--text-size-md); color: var(--text-primary); font-weight: var(--font-weight-semibold); margin-right: 6px; }
.fn-nums i { font-style: normal; }
.fn-track { height: 10px; border-radius: var(--radius-full); background: var(--surface-sunken); overflow: hidden; }
.fn-fill { display: block; height: 100%; border-radius: var(--radius-full); background: var(--chart-1);
  animation: barGrowH var(--duration-slow) var(--easing-decelerate) both; animation-delay: var(--d, 0ms); }
.fn-sub { font-size: var(--text-size-2xs); color: var(--text-tertiary); margin-top: 5px; }

/* ---------------- Таблицы ---------------- */
.table-card { padding: 0; overflow: hidden; }
.bento-table-scroll { overflow-x: auto; }
.tbl th, .tbl td { text-align: left; padding: var(--table-cell-padding-y) var(--space-4); font-size: var(--text-size-sm); }
.tbl th { font-size: var(--text-size-2xs); font-weight: var(--font-weight-semibold); color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: .06em; background: var(--table-head-bg);
  border-bottom: 1px solid var(--border-default); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.tbl td { border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .r, .tbl td.num { text-align: right; }
.row { cursor: pointer; transition: background var(--duration-fast) var(--easing-standard); }
.row:hover { background: var(--surface-hover); }
.row:focus-visible { box-shadow: inset 0 0 0 2px var(--focus-ring-color); }
.cell-name { display: flex; }
.cell-name .two-line { min-width: 0; }
.cell-name > .avatar { margin-right: var(--space-3); }
.cell-name b { color: var(--text-primary); }
.cell-vac { color: var(--text-primary); }
.cell-date, .cell-hr { white-space: nowrap; }
.tbl-compact th, .tbl-compact td { padding-top: calc(var(--table-cell-padding-y) - 3px); padding-bottom: calc(var(--table-cell-padding-y) - 3px); }
.cell-actions { width: 88px; text-align: right; white-space: nowrap; }
.cell-actions .icon-btn { opacity: 0; transition: opacity var(--duration-fast); }
.row:hover .cell-actions .icon-btn, .row:focus-within .cell-actions .icon-btn { opacity: 1; }
.score { display: block; width: 62px; height: 6px; border-radius: var(--radius-full); background: var(--surface-disabled); overflow: hidden; }
.score > i { display: block; height: 100%; border-radius: var(--radius-full); background: var(--score-fill); }
.score.mini { width: 40px; height: 4px; }
.cell-score { width: 120px; }
.cell-score .score { display: inline-block; vertical-align: middle; }
.score-val { font-size: var(--text-size-xs); color: var(--text-secondary); margin-left: var(--space-2); vertical-align: middle; }
.pager { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-size-xs); color: var(--text-tertiary); }
.file-ico { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: var(--radius-md);
  background: var(--surface-sunken); color: var(--text-secondary); }
.file-ico .ico { width: 16px; height: 16px; }

/* ---------------- Чипы и статусы ---------------- */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px;
  border-radius: var(--chip-radius); font-size: var(--text-size-2xs); font-weight: var(--font-weight-semibold);
  white-space: nowrap; border: 1px solid transparent; }
.chip-neutral { color: var(--status-neutral-fg); background: var(--status-neutral-bg); border-color: var(--status-neutral-border); }
.chip-info { color: var(--status-info-fg); background: var(--status-info-bg); border-color: var(--status-info-border); }
.chip-success { color: var(--status-success-fg); background: var(--status-success-bg); border-color: var(--status-success-border); }
.chip-warning { color: var(--status-warning-fg); background: var(--status-warning-bg); border-color: var(--status-warning-border); }
.chip-danger { color: var(--status-danger-fg); background: var(--status-danger-bg); border-color: var(--status-danger-border); }
.chip-indigo { color: var(--status-indigo-fg); background: var(--status-indigo-bg); border-color: var(--status-indigo-border); }
.chip-violet { color: var(--status-violet-fg); background: var(--status-violet-bg); border-color: var(--status-violet-border); }
.chip-teal { color: var(--status-teal-fg); background: var(--status-teal-bg); border-color: var(--status-teal-border); }
.dot-live { width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; flex: none; }
.prio { font-size: var(--text-size-2xs); font-weight: var(--font-weight-semibold); padding: 2px 7px; border-radius: var(--radius-full); }
.prio-high { color: var(--status-danger-fg); background: var(--status-danger-bg); }
.prio-med { color: var(--status-warning-fg); background: var(--status-warning-bg); }
.prio-low { color: var(--text-tertiary); background: var(--status-neutral-bg); }

/* ---------------- Лента задач ---------------- */
.feed { display: flex; flex-direction: column; }
.feed-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0;
  border-bottom: 1px solid var(--border-subtle); animation: rise var(--duration-slow) var(--easing-decelerate) both; }
.feed-item:last-child { border-bottom: 0; }
.feed-item.is-done { opacity: .5; }
.feed-item.is-done .feed-title { text-decoration: line-through; }
.feed-check { display: grid; place-items: center; width: 20px; height: 20px; flex: none;
  border-radius: var(--radius-full); border: 1.5px solid var(--border-strong); color: transparent;
  transition: all var(--duration-base) var(--easing-standard); }
.feed-check .ico { width: 12px; height: 12px; stroke-width: 2.6; }
.feed-check:hover { border-color: var(--accent-default); background: var(--accent-subtle); color: var(--accent-default); }
.feed-item.is-done .feed-check { background: var(--status-success-fg); border-color: var(--status-success-fg); color: var(--text-on-accent); }
.feed-body { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.feed-title { font-size: var(--text-size-sm); color: var(--text-primary); font-weight: var(--font-weight-medium);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-meta { font-size: var(--text-size-2xs); color: var(--text-tertiary); }
.feed-meta .who { color: var(--text-secondary); }
.feed-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.feed-time { font-size: var(--text-size-2xs); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.mini-list { display: flex; flex-direction: column; gap: var(--space-3); }
.mini-ev { display: flex; align-items: stretch; gap: var(--space-3); }
.mini-time { font-size: var(--text-size-xs); color: var(--text-tertiary); width: 40px; flex: none; padding-top: 1px; }
.mini-bar { width: 3px; border-radius: var(--radius-full); flex: none; background: var(--border-strong); }
.mini-bar.type-info { background: var(--status-info-fg); }
.mini-bar.type-indigo { background: var(--status-indigo-fg); }
.mini-bar.type-warning { background: var(--status-warning-fg); }
.mini-bar.type-success { background: var(--status-success-fg); }
.mini-text { display: flex; flex-direction: column; min-width: 0; }
.mini-text b { font-size: var(--text-size-sm); font-weight: var(--font-weight-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-text i { font-style: normal; font-size: var(--text-size-2xs); color: var(--text-tertiary); }

/* ---------------- Воронка (kanban) ---------------- */
.kanban-scroll { overflow-x: auto; padding-bottom: var(--space-3); }
.kanban { display: flex; gap: var(--space-4); align-items: flex-start; min-width: min-content; }
.kcol { width: 296px; flex: none; display: flex; flex-direction: column; }
.kcol-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 2px; }
.kcol-head h3 { font-size: var(--text-size-sm); font-weight: var(--font-weight-semibold); flex: 1 1 auto; }
.kcol-tone { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--border-strong); flex: none; }
.kcol-count { font-size: var(--text-size-xs); color: var(--text-tertiary); background: var(--surface-sunken);
  padding: 1px 7px; border-radius: var(--radius-full); border: 1px solid var(--border-subtle); }
.kcol-meta { font-size: var(--text-size-2xs); color: var(--text-tertiary); margin-bottom: var(--space-3); }
.kcol-body { display: flex; flex-direction: column; gap: var(--space-3); min-height: 120px; padding: var(--space-2);
  border-radius: var(--radius-lg); border: 1px dashed transparent; transition: background var(--duration-base), border-color var(--duration-base); }
.kcol-body.is-over { background: var(--accent-subtle); border-color: var(--accent-subtle-border); }
.kcard { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius);
  padding: var(--space-3); box-shadow: var(--card-shadow); cursor: grab;
  transition: transform var(--duration-base) var(--easing-standard), box-shadow var(--duration-base), border-color var(--duration-fast); }
.kcard:hover { transform: var(--card-hover-transform); box-shadow: var(--card-hover-shadow); border-color: var(--border-strong); }
.kcard:active { cursor: grabbing; }
.kcard.is-dragging { opacity: .45; transform: scale(.98) rotate(1deg); box-shadow: var(--shadow-3); }
.kcard-top { display: flex; align-items: center; gap: var(--space-2); }
.kcard-name { font-size: var(--text-size-sm); font-weight: var(--font-weight-medium); flex: 1 1 auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kcard-grip { color: var(--text-disabled); opacity: 0; transition: opacity var(--duration-fast); }
.kcard:hover .kcard-grip { opacity: 1; }
.kcard-vac { font-size: var(--text-size-xs); color: var(--text-secondary); margin: var(--space-2) 0; }
.kcard-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.kcard-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  margin-top: var(--space-3); padding-top: var(--space-2); border-top: 1px solid var(--border-subtle);
  font-size: var(--text-size-2xs); color: var(--text-tertiary); }
.kcol-empty { display: grid; place-items: center; padding: var(--space-6) var(--space-3); font-size: var(--text-size-xs);
  color: var(--text-disabled); border: 1px dashed var(--border-default); border-radius: var(--radius-lg); }

/* ---------------- Календарь ---------------- */
.cal-card { padding: 0; overflow: hidden; }
.cal-toolbar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
.cal-range { font-size: var(--text-size-sm); font-weight: var(--font-weight-semibold); margin-left: var(--space-2); }
.cal { --hour-h: 56px; }
.cal-head { display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--border-default); }
.cal-gutter { border-right: 1px solid var(--border-subtle); }
.cal-day { padding: var(--space-2) var(--space-3); text-align: center; border-left: 1px solid var(--border-subtle); }
.cal-day.is-today { background: var(--accent-subtle); }
.cal-dow { display: block; font-size: var(--text-size-2xs); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .06em; }
.cal-date { display: block; font-size: var(--text-size-sm); font-weight: var(--font-weight-semibold); }
.cal-day.is-today .cal-date { color: var(--accent-default); }
.cal-body { display: grid; grid-template-columns: 56px minmax(0, 1fr); }
.cal-hours { border-right: 1px solid var(--border-subtle); }
.cal-hour { height: var(--hour-h); position: relative; }
.cal-hour span { position: absolute; top: -7px; right: 8px; font-size: 10px; color: var(--text-disabled); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-col { position: relative; border-left: 1px solid var(--border-subtle); min-height: calc(var(--hour-h) * 11);
  background-image: var(--cal-lines); }
.cal-event { position: absolute; left: 4px; right: 4px; padding: 6px 8px; border-radius: var(--radius-md);
  font-size: var(--text-size-2xs); line-height: 1.25; overflow: hidden; cursor: pointer;
  border-left: 3px solid var(--border-strong); background: var(--surface-sunken); color: var(--text-secondary);
  transition: transform var(--duration-fast) var(--easing-standard), box-shadow var(--duration-fast); }
.cal-event b { display: block; font-weight: var(--font-weight-semibold); color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-event i { font-style: normal; color: var(--text-tertiary); }
.cal-event:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); z-index: 2; }
.cal-event.type-info { border-left-color: var(--status-info-fg); background: var(--status-info-bg); }
.cal-event.type-indigo { border-left-color: var(--status-indigo-fg); background: var(--status-indigo-bg); }
.cal-event.type-warning { border-left-color: var(--status-warning-fg); background: var(--status-warning-bg); }
.cal-event.type-success { border-left-color: var(--status-success-fg); background: var(--status-success-bg); }
.cal-event.type-neutral { border-left-color: var(--border-strong); }

/* ---------------- Библиотека шаблонов ---------------- */
.cat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-5); }
.cat { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); text-align: left;
  border-radius: var(--radius-lg); border: 1px solid var(--card-border); background: var(--card-bg); box-shadow: var(--card-shadow);
  transition: transform var(--duration-base) var(--easing-standard), box-shadow var(--duration-base), border-color var(--duration-fast); }
.cat:hover { transform: var(--card-hover-transform); box-shadow: var(--card-hover-shadow); }
.cat.is-on { border-color: var(--accent-default); background: var(--accent-subtle); }
.cat-ico { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: var(--radius-md);
  background: var(--accent-subtle); color: var(--accent-default); }
.cat b { display: block; font-size: var(--text-size-sm); font-weight: var(--font-weight-semibold); }
.cat i { font-style: normal; font-size: var(--text-size-2xs); color: var(--text-tertiary); }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); }
.tpl { display: flex; flex-direction: column; gap: var(--space-2); cursor: pointer;
  animation: rise var(--duration-slow) var(--easing-decelerate) both; animation-delay: var(--d, 0ms); }
.tpl-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-1); }
.file-ico.tone-indigo { background: var(--status-indigo-bg); color: var(--status-indigo-fg); }
.file-ico.tone-info { background: var(--status-info-bg); color: var(--status-info-fg); }
.file-ico.tone-success { background: var(--status-success-bg); color: var(--status-success-fg); }
.file-ico.tone-warning { background: var(--status-warning-bg); color: var(--status-warning-fg); }
.file-ico.tone-violet { background: var(--status-violet-bg); color: var(--status-violet-fg); }
.file-ico.tone-teal { background: var(--status-teal-bg); color: var(--status-teal-fg); }
.tpl-name { font-size: var(--text-size-md); font-weight: var(--font-weight-semibold); letter-spacing: -0.01em; }
.tpl-desc { font-size: var(--text-size-xs); color: var(--text-tertiary); line-height: 1.45; }
.tpl-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  margin-top: auto; padding-top: var(--space-3); border-top: 1px solid var(--border-subtle);
  font-size: var(--text-size-2xs); color: var(--text-tertiary); }
.tpl-actions { display: flex; gap: 2px; }

/* ---------------- Мастер (wizard) ---------------- */
.wiz { padding: var(--space-6); }
.wsteps { display: flex; align-items: center; gap: var(--space-5); margin-bottom: var(--space-6); flex-wrap: wrap; }
.wstep { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-size-sm); color: var(--text-tertiary); }
.wstep-dot { display: grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-full);
  border: 1px solid var(--border-default); font-size: var(--text-size-xs); font-weight: var(--font-weight-semibold); }
.wstep.is-on { color: var(--text-primary); font-weight: var(--font-weight-semibold); }
.wstep.is-on .wstep-dot { background: var(--accent-default); border-color: var(--accent-default); color: var(--text-on-accent); }
.wstep.is-done .wstep-dot { background: var(--status-success-bg); border-color: var(--status-success-border); color: var(--status-success-fg); }
.wiz-body { min-height: 260px; }
.wiz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-3); }
.choice { cursor: pointer; }
.choice-body { display: flex; flex-direction: column; gap: 2px; padding: var(--space-4); border-radius: var(--radius-lg);
  border: 1px solid var(--card-border); background: var(--surface-sunken);
  transition: border-color var(--duration-fast), background var(--duration-fast), transform var(--duration-base) var(--easing-standard); }
.choice-body b { font-size: var(--text-size-sm); font-weight: var(--font-weight-semibold); }
.choice-body i { font-style: normal; font-size: var(--text-size-xs); color: var(--text-tertiary); }
.choice:hover .choice-body { border-color: var(--border-strong); transform: translateY(-2px); }
.choice:focus-within .choice-body { box-shadow: var(--focus-ring); }
.choice.is-on .choice-body { border-color: var(--accent-default); background: var(--accent-subtle); box-shadow: 0 0 0 1px var(--accent-default) inset; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.form .field:last-child, .form .field:nth-child(4) { grid-column: 1 / -1; }
.form fieldset { display: flex; flex-direction: column; gap: 2px; padding: var(--space-4); border-radius: var(--radius-lg);
  border: 1px solid var(--border-default); background: var(--surface-sunken); }
.form fieldset legend { margin-bottom: 6px; }
.review { display: flex; flex-direction: column; }
.review-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-size-sm); }
.review-row span { color: var(--text-tertiary); }
.review-row b { font-weight: var(--font-weight-semibold); }
.wiz-foot { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-6);
  padding-top: var(--space-4); border-top: 1px solid var(--border-subtle); }

/* ---------------- Настройки ---------------- */
.set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--space-4); }
.theme-picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); margin-bottom: var(--space-4); }
.tpick { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-2); border-radius: var(--radius-lg);
  border: 1px solid var(--card-border); background: var(--surface-sunken); font-size: var(--text-size-xs); font-weight: var(--font-weight-medium);
  transition: border-color var(--duration-fast), transform var(--duration-base) var(--easing-standard); }
.tpick:hover { transform: translateY(-2px); }
.tpick.is-on { border-color: var(--accent-default); box-shadow: 0 0 0 1px var(--accent-default) inset; }
.tpick-prev { display: block; height: 62px; border-radius: var(--radius-md); border: 1px solid var(--border-default); }
.tpick-prev.light { background: linear-gradient(160deg, #ffffff 0 55%, #eef0f4 55% 100%); }
.tpick-prev.dark { background: linear-gradient(160deg, #23262f 0 55%, #14161c 55% 100%); }
.tpick b { text-align: left; padding-left: 2px; }
.set-card .form { grid-template-columns: 1fr; }
.integ { display: flex; flex-direction: column; }
.integ li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle); }
.integ li:last-child { border-bottom: 0; }
.integ-ico { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: var(--radius-md);
  background: var(--surface-sunken); color: var(--text-secondary); }
.integ-ico.tone-indigo { background: var(--status-indigo-bg); color: var(--status-indigo-fg); }
.integ-ico.tone-info { background: var(--status-info-bg); color: var(--status-info-fg); }
.integ-ico.tone-violet { background: var(--status-violet-bg); color: var(--status-violet-fg); }
.integ-ico.tone-teal { background: var(--status-teal-bg); color: var(--status-teal-fg); }
.integ .two-line { flex: 1 1 auto; }
.integ .two-line b { font-size: var(--text-size-sm); }

/* ---------------- Drawer ---------------- */
.drawer-root { position: fixed; inset: 0; z-index: var(--z-drawer); }
.drawer-scrim { position: absolute; inset: 0; background: var(--surface-overlay); opacity: 0;
  transition: opacity var(--duration-base) var(--easing-standard); }
.drawer-root.is-open .drawer-scrim { opacity: 1; }
.drawer { position: absolute; top: 0; right: 0; height: 100%; width: min(520px, 100%);
  background: var(--drawer-bg); border-left: 1px solid var(--border-default); box-shadow: var(--shadow-4);
  display: flex; flex-direction: column; overflow-y: auto;
  transform: translateX(102%); transition: transform var(--duration-slow) var(--easing-standard); }
.drawer-root.is-open .drawer { transform: none; }
.drawer-head { padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
.drawer-id { display: flex; align-items: flex-start; gap: var(--space-4); }
.drawer-name { flex: 1 1 auto; min-width: 0; }
.drawer-name h2 { font-size: var(--text-size-xl); font-weight: var(--font-weight-semibold); letter-spacing: -0.015em; line-height: 1.2; }
.drawer-sub { font-size: var(--text-size-sm); color: var(--text-secondary); margin-top: 2px; }
.drawer-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-3); }
.drawer-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3);
  padding: var(--space-4) var(--space-5); }
.drawer-facts > div { display: flex; flex-direction: column; gap: 2px; }
.drawer-facts dt { font-size: var(--text-size-2xs); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .06em; }
.drawer-facts dd { margin: 0; font-size: var(--text-size-sm); color: var(--text-primary); }
.drawer-actions { display: flex; gap: var(--space-2); padding: 0 var(--space-5) var(--space-4); flex-wrap: wrap; }
.drawer-tabs { display: flex; gap: var(--space-1); padding: 0 var(--space-4); border-bottom: 1px solid var(--border-subtle); overflow-x: auto; }
.tab { position: relative; padding: var(--space-3) var(--space-3); font-size: var(--text-size-sm);
  color: var(--text-tertiary); font-weight: var(--font-weight-medium); white-space: nowrap;
  transition: color var(--duration-fast); }
.tab:hover { color: var(--text-primary); }
.tab.is-on { color: var(--text-primary); font-weight: var(--font-weight-semibold); }
.tab.is-on::after { content: ""; position: absolute; left: var(--space-2); right: var(--space-2); bottom: -1px; height: 2px;
  border-radius: var(--radius-full); background: var(--accent-default); }
.drawer-body { padding: var(--space-5); flex: 1 1 auto; }
.chat { display: flex; flex-direction: column; gap: var(--space-3); }
.msg { display: flex; flex-direction: column; gap: 4px; max-width: 84%; }
.msg.in { align-self: flex-start; }
.msg.out { align-self: flex-end; align-items: flex-end; }
.bubble { padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); font-size: var(--text-size-sm); line-height: 1.5; }
.msg.in .bubble { background: var(--surface-sunken); color: var(--text-primary); border: 1px solid var(--border-subtle); }
.msg.out .bubble { background: var(--accent-default); color: var(--text-on-accent); }
.msg-time { font-size: var(--text-size-2xs); color: var(--text-disabled); }
.compose { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
.compose .input { flex: 1 1 auto; }
.check-list { display: flex; flex-direction: column; }
.check-list li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-size-sm); }
.check-list li:last-child { border-bottom: 0; }
.cl-mark { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: var(--radius-full); }
.cl-ok .cl-mark { background: var(--status-success-bg); color: var(--status-success-fg); }
.cl-wait .cl-mark { background: var(--status-warning-bg); color: var(--status-warning-fg); }
.cl-miss .cl-mark { background: var(--status-danger-bg); color: var(--status-danger-fg); }
.cl-state { margin-left: auto; font-size: var(--text-size-xs); color: var(--text-tertiary); }
.files { display: flex; flex-direction: column; }
.files li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle); }
.files li:last-child { border-bottom: 0; }
.files .two-line { flex: 1 1 auto; }
.files .two-line b { font-size: var(--text-size-sm); }
.timeline { display: flex; flex-direction: column; gap: 0; position: relative; padding-left: var(--space-5); }

/* ---------------- Command palette ---------------- */

/* ---------------- Тосты ---------------- */

  /* ---------------- Утилиты ---------------- */
  var uid = 0;
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function nf(n, dec) { var v = Number(n); return v.toLocaleString("ru-RU", { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
  function initials(full) {
    var p = full.split(" ");
    return (p[0] ? p[0][0] : "") + (p[1] ? p[1][0] : "");
  }
  function avTone(id) { return "av-" + ((id % 6) + 1); }
  function poly(vals, w, h, pad) {
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), span = (max - min) || 1;
    return vals.map(function (v, i) {
      var x = (i / (vals.length - 1)) * w;
      var y = h - pad - ((v - min) / span) * (h - pad * 2);
      return [+x.toFixed(2), +y.toFixed(2)];
    });
  }
  function toPath(pts) {
    return pts.map(function (p, i) { return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" ");
  }

    var pts = poly(vals, w, h, 3);

      '<stop offset="0%" stop-color="currentColor" stop-opacity=".28"/><stop offset="100%" stop-color="currentColor" stop-opacity="0"/>' +
      "</linearGradient></defs>" +
      '<path d="' + d + " L " + w + " " + h + " L 0 " + h + ' Z" fill="url(#' + id + ')"/>' +
      '<path class="spark-line" d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle class="spark-dot" cx="' + pts[pts.length - 1][0] + '" cy="' + pts[pts.length - 1][1] + '" r="2.6" fill="currentColor"/>' +
      "</svg>";
  }

  /* Большой график: две серии, сетка, подписи */
  function mkPath(pts, dx, dy) {
    return pts.map(function (p, i) { return (i ? "L" : "M") + (p[0] + dx) + " " + (p[1] + dy); }).join(" ");
  }
  function areaChart(series, labels, opts) {
    opts = opts || {};
    var W = 720, H = opts.h || 240, PL = 46, PR = 14, PT = 16, PB = 28;
    var iw = W - PL - PR, ih = H - PT - PB, base = PT + ih;
    var s1 = poly(series.a, iw, ih, 6), s2 = poly(series.b, iw, ih, 6);
    var g1 = "ag" + (++uid), g2 = "bg" + (++uid);
    var grid = "", i;
    for (i = 0; i <= 4; i++) {
      var y = PT + (ih / 4) * i;
      grid += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) + '" class="grid-line"/>' +
        '<text x="' + (PL - 10) + '" y="' + (y + 4).toFixed(1) + '" class="axis-y" text-anchor="end">' + Math.round(opts.max - (opts.max - opts.min) / 4 * i) + "</text>";
    }
    var xlab = "";
    var step = Math.ceil(labels.length / 7);
    for (i = 0; i < labels.length; i += step) {
      var x = PL + (iw / (labels.length - 1)) * i;
      xlab += '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" class="axis-x" text-anchor="middle">' + labels[i] + "</text>";
    }
    return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="' + (opts.label || "График") + '">' +
      "<defs>" +
      '<linearGradient id="' + g1 + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--chart-1)" stop-opacity=".34"/><stop offset="100%" stop-color="var(--chart-1)" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="' + g2 + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--chart-2)" stop-opacity=".2"/><stop offset="100%" stop-color="var(--chart-2)" stop-opacity="0"/></linearGradient>' +
      "</defs>" + grid + xlab +
      '<path class="area" d="' + mkPath(s2, PL, PT) + " L " + (PL + iw) + " " + base + " L " + PL + " " + base + ' Z" fill="url(#' + g2 + ')"/>' +
      '<path class="line line-2" d="' + mkPath(s2, PL, PT) + '" fill="none"/>' +
      '<path class="area" d="' + mkPath(s1, PL, PT) + " L " + (PL + iw) + " " + base + " L " + PL + " " + base + ' Z" fill="url(#' + g1 + ')"/>' +
      '<path class="line line-1" d="' + mkPath(s1, PL, PT) + '" fill="none"/>' +
      s1.map(function (p, idx) { return '<circle class="dot dot-1" cx="' + (p[0] + PL) + '" cy="' + (p[1] + PT) + '" r="' + (idx === s1.length - 1 ? 4.5 : 0) + '"/>'; }).join("") +
      "</svg></div>";
  }

  function barChart(items) {
    var max = Math.max.apply(null, items.map(function (i) { return i.value; }));

    }).join("") + "</div>";
  }

    } else if (tab === 2) {
      content = '<ul class="files">' +
        [["Анкета соискателя.docx", "284 КБ", "28.09.2026"], ["Резюме_обновлённое.pdf", "1,2 МБ", "28.09.2026"], ["Диплом_2021.pdf", "3,4 МБ", "27.09.2026"], ["Фото_3х4.jpg", "640 КБ", "27.09.2026"]]
          .map(function (f) {
            return '<li><span class="file-ico">' + ico("clip") + '</span><span class="two-line"><b>' + f[0] + "</b><i>" + f[1] + " · " + f[2] + "</i></span>" +
              '<button class="icon-btn" data-action="toast" data-msg="Скачивание: ' + f[0] + '">' + ico("download") + "</button></li>";
          }).join("") + "</ul>";
    } else if (tab === 3) {
      content = '<ul class="files">' +
        [["Трудовой договор — черновик.docx", "96 КБ", "сгенерирован 30.09"], ["Согласие на обработку ПДн.pdf", "48 КБ", "сгенерирован 29.09"], ["Заявление на приём.pdf", "52 КБ", "сгенерирован 29.09"]]
          .map(function (f) {
            return '<li><span class="file-ico tone-success">' + ico("file") + '</span><span class="two-line"><b>' + f[0] + "</b><i>" + f[1] + " · " + f[2] + "</i></span>" +
              '<button class="btn btn-subtle sm" data-action="toast" data-msg="Документ отправлен на подпись">Подпись</button></li>';
          }).join("") + "</ul>";
    } else {
      content = '<ol class="timeline">' +
        [["Отклик создан", "22.09.2026 · hh.ru", "neutral"], ["Звонок — квалификация", "24.09.2026 · Баев К. Р.", "info"], ["Собеседование назначено", "27.09.2026 · онлайн", "indigo"], ["Проверка документов", "30.09.2026 · в работе", "warning"]]
          .map(function (t) {
            return '<li class="tl-' + t[2] + '"><span class="tl-dot"></span><b>' + t[0] + "</b><i>" + t[1] + "</i></li>";
          }).join("") + "</ol>";
    }

    return '<header class="drawer-head">' +
      '<div class="drawer-id"><span class="avatar lg ' + avTone(c.id) + '">' + initials(c.name) + "</span>" +
      '<div class="drawer-name"><h2>' + esc(c.name) + "</h2>" +
      '<p class="drawer-sub">' + esc(c.vacancy) + " · " + esc(c.city) + "</p>" +
      '<div class="drawer-chips">' + chip(c.stage, STAGE_TONE[c.stage], true) + chip(c.flag, c.tone) + chip("Скоринг " + c.score, "neutral") + "</div></div>" +
      '<button class="icon-btn" data-action="close-drawer" aria-label="Закрыть">' + ico("x") + "</button></div>" +
      '<dl class="drawer-facts">' +
      '<div><dt>Телефон</dt><dd class="num">' + c.phone + "</dd></div>" +
      '<div><dt>Опыт</dt><dd>' + esc(c.exp) + "</dd></div>" +
      '<div><dt>Вилка</dt><dd class="num">' + esc(c.salary) + "</dd></div>" +
      '<div><dt>Ответственный</dt><dd>' + esc(c.hr) + "</dd></div>" +
      "</dl>" +
      '<div class="drawer-actions">' +
      '<button class="btn btn-primary" data-action="toast" data-msg="Звонок запланирован: ' + esc(c.name.split(" ")[0]) + '">' + ico("mail") + "Связаться</button>" +
      '<button class="btn btn-subtle" data-action="wiz-next-stage" data-id="' + c.id + '">' + ico("arrowRight") + "Следующий этап</button>" +
      '<button class="btn btn-subtle" data-action="toast" data-msg="Документы сформированы">' + ico("docs") + "Документы</button>" +
      "</div>" +
      '<nav class="drawer-tabs" role="tablist">' + heads + "</nav>" +
      '<div class="drawer-body">' + content + "</div>";
  }

  /* ---------------- Состояние и шелл ---------------- */
  var state = {
    screen: "queue", theme: "light", density: "comfortable", fonts: "app",
    collapsed: false, drawerId: null, drawerTab: 0, pIndex: 0, paletteOpen: false
  };
  var root = document.documentElement;
  var view = document.getElementById("view");
  var nav = document.getElementById("nav");
  var crumbs = document.getElementById("crumbs");
  var drawerRoot = document.getElementById("drawerRoot");
  var drawerEl = document.getElementById("drawer");
  var paletteRoot = document.getElementById("paletteRoot");
  var paletteInput = document.getElementById("paletteInput");
  var paletteList = document.getElementById("paletteList");
  var toasts = document.getElementById("toasts");
  var live = document.getElementById("live");

  function renderNav() {
    var groups = {}, order = [];
    SCREENS.forEach(function (s) {
      if (!groups[s.group]) { groups[s.group] = []; order.push(s.group); }
      groups[s.group].push(s);
    });
    nav.innerHTML = order.map(function (g) {
      return '<div class="nav-group"><span class="nav-title">' + g + "</span>" +
        groups[g].map(function (s) {
          var active = s.id === state.screen;
          var badge = s.id === "queue" ? '<span class="nav-badge num">10</span>' : (s.id === "candidates" ? '<span class="nav-badge num">16</span>' : "");
          return '<a class="nav-item' + (active ? " is-active" : "") + '" href="#/' + s.id + '" data-action="go" data-screen="' + s.id + '" title="' + s.label + '">' +
            ico(s.icon) + '<span class="nav-label">' + s.label + "</span>" + badge + "</a>";
        }).join("") + "</div>";
    }).join("");
  }

  function renderCrumbs() {
    var s = VIEWS[state.screen];
    crumbs.innerHTML = '<span class="crumb">HR-Manager</span><span class="crumb-sep">/</span>' +
      '<span class="crumb muted">' + (s.group || "Работа") + '</span><span class="crumb-sep">/</span>' +
      '<span class="crumb current">' + s.title + "</span>";
  }

  /* ---------------- Скелетоны ---------------- */
  function skeleton(kind) {
    if (kind === "queue" || kind === "analytics") {
      return '<section class="page"><div class="sk-head"><span class="sk-line w40"></span><span class="sk-line w60"></span></div>' +
        '<div class="dash"><div class="dash-kpi">' + [1, 2, 3, 4].map(function () {
          return '<div class="card sk-card"><span class="sk-line w50"></span><span class="sk-line w70 lg"></span><span class="sk-line w40"></span></div>';
        }).join("") + "</div>" +
        '<div class="card sk-card dash-main"><span class="sk-line w40"></span><div class="sk-chart"></div></div>' +
        '<div class="card sk-card dash-side"><span class="sk-line w50"></span>' + [1, 2, 3, 4, 5].map(function (i) { return '<span class="sk-line w' + (40 + i * 10) + '"></span>'; }).join("") + "</div>" +
        '<div class="card sk-card dash-feed"><span class="sk-line w30"></span>' + [1, 2, 3, 4, 5, 6].map(function () { return '<span class="sk-row"></span>'; }).join("") + "</div>" +
        '<div class="card sk-card dash-rail"><span class="sk-line w40"></span>' + [1, 2, 3].map(function () { return '<span class="sk-row"></span>'; }).join("") + "</div></div></section>";
    }
    if (kind === "kanban") {
      return '<section class="page"><div class="sk-head"><span class="sk-line w40"></span><span class="sk-line w60"></span></div>' +
        '<div class="kanban-scroll"><div class="kanban">' + STAGES.map(function () {
          return '<div class="card sk-card kcol-skeleton"><span class="sk-line w60"></span>' + [1, 2, 3].map(function () { return '<span class="sk-tile"></span>'; }).join("") + "</div>";
        }).join("") + "</div></div></section>";
    }
    return '<section class="page"><div class="sk-head"><span class="sk-line w40"></span><span class="sk-line w60"></span></div>' +
      '<div class="card sk-card"><span class="sk-line w30"></span>' + [1, 2, 3, 4, 5, 6, 7, 8].map(function (i) { return '<span class="sk-row" style="--d:' + i * 60 + 'ms"></span>'; }).join("") + "</div></section>";
  }

  /* ---------------- Счётчики KPI ---------------- */
  function animateCounters(scope) {
    var els = scope.querySelectorAll("[data-count]");
    Array.prototype.forEach.call(els, function (el) {
      var target = parseFloat(el.getAttribute("data-count"));
      var dec = parseInt(el.getAttribute("data-dec"), 10) || 0;
      var suffix = el.getAttribute("data-suffix") || "";
      var dur = 900, t0 = null;
      function step(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        var e = 1 - Math.pow(1 - p, 3);
        el.textContent = nf(target * e, dec) + suffix;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  /* ---------------- Тост ---------------- */
  function toast(msg, tone) {
    var el = document.createElement("div");
    el.className = "toast" + (tone ? " tone-" + tone : "");
    el.innerHTML = '<span class="toast-ico">' + ico(tone === "danger" ? "x" : "check") + "</span><span>" + esc(msg) + "</span>" +
      '<button class="icon-btn" data-action="toast-close" aria-label="Закрыть">' + ico("x") + "</button>";
    toasts.appendChild(el);
    live.textContent = msg;
    requestAnimationFrame(function () { el.classList.add("is-in"); });
    setTimeout(function () {
      el.classList.remove("is-in");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
    }, 3200);
  }

  /* ---------------- Роутинг и отрисовка ---------------- */
  var paintTimer = null;
  function paint(withSkeleton) {
    var s = VIEWS[state.screen];
    renderNav(); renderCrumbs();
    if (withSkeleton) {
      clearTimeout(paintTimer);
      view.innerHTML = skeleton(state.screen === "queue" || state.screen === "analytics" ? state.screen : (state.screen === "kanban" ? "kanban" : "table"));
      paintTimer = setTimeout(function () { paint(false); }, 430);
      return;
    }
    view.innerHTML = s.render();
    view.scrollTop = 0;
    animateCounters(view);
    if (state.screen === "kanban") bindDrag();
    document.title = "HR-Manager · " + s.title;
  }

  function go(id, withSkeleton) {
    if (!VIEWS[id]) id = "queue";
    state.screen = id;
    if (location.hash !== "#/" + id) { history.replaceState(null, "", "#/" + id); }
    paint(!!withSkeleton);
  }

  /* ---------------- Командная палитра ---------------- */
  function paletteItems() {
    var items = [];
    SCREENS.forEach(function (s) { items.push({ kind: "Экран", label: s.label, icon: s.icon, act: function () { go(s.id, true); } }); });
    items.push({ kind: "Действие", label: "Новый список документов", icon: "docs", act: function () { WIZARD_STEP = 1; go("wizard"); } });
    items.push({ kind: "Действие", label: "Добавить кандидата", icon: "plus", act: function () { toast("Форма создания кандидата открыта"); } });
    items.push({ kind: "Действие", label: "Переключить тему", icon: "star", act: function () { toggleTheme(); } });
    items.push({ kind: "Действие", label: "Импорт графика выхода из Excel", icon: "download", act: function () { toast("Мастер импорта графика выхода открыт"); } });
    CANDIDATES.forEach(function (c) {
      items.push({ kind: "Кандидат", label: c.name, sub: c.vacancy + " · " + c.stage, icon: "users", act: function () { go("candidates"); openDrawer(c.id, 0); } });
    });
    return items;
  }
  var PITEMS = paletteItems();
  var filtered = PITEMS.slice();

  function renderPalette() {
    if (!filtered.length) { paletteList.innerHTML = '<div class="palette-empty">Ничего не найдено</div>'; return; }
    paletteList.innerHTML = filtered.slice(0, 40).map(function (it, i) {
      return '<button class="pitem' + (i === state.pIndex ? " is-on" : "") + '" data-pi="' + i + '">' +
        '<span class="pitem-ico">' + ico(it.icon) + '</span><span class="two-line"><b>' + esc(it.label) + "</b><i>" + esc(it.sub || it.kind) + "</i></span>" +
        '<kbd>↵</kbd></button>';
    }).join("");
  }
  function openPalette() {
    state.paletteOpen = true; paletteRoot.hidden = false;
    filtered = PITEMS.slice(); state.pIndex = 0;
    renderPalette();
    setTimeout(function () { paletteInput.focus(); paletteInput.select(); }, 20);
    document.body.classList.add("lock");
  }
  function closePalette() {
    state.paletteOpen = false; paletteRoot.hidden = true; paletteInput.value = "";
    document.body.classList.remove("lock");
  }
  paletteInput.addEventListener("input", function () {
    var q = paletteInput.value.trim().toLowerCase();
    filtered = PITEMS.filter(function (it) {
      return it.label.toLowerCase().indexOf(q) >= 0 || (it.sub || "").toLowerCase().indexOf(q) >= 0 || it.kind.toLowerCase().indexOf(q) >= 0;
    });
    state.pIndex = 0; renderPalette();
  });

  /* ---------------- Drawer ---------------- */
  function openDrawer(id, tab) {
    var c = CANDIDATES.filter(function (x) { return x.id === +id; })[0];
    if (!c) return;
    state.drawerId = +id; state.drawerTab = tab || 0;
    drawerEl.innerHTML = drawerBody(c, state.drawerTab);
    drawerRoot.hidden = false;
    requestAnimationFrame(function () {
      drawerRoot.classList.add("is-open");
      document.body.classList.add("lock");
      var f = drawerEl.querySelector(".icon-btn");
      if (f) f.focus();
    });
  }
  function closeDrawer() {
    drawerRoot.classList.remove("is-open");
    document.body.classList.remove("lock");
    setTimeout(function () { drawerRoot.hidden = true; state.drawerId = null; }, 220);
  }

  /* ---------------- Тема / плотность / шрифты ---------------- */
  function applyState() {
    root.setAttribute("data-theme", state.theme);
    root.setAttribute("data-density", state.density);
    root.setAttribute("data-fonts", state.fonts);
    root.classList.toggle("is-collapsed", state.collapsed);
  }
  function toggleTheme() { state.theme = state.theme === "light" ? "dark" : "light"; applyState(); toast(state.theme === "dark" ? "Тёмная тема включена" : "Светлая тема включена"); }

  /* ---------------- Drag & drop воронки ---------------- */
  function bindDrag() {
    var cards = view.querySelectorAll(".kcard");
    Array.prototype.forEach.call(cards, function (card) {
      card.addEventListener("dragstart", function (e) {
        card.classList.add("is-dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", card.getAttribute("data-id")); } catch (err) { }
      });
      card.addEventListener("dragend", function () {
        card.classList.remove("is-dragging");
        Array.prototype.forEach.call(view.querySelectorAll(".kcol-body"), function (z) { z.classList.remove("is-over"); });
      });
    });
    var zones = view.querySelectorAll(".kcol-body");
    Array.prototype.forEach.call(zones, function (z) {
      z.addEventListener("dragover", function (e) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; z.classList.add("is-over"); });
      z.addEventListener("dragleave", function () { z.classList.remove("is-over"); });
      z.addEventListener("drop", function (e) {
        e.preventDefault();
        z.classList.remove("is-over");
        var id = null;
        try { id = e.dataTransfer.getData("text/plain"); } catch (err) { }
        if (!id && dragId) id = dragId;
        if (!id) return;
        var c = CANDIDATES.filter(function (x) { return x.id === +id; })[0];
        if (!c) return;
        var to = z.getAttribute("data-drop");
        if (c.stage === to) return;
        var from = c.stage;
        c.stage = to;
        toast(c.name.split(" ").slice(0, 2).join(" ") + ": «" + from + "» → «" + to + "»");
        paint(false);
      });
    });
    var dragId = null;
    Array.prototype.forEach.call(cards, function (card) {
      card.addEventListener("dragstart", function () { dragId = card.getAttribute("data-id"); });
    });
  }

  /* ---------------- Обработка кликов (делегирование) ---------------- */
  document.addEventListener("click", function (e) {
    var seg = e.target.closest ? e.target.closest('[data-role="seg"] button') : null;
    if (seg && !seg.getAttribute("data-action")) {
      Array.prototype.forEach.call(seg.parentNode.children, function (b) { b.classList.remove("is-on"); });
      seg.classList.add("is-on");
      return;
    }
    var t = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!t) return;
    var a = t.getAttribute("data-action");

    if (a === "go") { e.preventDefault(); go(t.getAttribute("data-screen"), true); return; }
    if (a === "toggle-sidebar") { state.collapsed = !state.collapsed; applyState(); return; }
    if (a === "toggle-theme") { toggleTheme(); return; }
    if (a === "set-theme") { state.theme = t.getAttribute("data-theme"); applyState(); paint(false); return; }
    if (a === "set-density") {
      state.density = t.getAttribute("data-density"); applyState();
      toast("Плотность: " + (state.density === "compact" ? "компактная" : "комфортная")); return;
    }
    if (a === "refresh") { paint(true); toast("Данные обновлены"); return; }
    if (a === "open-palette") { e.preventDefault(); openPalette(); return; }
    if (a === "close-palette") { closePalette(); return; }
    if (a === "open-drawer") { openDrawer(t.getAttribute("data-id"), 0); return; }
    if (a === "close-drawer") { closeDrawer(); return; }
    if (a === "drawer-tab") { openDrawer(state.drawerId, +t.getAttribute("data-tab")); return; }
    if (a === "task-done") {
      var id = t.getAttribute("data-id");
      var task = TASKS.filter(function (x) { return x.id === id; })[0];
      if (task && !task.done) {
        task.done = true; paint(false);
        var tt = view.querySelector('[data-task="' + id + '"]');
        if (tt) tt.classList.add("is-done");
        toast("Задача выполнена: " + task.title);
      }
      return;
    }
    if (a === "wiz-next-stage") {
      var cc = CANDIDATES.filter(function (x) { return x.id === +t.getAttribute("data-id"); })[0];
      if (cc) {
        var i = STAGES.indexOf(cc.stage);
        if (i < STAGES.length - 1) { cc.stage = STAGES[i + 1]; toast(cc.name.split(" ").slice(0, 2).join(" ") + " → «" + cc.stage + "»"); }
        openDrawer(cc.id, state.drawerTab);
      }
      return;
    }
    if (a === "wiz-next") { WIZARD_STEP = Math.min(3, WIZARD_STEP + 1); paint(false); return; }
    if (a === "wiz-prev") { WIZARD_STEP = Math.max(1, WIZARD_STEP - 1); paint(false); return; }
    if (a === "wiz-done") { WIZARD_STEP = 1; go("documents", true); toast("Список документов «Выход 05.10 — цех 3» создан", "success"); return; }
    if (a === "create") { toast("Форма создания кандидата открыта"); return; }
    if (a === "toast") { toast(t.getAttribute("data-msg")); return; }
    if (a === "toast-close") { var p = t.parentNode; p.classList.remove("is-in"); setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 240); return; }
    if (a === "switch") { return; }
  });

  /* Клавиатура */
  document.addEventListener("keydown", function (e) {
    var meta = e.ctrlKey || e.metaKey;
    if (meta && (e.key === "k" || e.key === "K")) { e.preventDefault(); state.paletteOpen ? closePalette() : openPalette(); return; }
    if (meta && e.key === "\\") { e.preventDefault(); state.collapsed = !state.collapsed; applyState(); return; }
    if (e.key === "Escape") {
      if (state.paletteOpen) { closePalette(); return; }
      if (state.drawerId) { closeDrawer(); return; }
    }
    if (state.paletteOpen) {
      if (e.key === "ArrowDown") { e.preventDefault(); state.pIndex = Math.min(filtered.length - 1, state.pIndex + 1); renderPalette(); scrollTo(); }
      if (e.key === "ArrowUp") { e.preventDefault(); state.pIndex = Math.max(0, state.pIndex - 1); renderPalette(); scrollTo(); }
      if (e.key === "Enter") {
        e.preventDefault();
        var it = filtered[state.pIndex];
        if (it) { closePalette(); it.act(); }
      }
      return;
    }
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("row")) { openDrawer(e.target.getAttribute("data-id"), 0); }
  });
  function scrollTo() {
    var on = paletteList.querySelector(".pitem.is-on");
    if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
  }
  paletteList.addEventListener("click", function (e) {
    var it = e.target.closest ? e.target.closest(".pitem") : null;
    if (!it) return;
    var idx = +it.getAttribute("data-pi");
    var item = filtered[idx];
    if (item) { closePalette(); item.act(); }
  });

  /* Навигация по hash */
  window.addEventListener("hashchange", function () {
    var id = (location.hash || "").replace("#/", "");
    if (id && VIEWS[id] && id !== state.screen) go(id, true);
  });

  /* Старт */
  function boot() {
    var id = (location.hash || "").replace("#/", "");
    state.screen = VIEWS[id] ? id : "queue";
    applyState();
    go(state.screen, true);
    setTimeout(function () { toast("Мокап загружен · Ctrl+K — командная палитра", "info"); }, 900);
  }

  /* Публичные хуки для переключателей в «Настройках» */
  document.addEventListener("change", function (e) {
    if (e.target.id === "set-fonts") {
      state.fonts = e.target.checked ? "system" : "app";
      applyState();
      toast(state.fonts === "system" ? "Системные шрифты включены" : "Загруженный шрифт включён");
    }
    if (e.target.id === "wz-notify") { WIZARD_FORM.notify = e.target.checked; }
  });

  boot();
})();
</script>
</body>
</html>
