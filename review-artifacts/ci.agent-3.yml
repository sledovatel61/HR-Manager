name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Ruff (lint + формат)
        run: |
          ruff check backend tests/backend
          ruff format --check backend tests/backend

      - name: Mypy (typecheck)
        working-directory: backend
        run: mypy

      - name: Тесты backend
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Тесты frontend
        run: npm run test

      - name: Сборка
        run: npm run build

  compose-smoke:
    name: Docker Compose smoke (сборка стека + /health)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Конфигурация из примера (без секретов)
        run: cp .env.example .env

      - name: Статическая валидация docker-compose.yml
        run: docker compose config --quiet

      - name: Сборка и запуск стека
        run: docker compose up --build --detach --wait

      - name: Health через nginx-прокси frontend
        run: curl --fail --silent --show-error http://127.0.0.1:8080/health

      - name: Health backend напрямую
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health

      - name: Остановка и очистка
        if: always()
        run: docker compose down --volumes
