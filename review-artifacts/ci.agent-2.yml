name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Mypy typecheck
        run: mypy app
      - name: Unit tests
        run: pytest -m "not integration" -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  integration:
    name: Backend integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hr_manager_test
          POSTGRES_USER: hr_manager
          POSTGRES_PASSWORD: hr_manager_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr_manager -d hr_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://hr_manager:hr_manager_ci_password@localhost:5432/hr_manager_test
        run: pytest -m integration -v

  stack:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose -f infra/docker-compose.yml up --build -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "backend health did not become ready" >&2
          docker compose -f infra/docker-compose.yml ps
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - name: Verify frontend serves the app and proxies the API
        run: |
          curl -fsS http://localhost:8080/ | grep -q "HR Manager"
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
      - name: Verify 503 degradation when the database stops
        run: |
          docker compose -f infra/docker-compose.yml stop db
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
          [ "$code" = "503" ] || { echo "expected 503, got $code" >&2; exit 1; }
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans
