# Phase 13/14: update channel release pipeline (Windows pilot).
#
# Собирает release channel только для ЗАЩИЩЁННЫХ SemVer-тегов `v*` (или
# ручного dispatch владельца): детерминированный пакет + внешний
# update-channel.json, подписанный Ed25519-ключом ИЗ SECRET, независимая
# проверка подписи тем публичным ключом, которому доверяет production-клиент,
# затем — публикация immutable артефактов (GitHub Release + SHA256SUMS +
# provenance). Существующий deploy/rollback workflow (release.yml) НЕ
# затрагивается: развёртывание серверной части и публикация канала
# Windows-пилота — раздельные цепочки без регрессии Phase 7/12.
#
# Phase 14: ДВЕ НЕЗАВИСИМЫЕ подписи выпуска.
#   1) Ed25519 channel-подпись manifest — обязательна (см. выше).
#   2) Authenticode-подпись installer — режим задаётся явным выбором
#      (тег v* => production, fail closed; dispatch => вход installer_signing).
#      Сертификат и пароль живут в ОТДЕЛЬНОМ environment `installer-signing`
#      и передаются sign-installer.ps1 ТОЛЬКО через env — никогда через
#      аргументы CLI, логи или артефакты. Production-режим отказывает
#      (fail closed), если сертификат не задан, installer не подписан,
#      нет валидного RFC 3161 timestamp, publisher не совпал или
#      signtool verify /pa /all не прошёл. Тестовый режим (ephemeral
#      self-signed сертификат раннера) помечает манифест
#      certificate_kind=test-self-signed и НИКОГДА не проходит
#      production-политику (infra/release/installer_signing.py).
#
# Секреты environment `update-channel-signing` (создать владельцу;
# НЕ включать в настройках environment ветки PR):
#   UPDATE_CHANNEL_SIGNING_KEY — закрытый Ed25519-ключ (64 hex или PEM);
#   UPDATE_CHANNEL_KEY_ID      — key_id подписи (напр. pilot-release-2026);
#   UPDATE_CHANNEL_PUBLIC_KEYS — trust store production-клиента, тот же JSON
#                                {key_id: {key, revoked}}, что в
#                                UPDATE_CHANNEL_PUBLIC_KEYS сервера.
# Секреты environment `installer-signing` (отдельный, для Authenticode):
#   INSTALLER_TRUST_STORE         — тот же trust store ПОЛНОЙ схемой
#                                   {schema_version:1, environment:"production",
#                                   keys:{...}} (канонический JSON; embed в
#                                   installer; сверяется с
#                                   UPDATE_CHANNEL_PUBLIC_KEYS канала);
#   INSTALLER_AUTHENTICODE_PFX_BASE64 / _PASSWORD / _TIMESTAMP_URL /
#   _PUBLISHER — production-сертификат (необходимы в режиме production);
#   INSTALLER_AUTHENTICODE_ROOT_PEM — PEM доверенного root CA (можно цепочку
#                                корней) для НЕЗАВИСИМОЙ проверки фактических
#                                байтов подписанного exe (публичный материал,
#                                НЕ приватный ключ; см. authenticode_verify.py);
#   INSTALLER_AUTHENTICODE_TSA_ROOT_PEM — PEM root CA timestamp-сервера
#                                (необязателен: по умолчанию root'ы подписанта).
# Те же значения (ROOT_PEM/TSA_ROOT_PEM/_PUBLISHER) дублируются в environment
# `update-channel-signing` джобы channel-release: независимый гейт обязан
# выполняться в джобе публикации НЕПОСРЕДСТВЕННО перед gh release create.
#
# Phase 14 (hardening): публикация НЕ доверяет signing manifest/attestation и
# строковым полям о результате signtool как единственному источнику истины.
# Перед публикацией запускается независимая криптографическая проверка
# фактических байтов PE (infra/release/authenticode_verify.py):
#   * корректный PE и наличие подписи в certificate table;
#   * digest образа совпадает с подписанным (модификация после подписи или
#     перенос подписи с другого файла обнаруживается);
#   * CMS/PKCS#7 криптографически верен, подпись подписанта проверена;
#   * EKU Code Signing у подписанта, EKU Time Stamping у TSA;
#   * цепочки до ЯВНО переданных корней (никаких системных хранилищ);
#   * publisher совпадает; SHA-1/MD5 запрещены (только SHA-256+);
#   * RFC 3161 timestamp присутствует и валиден (legacy MS timestamp отклонён),
#     messageImprint равен хешу подписи, genTime внутри срока сертификатов;
#   * манифест — только provenance: SHA256/publisher/mode сверяются с
#     фактическими байтами, подделка манифеста ничего не даёт.
# Installer после подписания НЕ пересобирается и не модифицируется: publish
# использует скачанный артефакт и повторно проверяет его байты (гейт + SHA256).
#
# Все сторонние actions закреплены полными commit SHA (см. uses: ниже) —
# плавающие теги в signing/release джобах исключены.
#
# Phase 14: доставка trust configuration. Публичный trust store релиза
# встраивается и в installer (installer/build.ps1 -TrustStore), и в пакет
# канала (release-trust-store.json в снимке); publish_channel.py блокирует
# выпуск (trust_store_mismatch), если встроенный store не проходит строгую
# схему infra/release/trust_store.py, расходится с trust store релиза или
# не содержит неотозванный ключ подписи. Канал публикует trust-store.json
# рядом с SHA256SUMS; целостность installer-копии сверяется по SHA256
# перед публикацией релиза.
#
# Fail closed: без signing key (или с неверным) pipeline падает ДО создания
# unsigned manifest — см. infra/release/publish_channel.py.
#
# Production signing secret НЕ доступен коду из PR/fork: триггеров
# pull_request нет, signing выполняется только внутри environment-джоба.
#
# Dispatch-безопасность: при ручном запуске release_sha обязателен,
# проверяется (40 hex, существует в репозитории), checkout выполняется по
# нему, и сборка начинается только если HEAD == release_sha; релиз/тег
# создаётся `--target` на тот же SHA. Все входные значения dispatch
# попадают в shell-скрипты ТОЛЬКО через env (никаких inline-expressions
# от пользователя) — shell injection исключён. Перед записью в
# $GITHUB_OUTPUT version/sha/notes_ru валидируются fail closed на CR/LF:
# многострочное значение не может подмешать поддельные строки-выводы
# (например sha=<другой SHA>).
#
# Защита тегов (владелец): tag protection rules — разрешить только `v*`
# (SemVer), писать теги может только владелец/CI.
name: Update channel release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer release (например 0.14.0)"
        required: true
      release_sha:
        description: "Полный Git commit (40 hex)"
        required: true
      notes_ru:
        description: "Примечания к релизу (одна строка)"
        required: false
      installer_signing:
        description: "Режим Authenticode-подписи установщика"
        type: choice
        options: ["production", "test"]
        default: "production"

permissions:
  contents: read

env:
  # Порог поддержки канала: менять владельцу при поднятии планки
  # (аналог ExpectedHeadRevision в Windows-движке).
  MINIMUM_SUPPORTED_VERSION: "0.13.0"

jobs:
  windows-installer:
    name: Build and Authenticode-sign Windows installer
    runs-on: windows-latest
    environment: installer-signing
    outputs:
      signing_mode: ${{ steps.authsign.outputs.signing_mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve and verify release commit
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          reject_newline() {
            case "$1" in
              *$'\r'*|*$'\n'*)
                echo "error: $2 must be a single line (CR/LF rejected)" >&2
                exit 2
                ;;
            esac
          }
          if [ "$EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            sha="$(git rev-parse HEAD)"
          else
            version="$INPUT_VERSION"
            sha="$INPUT_SHA"
          fi
          # Fail closed ДО записи в $GITHUB_OUTPUT: CR/LF дали бы возможность
          # подмешать поддельные строки-выводы (например sha=<другой SHA>).
          reject_newline "$version" "version"
          reject_newline "$sha" "release_sha"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "error: version must be SemVer x.y.z" >&2; exit 2; }
          if [ "$EVENT_NAME" != "push" ]; then
            echo "$sha" | grep -Eq '^[0-9a-fA-F]{40}$' || {
              echo "error: release_sha must be a full 40-char git SHA" >&2; exit 2; }
            git cat-file -e "$sha^{commit}" || {
              echo "error: release_sha does not exist in the repository" >&2; exit 2; }
            git checkout -q "$sha"
          fi
          [ "$(git rev-parse HEAD)" = "$sha" ] || {
            echo "error: checkout HEAD != release_sha" >&2; exit 2; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve signing mode and timestamp source (fail closed)
        id: signing
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SIGNING: ${{ inputs.installer_signing }}
          PROD_TIMESTAMP_URL: ${{ secrets.INSTALLER_AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            mode="production"
          else
            mode="$INPUT_SIGNING"
          fi
          case "$mode" in
            production|test) ;;
            *) echo "error: installer signing mode must be production or test (got '$mode')" >&2; exit 2 ;;
          esac
          # Test-режим штампует время ЛОКАЛЬНЫМ эфемерным RFC 3161 TSA
          # (infra/scripts/drill_tsa_server.py): контракт timestamp проверяется
          # полностью и без внешней сети; production использует TSA владельца.
          if [ "$mode" = "test" ]; then
            ts_url="http://127.0.0.1:8743"
          else
            : "${PROD_TIMESTAMP_URL:?secret INSTALLER_AUTHENTICODE_TIMESTAMP_URL is required in production mode}"
            ts_url="$PROD_TIMESTAMP_URL"
          fi
          {
            echo "mode=$mode"
            echo "timestamp_url=$ts_url"
          } >> "$GITHUB_OUTPUT"

      - name: Materialize public trust store from protected input
        shell: powershell
        env:
          INSTALLER_TRUST_STORE: ${{ secrets.INSTALLER_TRUST_STORE }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:INSTALLER_TRUST_STORE) {
            Write-Host "::error::secret INSTALLER_TRUST_STORE (environment installer-signing) is required: the installer must embed the release trust store"
            exit 1
          }
          # Канонический байтовый образ (sort_keys, indent 2) — тот же, что
          # генерирует channel-release из UPDATE_CHANNEL_PUBLIC_KEYS: SHA256
          # обеих копий обязан совпасть перед публикацией.
          $env:INSTALLER_TRUST_STORE | Out-File -Encoding utf8NoBOM -NoNewline "$env:RUNNER_TEMP\trust-input.json"
          python - "$env:RUNNER_TEMP\trust-input.json" "$env:RUNNER_TEMP\release-trust-store.json" <<'PY'
          import hashlib, json, sys
          flat = json.loads(open(sys.argv[1], encoding="utf-8-sig").read())
          canonical = json.dumps(
              {"schema_version": 1, "environment": "production", "keys": flat},
              ensure_ascii=False, sort_keys=True, indent=2,
          ) + "\n"
          open(sys.argv[2], "w", encoding="utf-8", newline="\n").write(canonical)
          print("trust store sha256:", hashlib.sha256(canonical.encode("utf-8")).hexdigest())
          PY
          if ($LASTEXITCODE -ne 0) { throw "trust store canonicalization failed" }

      - name: Install independent verifier dependencies (pinned)
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check asn1crypto==1.5.1 cryptography==50.0.1
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Start local RFC 3161 TSA (ephemeral, test mode only)
        shell: powershell
        if: steps.signing.outputs.mode == 'test'
        run: |
          $ErrorActionPreference = "Stop"
          $tsaDir = Join-Path $env:RUNNER_TEMP "tsa"
          New-Item -ItemType Directory -Force -Path $tsaDir | Out-Null
          # Эфемерный TSA живёт только в рамках этого раннера; сертификат —
          # самоподписанный, публичный (секретов нет).
          $proc = Start-Process -FilePath "python" `
            -ArgumentList @("infra/scripts/drill_tsa_server.py", "--port", "8743", "--cert-dir", $tsaDir) `
            -PassThru -WindowStyle Hidden
          $proc.Id | Out-File -FilePath (Join-Path $tsaDir "tsa.pid") -Encoding ascii
          $deadline = (Get-Date).AddSeconds(60)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8743/" -TimeoutSec 2 | Out-Null
              $ready = $true; break
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) { throw "local TSA did not become ready" }
          # signtool verify /pa /all проверяет и countersignature-цепочку:
          # TSA-сертификат доверяется ТОЛЬКО в рамках ephemeral-раннера.
          $null = Import-Certificate -FilePath (Join-Path $tsaDir "tsa-cert.der") -CertStoreLocation "Cert:\CurrentUser\Root"
          # Публичный TSA-сертификат едет артефактом: независимый гейт в джобе
          # channel-release проверит timestamp до того же эфемерного корня.
          Copy-Item (Join-Path $tsaDir "tsa-cert.pem") -Destination "installer/output/tsa-cert.pem" -Force

      - name: Build installer (Inno Setup 6.7.3, SHA256 pinned in build.ps1)
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1 -Version $env:VERSION -TrustStore "$env:RUNNER_TEMP\release-trust-store.json"

      - name: Sign installer (Authenticode, fail closed)
        id: authsign
        shell: powershell
        env:
          # Режим вычислен на предыдущем шаге (тег v* — всегда production,
          # fail closed). Вход приходит только через env, не в run-блок.
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          HRM_SIGNING_PFX_BASE64: ${{ secrets.INSTALLER_AUTHENTICODE_PFX_BASE64 }}
          HRM_SIGNING_PFX_PASSWORD: ${{ secrets.INSTALLER_AUTHENTICODE_PFX_PASSWORD }}
          # Test-режим: локальный эфемерный TSA; production: TSA владельца.
          HRM_SIGNING_TIMESTAMP_URL: ${{ steps.signing.outputs.timestamp_url }}
          HRM_SIGNING_PUBLISHER: ${{ secrets.INSTALLER_AUTHENTICODE_PUBLISHER }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:SIGNING_MODE -ne "production" -and $env:SIGNING_MODE -ne "test") {
            throw "installer_signing must be production or test (got '$env:SIGNING_MODE')"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/sign-installer.ps1 -Mode $env:SIGNING_MODE
          if ($LASTEXITCODE -ne 0) { throw "sign-installer.ps1 failed (mode=$env:SIGNING_MODE)" }
          # Независимая машинная проверка контракта подписи ПОСЛЕ подписи
          # (production: signed + timestamp + publisher + signtool + SHA256).
          python infra/release/installer_signing.py verify-manifest `
            --manifest installer/release-manifest.json --mode $env:SIGNING_MODE `
            --exe-dir installer/output
          if ($LASTEXITCODE -ne 0) { throw "signing contract verification failed (mode=$env:SIGNING_MODE)" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value ("signing_mode=" + $env:SIGNING_MODE)

      - name: Independent Authenticode gate on signed bytes (fail closed)
        # НЕ доверяем release-manifest/attestation и строковым полям о
        # результате signtool: проверяем ФАКТИЧЕСКИЕ байты подписанного exe.
        shell: powershell
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          EXPECTED_PUBLISHER: ${{ secrets.INSTALLER_AUTHENTICODE_PUBLISHER }}
          SIGNER_ROOT_PEM: ${{ secrets.INSTALLER_AUTHENTICODE_ROOT_PEM }}
          TSA_ROOT_PEM: ${{ secrets.INSTALLER_AUTHENTICODE_TSA_ROOT_PEM }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Get-ChildItem "installer/output/HR-Manager-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $exe) { throw "installer exe not found" }
          if ($env:SIGNING_MODE -eq "production") {
            if (-not $env:SIGNER_ROOT_PEM) {
              throw "production: secret INSTALLER_AUTHENTICODE_ROOT_PEM is required: independent gate refuses to verify without explicit roots"
            }
            $rootPem = Join-Path $env:RUNNER_TEMP "installer-root.pem"
            [System.IO.File]::WriteAllText($rootPem, $env:SIGNER_ROOT_PEM, [System.Text.Encoding]::UTF8)
            $gateArgs = @(
              "infra/release/authenticode_verify.py", "release-gate",
              "--exe", $exe,
              "--manifest", "installer/release-manifest.json",
              "--expected-publisher", $env:EXPECTED_PUBLISHER,
              "--mode", "production",
              "--trusted-root", $rootPem
            )
            if ($env:TSA_ROOT_PEM) {
              $tsaRootPem = Join-Path $env:RUNNER_TEMP "installer-tsa-root.pem"
              [System.IO.File]::WriteAllText($tsaRootPem, $env:TSA_ROOT_PEM, [System.Text.Encoding]::UTF8)
              $gateArgs += @("--timestamproot", $tsaRootPem)
            }
            Write-Host "independent Authenticode gate (production): verifying actual PE bytes against explicit roots"
            python $gateArgs
            if ($LASTEXITCODE -ne 0) { throw "independent Authenticode gate FAILED (production): publish would be refused" }
          }
          else {
            # Test-режим: корни — фактические эфемерные сертификаты раннера
            # (подписант из хранилища + локальный TSA), а не системные.
            $tsaPem = Join-Path $env:RUNNER_TEMP "tsa/tsa-cert.pem"
            python infra/release/authenticode_verify.py release-gate `
              --exe $exe `
              --manifest installer/release-manifest.json `
              --expected-publisher "CN=HR Manager CI Test Signing" `
              --trusted-root installer/output/signer-public.pem `
              --timestamproot $tsaPem `
              --mode test
            if ($LASTEXITCODE -ne 0) { throw "independent Authenticode gate FAILED (test)" }
          }

      - name: Stop local TSA (test mode only)
        shell: powershell
        if: always() && steps.signing.outputs.mode == 'test'
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP "tsa/tsa.pid"
          if (Test-Path $pidFile) {
            $tsaPid = (Get-Content $pidFile | Select-Object -First 1).Trim()
            if ($tsaPid) { Stop-Process -Id ([int]$tsaPid) -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload signed installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hr-manager-windows-setup
          path: |
            installer/output/*.exe
            installer/release-manifest.json
            installer/output/*.pem
          if-no-files-found: error

  channel-release:
    name: Build, sign, verify and publish update channel
    needs: windows-installer
    runs-on: ubuntu-latest
    environment: update-channel-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve release facts (protected SemVer tag or owner dispatch)
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.release_sha }}
          INPUT_NOTES: ${{ inputs.notes_ru }}
        run: |
          set -euo pipefail
          reject_newline() {
            case "$1" in
              *$'\r'*|*$'\n'*)
                echo "error: $2 must be a single line (CR/LF rejected)" >&2
                exit 2
                ;;
            esac
          }
          notes=""
          if [ "$EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            sha="$(git rev-parse HEAD)"
          else
            version="$INPUT_VERSION"
            sha="$INPUT_SHA"
            notes="$INPUT_NOTES"
          fi
          # Fail closed ДО любой записи в $GITHUB_OUTPUT: многострочные
          # version/sha/notes могли бы добавить поддельные строки-выводы
          # (например sha=<другой SHA>, tag=<чужой тег>).
          reject_newline "$version" "version"
          reject_newline "$sha" "release_sha"
          reject_newline "$notes" "notes_ru"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "error: version must be SemVer x.y.z" >&2; exit 2; }
          if [ "$EVENT_NAME" != "push" ]; then
            echo "$sha" | grep -Eq '^[0-9a-fA-F]{40}$' || {
              echo "error: release_sha must be a full 40-char git SHA" >&2; exit 2; }
            git cat-file -e "$sha^{commit}" || {
              echo "error: release_sha does not exist in the repository" >&2; exit 2; }
            git checkout -q "$sha"
          fi
          # Сборка и manifest — строго из подтверждённого SHA.
          [ "$(git rev-parse HEAD)" = "$sha" ] || {
            echo "error: checkout HEAD != release_sha" >&2; exit 2; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Immutable URL пакета (детерминированный: известен до публикации;
          # активы GitHub Release неизменяемы после загрузки).
          echo "package_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/v$version/hr-manager-windows-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Mandatory CI checks must be green for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=20" \
            --jq '.workflow_runs[] | select(.name=="CI" and .status=="completed" and .conclusion=="success") | .head_sha' | head -1)"
          [ -n "$runs" ] || { echo "error: no successful CI run for ${SHA}; release refused" >&2; exit 1; }
          echo "CI is green for ${SHA}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install channel tooling (pinned)
        run: pip install cryptography==50.0.1 asn1crypto==1.5.1

      - name: Prepare snapshot (backend + frontend + infra + release.json + trust store)
        id: snapshot
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
          TRUSTED_KEYS: ${{ secrets.UPDATE_CHANNEL_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          : "${TRUSTED_KEYS:?UPDATE_CHANNEL_PUBLIC_KEYS secret is required}"
          snapshot="$(mktemp -d)/app"
          mkdir -p "$snapshot"
          cp -R backend "$snapshot/backend"
          cp -R frontend "$snapshot/frontend"
          cp -R infra "$snapshot/infra"
          python3 - "$snapshot/release.json" <<'PY'
          import json, os, sys
          from datetime import UTC, datetime
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump({
                  "version": os.environ["VERSION"],
                  "release_sha": os.environ["SHA"],
                  "built_at": datetime.now(UTC).strftime("%%Y-%m-%dT%H:%M:%SZ"),
              }, fh, ensure_ascii=False)
          PY
          # Phase 14: публичный trust store релиза встраивается в пакет
          # (release-trust-store.json) тем же каноническим образом, что и в
          # installer; publish_channel.py сверит его с --public-keys-json.
          printf '%s' "$TRUSTED_KEYS" > "$RUNNER_TEMP/trusted-keys-input.json"
          python3 - "$RUNNER_TEMP/trusted-keys-input.json" "$snapshot/release-trust-store.json" <<'PY'
          import hashlib, json, os, sys
          flat = json.loads(open(sys.argv[1], encoding="utf-8").read())
          canonical = json.dumps(
              {"schema_version": 1, "environment": "production", "keys": flat},
              ensure_ascii=False, sort_keys=True, indent=2,
          ) + "\n"
          open(sys.argv[2], "w", encoding="utf-8", newline="\n").write(canonical)
          print("embedded trust store sha256:", hashlib.sha256(canonical.encode("utf-8")).hexdigest())
          PY
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"

      - name: Build package, sign manifest, verify with client-trusted key
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
          NOTES: ${{ steps.release.outputs.notes }}
          PACKAGE_URL: ${{ steps.release.outputs.package_url }}
          SNAPSHOT: ${{ steps.snapshot.outputs.snapshot }}
          # Секреты environment update-channel-signing. Fail closed:
          # publish_channel.py падает, если ключ или trust store отсутствуют.
          SIGNING_KEY: ${{ secrets.UPDATE_CHANNEL_SIGNING_KEY }}
          KEY_ID: ${{ secrets.UPDATE_CHANNEL_KEY_ID }}
          TRUSTED_KEYS: ${{ secrets.UPDATE_CHANNEL_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEY:?UPDATE_CHANNEL_SIGNING_KEY secret is required}"
          : "${KEY_ID:?UPDATE_CHANNEL_KEY_ID secret is required}"
          : "${TRUSTED_KEYS:?UPDATE_CHANNEL_PUBLIC_KEYS secret is required}"
          printf '%s' "$SIGNING_KEY" > /tmp/update-channel-signing.key
          printf '%s' "$TRUSTED_KEYS" > /tmp/update-channel-trusted-keys.json
          python3 infra/release/publish_channel.py \
            --snapshot "$SNAPSHOT" \
            --version "$VERSION" \
            --release-sha "$SHA" \
            --package-url "$PACKAGE_URL" \
            --minimum-supported-version "$MINIMUM_SUPPORTED_VERSION" \
            --notes-ru "$NOTES" \
            --private-key /tmp/update-channel-signing.key \
            --key-id "$KEY_ID" \
            --public-keys-json /tmp/update-channel-trusted-keys.json \
            --out-dir dist/channel
          rm -f /tmp/update-channel-signing.key

      - name: Attest package provenance (no signing secret involved)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/channel/hr-manager-windows-${{ steps.release.outputs.version }}.zip"

      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hr-manager-windows-setup
          path: dist/channel/installer

      - name: Verify installer signing contract and embedded trust store (fail closed)
        env:
          SIGNING_MODE: ${{ needs.windows-installer.outputs.signing_mode }}
          TRUSTED_KEYS: ${{ secrets.UPDATE_CHANNEL_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          : "${SIGNING_MODE:?windows-installer must expose signing_mode}"
          # 1) Криптографический контракт подписи (production: signed +
          #    timestamp + publisher + signtool + пересчитанный SHA256 exe).
          python3 infra/release/installer_signing.py verify-manifest \
            --manifest dist/channel/installer/release-manifest.json \
            --mode "$SIGNING_MODE"
          # 2) Встроенный в installer trust store — ПОБАЙТОВО тот же, что
          #    доверен каналу: подмена trust store блокирует публикацию.
          python3 - dist/channel/installer/release-trust-store.json "$TRUSTED_KEYS" <<'PY'
          import hashlib, json, sys
          embedded = json.loads(open(sys.argv[1], encoding="utf-8-sig").read())
          flat = json.loads(sys.argv[2])
          canonical = json.dumps(
              {"schema_version": 1, "environment": "production", "keys": flat},
              ensure_ascii=False, sort_keys=True, indent=2,
          ) + "\n"
          actual = json.dumps(embedded, ensure_ascii=False, sort_keys=True, indent=2) + "\n"
          if actual != canonical:
              print("error: installer trust store != channel trust store", file=sys.stderr)
              sys.exit(1)
          print("installer trust store sha256:", hashlib.sha256(canonical.encode("utf-8")).hexdigest())
          PY
          # 3) SHA256 подписанного exe из манифеста совпадает с загруженным
          #    артефактом (нельзя подменить exe после подписи).
          python3 - dist/channel/installer <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          manifest = json.loads((Path(sys.argv[1]) / "release-manifest.json").read_text(encoding="utf-8-sig"))
          exe = Path(sys.argv[1]) / manifest["installer_exe"]["file"]
          actual = hashlib.sha256(exe.read_bytes()).hexdigest()
          if actual != manifest["installer_exe"]["sha256"].lower():
              print(f"error: signed exe SHA256 mismatch: {actual}", file=sys.stderr)
              sys.exit(1)
          print("signed installer sha256:", actual)
          PY

      - name: Independent Authenticode release gate (immediately before publish, fail closed)
        # Финальная независимая криптографическая проверка ФАКТИЧЕСКИХ байтов
        # установщика, скачанного из артефакта, — непосредственно перед gh
        # release create. Манифест/attestation здесь — только provenance:
        # подделанный манифест не может «доказать» подпись или целостность.
        # Installer после подписания не пересобирается: гейт проверяет тот же
        # exe, что был подписан в windows-installer, и тот же, что уйдёт в
        # релиз (SHA256 сверяется гейтом с манифестом и самими байтами).
        env:
          SIGNING_MODE: ${{ needs.windows-installer.outputs.signing_mode }}
          EXPECTED_PUBLISHER: ${{ secrets.INSTALLER_AUTHENTICODE_PUBLISHER }}
          SIGNER_ROOT_PEM: ${{ secrets.INSTALLER_AUTHENTICODE_ROOT_PEM }}
          TSA_ROOT_PEM: ${{ secrets.INSTALLER_AUTHENTICODE_TSA_ROOT_PEM }}
        run: |
          set -euo pipefail
          : "${SIGNING_MODE:?windows-installer must expose signing_mode}"
          exe="$(ls dist/channel/installer/HR-Manager-Setup-*.exe | head -1)"
          [ -n "$exe" ] || { echo "error: installer exe missing" >&2; exit 1; }
          if [ "$SIGNING_MODE" = "production" ]; then
            # Корни production — ТОЛЬКО из owner-конфигурации environment
            # (публичный материал); их отсутствие — отказ публиковать.
            : "${EXPECTED_PUBLISHER:?secret INSTALLER_AUTHENTICODE_PUBLISHER is required in this environment}"
            : "${SIGNER_ROOT_PEM:?secret INSTALLER_AUTHENTICODE_ROOT_PEM is required in this environment (independent gate)}"
            printf '%s' "$SIGNER_ROOT_PEM" > "$RUNNER_TEMP/installer-root.pem"
            root_args=(--trusted-root "$RUNNER_TEMP/installer-root.pem")
            if [ -n "${TSA_ROOT_PEM:-}" ]; then
              printf '%s' "$TSA_ROOT_PEM" > "$RUNNER_TEMP/installer-tsa-root.pem"
              root_args+=(--timestamproot "$RUNNER_TEMP/installer-tsa-root.pem")
            fi
            echo "independent Authenticode gate (production): verifying downloaded artifact bytes against explicit roots"
            python3 infra/release/authenticode_verify.py release-gate \
              --exe "$exe" \
              --manifest dist/channel/installer/release-manifest.json \
              --expected-publisher "$EXPECTED_PUBLISHER" \
              --mode production \
              "${root_args[@]}"
          else
            # Test-режим: корни — публичные эфемерные сертификаты, приехавшие
            # тем же артефактом из windows-installer (подписант + локальный TSA).
            python3 infra/release/authenticode_verify.py release-gate \
              --exe "$exe" \
              --manifest dist/channel/installer/release-manifest.json \
              --expected-publisher "CN=HR Manager CI Test Signing" \
              --mode test \
              --trusted-root dist/channel/installer/signer-public.pem \
              --timestamproot dist/channel/installer/tsa-cert.pem
          fi

      - name: Publish immutable GitHub Release (draft, assets verified above)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
          NOTES: ${{ steps.release.outputs.notes }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          setup_exe="$(ls dist/channel/installer/HR-Manager-Setup-*.exe | head -1)"
          [ -n "$setup_exe" ] || { echo "error: installer exe missing" >&2; exit 1; }
          # Тег/релиз создаются --target на тот же SHA, из которого собрано.
          gh release create "$TAG" \
            --target "$SHA" \
            --draft \
            --title "HR Manager Windows pilot $VERSION" \
            --notes "${NOTES:-$VERSION}" \
            "dist/channel/hr-manager-windows-$VERSION.zip" \
            "dist/channel/update-channel.json" \
            "dist/channel/trust-store.json" \
            "dist/channel/SHA256SUMS" \
            "$setup_exe"
