name: hr-manager

# Локальный dev-стек Этапа 1: PostgreSQL + backend (FastAPI) + frontend (Vite).
# Запуск:  docker compose up --build
# Переменные из .env (см. .env.example) переопределяют значения по умолчанию.
# Значения по умолчанию ниже предназначены ТОЛЬКО для локальной разработки
# и не должны использоваться в production (backend это проверяет при APP_ENV=production).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hr_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-hr_manager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr_manager} -d ${POSTGRES_DB:-hr_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # При старте применяются миграции (Alembic), затем поднимается API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn hr_manager.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Внутри compose-сети PostgreSQL доступен по имени сервиса "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hr_manager}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-hr_manager}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      # Живая разработка: изменения кода и миграций подхватываются без пересборки.
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      # Адрес backend для dev-прокси Vite (внутри compose-сети).
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      # node_modules живёт в volume, чтобы bind-mount ./frontend его не прятал.
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  frontend_node_modules:
